name: BharathLink Isolated Auth Probe COMPILE ONLY — Release HOLD

on:
  workflow_dispatch:
  push:
    branches:
      - bharathlink-auth-probe-isolated-v1-test
    paths:
      - 'android-auth-probe/**'
      - 'android-keyprep/NativeTestAuth.kt'
      - 'android-keyprep/NativeAuthConfig.kt'
      - 'android-keyprep/EphemeralTestSession.kt'
      - 'android-keyprep/AuthBindingPolicy.kt'
      - '.github/scripts/v36hf_auth_probe_isolated.py'
      - '.github/workflows/build-isolated-auth-probe-test.yml'

permissions:
  contents: read

jobs:
  stateless-otp-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Source archive SHA256 integrity
        shell: bash
        run: |
          set -euo pipefail
          echo '77bed5a87934d3a674f4f59b00cb652d16f7afcda27225a1280ec20d1502db3c  BharathLink-V36HF-SecurityPatch-TEST-SOURCE-READY.zip' | sha256sum -c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build isolated native-only Android TEST source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v36hf-kotlin-build
          unzip -q BharathLink-V36HF-SecurityPatch-TEST-SOURCE-READY.zip -d v36hf-kotlin-build
          python3 .github/scripts/v36hf_startup_rescue.py
          python3 .github/scripts/v36hf_webview_diag.py
          python3 .github/scripts/v36hf_auth_probe_isolated.py
      - name: Enforce no old KeyPrep identity or device trust
        shell: bash
        run: |
          set -euo pipefail
          SRC=v36hf-kotlin-build/app/src/main/java/com/bharathlink/app/keyprep
          test ! -e "$SRC/DeviceKeyPrepActivity.kt"
          grep -q 'applicationIdSuffix = ".test.authprobe"' v36hf-kotlin-build/app/build.gradle.kts
          grep -q 'create_user", false' "$SRC/NativeTestAuth.kt"
          grep -q '/auth/v1/user' "$SRC/NativeTestAuth.kt"
          ! grep -rE 'SUPABASE_SERVICE_ROLE_KEY|addJavascriptInterface|bl20_commit_device_approval|bl20_candidate_proof_finish|register_e2ee_v2_device' "$SRC"
          ! grep -E 'KeyStore|LocalApprovalKeys' "$SRC/NativeAuthProbeActivity.kt"
      - name: Compile and execute TEST-only authentication JUnit cases (NO APK)
        working-directory: v36hf-kotlin-build
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Confirm tests executed, release HOLD, and zero APK output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path("v36hf-kotlin-build/app/build/test-results/testDebugUnitTest")
          reports=list(folder.glob("TEST-*.xml"))
          assert reports,"No executed Android JUnit reports"
          total=0
          for file in reports:
              t=ET.parse(file).getroot()
              total+=int(t.get("tests","0"))
              for key in ("failures","errors","skipped"):
                  assert int(t.get(key,"0"))==0,(file,key)
          assert total>=3,"Insufficient executed authentication tests"
          print(f"PASS: {total} native Auth Probe JUnit tests, zero failed/skipped")
          PY
          test ! -d v36hf-kotlin-build/app/build/outputs/apk
          grep -Fq 'applicationIdSuffix = ".test.authprobe"' v36hf-kotlin-build/app/build.gradle.kts
          echo 'HOLD: historic Auth Probe OTP succeeded; Play Protect issue remains unresolved for later Phase7A. No new debug APK uploaded.'
