name: Security Shield TEST checks
on:
  push:
    branches:
      - 'feature/security-shield-test-2026-11-06'
  pull_request:
    paths:
      - 'index.html'
      - 'security-shield.js'
      - 'tests/security-shield.test.mjs'
      - '.github/workflows/security-shield-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: node --test tests/security-shield.test.mjs
      - name: Static inline JavaScript parse
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const match=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!match)throw new Error('Inline application script missing');
          new vm.Script(match[1]);
          console.log('Inline app syntax OK');
          NODE
      - name: Package TEST site (no deploy)
        run: |
          mkdir -p dist
          cp index.html security-shield.js bharatmail-sw.js dist/
          test -s dist/index.html
          test -s dist/security-shield.js
      - name: Upload consolidated TEST ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BharatLink-Security-Shield-TEST-Netlify-ready
          path: dist/
          if-no-files-found: error
          retention-days: 7
