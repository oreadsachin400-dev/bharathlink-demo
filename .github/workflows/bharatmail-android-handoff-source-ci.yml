name: BharathMail Android Security TEST handoff — SOURCE ONLY (NO APK)

on:
  push:
    branches: [bharathlink-mail-resend-live-dkim-readonly]
    paths:
      - 'BharathLink-Android/app/src/main/java/in/bharathlink/demo/MainActivity.java'
      - 'BharathLink-Android/app/src/main/java/in/bharathlink/demo/MailSecurityLinkPolicy.java'
      - 'tests/android-mail-safety-source.test.mjs'
      - 'tests/android-mail-safety/MailSecurityLinkPolicyTest.java'
      - '.github/workflows/bharatmail-android-handoff-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-no-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Java allowlist policy adversarial cases (no Android SDK or APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bl-mail-android-handoff
          javac --release 17 -d /tmp/bl-mail-android-handoff \
            BharathLink-Android/app/src/main/java/in/bharathlink/demo/MailSecurityLinkPolicy.java \
            tests/android-mail-safety/MailSecurityLinkPolicyTest.java
          java -cp /tmp/bl-mail-android-handoff in.bharathlink.demo.MailSecurityLinkPolicyTest
      - name: Source and release HOLD assertions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/android-mail-safety-source.test.mjs
          grep -Fq 'if: false' .github/workflows/build-android-test.yml
          ! find /tmp/bl-mail-android-handoff -name '*.apk' | grep -q .
