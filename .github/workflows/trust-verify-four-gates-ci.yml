name: Trust Verify four-gate safety CI
on:
  push:
    branches:
      - feature/trust-verify-four-gates-20261105
    paths:
      - index.html
      - tests/**
      - .github/workflows/trust-verify-four-gates-ci.yml
  workflow_dispatch:
jobs:
  trust-verify-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only trust gate and existing profile regressions
        run: node --test tests/*.test.mjs
