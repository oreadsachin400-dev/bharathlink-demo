name: BharathLink Phase 7P — external checkpoint continuity (OFFLINE)
on:
  push:
    branches:
      - bharathlink-phase7p-witness-checkpoint-consistency-ci
    paths:
      - recovery-gate/witness-log-consistency.mjs
      - tests/phase7p-witness-log-consistency.test.mjs
      - .github/workflows/phase7p-witness-checkpoint-ci.yml
  pull_request:
    branches:
      - bharathlink-phase7o-external-audit-witness-ci
    paths:
      - recovery-gate/witness-log-consistency.mjs
      - tests/phase7p-witness-log-consistency.test.mjs
      - .github/workflows/phase7p-witness-checkpoint-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-witness-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed checkpoint continuity, replay and retained Phase 7I-O regressions
        run: |
          set -euo pipefail
          node --test tests/phase7p-witness-log-consistency.test.mjs tests/phase7o-external-witness.test.mjs tests/phase7n-owner-hash-ingress.test.mjs tests/phase7m-verified-ledger-bridge.test.mjs tests/phase7l-ledger-contract.test.mjs tests/phase7k-dual-review-evidence.test.mjs tests/phase7j-trust-posture.test.mjs tests/phase7i-first-device-hold-contract.test.mjs
      - name: Enforce no live authorization or storage writes
        run: |
          set -euo pipefail
          ! grep -Eq 'deviceApproved:[[:space:]]*true|canActivate:[[:space:]]*true|e2eeReady:[[:space:]]*true' recovery-gate/witness-log-consistency.mjs
          ! grep -Eq 'fetch[(]|INSERT INTO|UPDATE public[.]|supabase[.]|service_role' recovery-gate/witness-log-consistency.mjs
          echo 'PASS: signed checkpoint consistency proof only; no witness store, device activation or deploy'
