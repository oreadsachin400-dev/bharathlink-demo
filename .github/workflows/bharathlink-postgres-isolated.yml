name: BharathLink isolated PostgreSQL V38 gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-v38:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: bharathlink_disposable_v30
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bharathlink_disposable_v30"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Require V38 sources (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          for file in run_local.sh validate_target.py bootstrap_local.sql schema_NOT_FOR_LIVE.sql assertions_local.sql; do
            test -s "security/v38/$file" || { echo "::error::Missing security/v38/$file; V38 integration NOT RUN"; exit 1; }
          done
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run actual V38 PostgreSQL integration
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
        run: |
          set -euo pipefail
          bash security/v38/run_local.sh
