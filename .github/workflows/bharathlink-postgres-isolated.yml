name: BharathLink isolated PostgreSQL V38 gate
on:
  push:
    branches:
      - security/v38-postgres-isolated-ci
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-v38:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: bharathlink_disposable_v30
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bharathlink_disposable_v30"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Require V38 sources (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          for file in run_local.sh validate_target.py bootstrap_local.sql schema_NOT_FOR_LIVE.sql assertions_local.sql static_check.py test_target_guard.py test_bootstrap_contract.py test_runner_contract.py; do
            test -s "security/v38/$file" || { echo "::error::Missing security/v38/$file; V38 integration NOT RUN"; exit 1; }
          done
      - name: Run V38 static and regression checks
        run: |
          set -euo pipefail
          cd security/v38
          python3 static_check.py
          python3 -m unittest discover -p 'test_*.py' -v
          bash -n run_local.sh
      - name: Test offline enrollment authorization reference (not deployed)
        run: |
          set -euo pipefail
          cd security/v38
          python3 -m unittest -v test_enrollment_authorization_reference.py
      - name: Test offline P-256 approval verifier (approval remains disabled)
        run: node --test security/v38/verify_approval.test.mjs security/v38/approval_transcript.test.mjs security/v38/authorize_approval.test.mjs security/v38/verify_enrollment_boundary.test.mjs security/v38/prepare_verified_enrollment.test.mjs security/v38/candidate_key_digest.test.mjs security/v38/enroll_approved_v2_reference.test.mjs security/v38/postgres_enrollment_adapter.test.mjs security/v38/approved_enrollment_handler.test.mjs security/v38/signed_enrollment_adapter_integration.test.mjs security/v38/postgres_enrollment_adapter_v39.test.mjs security/v38/v39_trusted_enrollment_composition.test.mjs security/v38/v39_enrollment_key_compatibility.test.mjs security/v38/v39_bootstrap_recovery_authority.test.mjs security/v38/v39_approver_binding.test.mjs tests/legacy-v2-registration-hold.test.cjs
      - name: Test V39 authenticated recovery challenge issuance (reference only)
        run: node --test security/v38/v39_authenticated_challenge_issuer.test.mjs
      - name: Test V39 persisted recovery challenge issuance (reference only)
        run: node --test security/v38/v39_recovery_challenge_store.test.mjs
      - name: Test V39 signed receipt to recovery gate integration (reference only)
        run: node --test security/v38/v39_signed_recovery_integration.test.mjs
      - name: Test V39 pinned-issuer signed recovery receipts (reference only)
        run: node --test security/v38/v39_signed_authority_receipt.test.mjs
      - name: Test V39 independent recovery authority boundary (reference only)
        run: node --test security/v38/v39_independent_recovery_gate.test.mjs
      - name: Test V39 server-generated recovery challenge (reference only)
        run: node --test security/v38/v39_recovery_challenge.test.mjs security/v38/v39_recovery_challenge_validation.test.mjs
      - name: Test V39 bootstrap and recovery decision policy (reference only)
        run: node --test security/v38/v39_bootstrap_recovery_policy.test.mjs
      - name: Test V39 legacy Ed25519 device possession proof (reference only)
        run: node --test security/v38/v39_legacy_device_proof.test.mjs
      - name: Test authenticated-account signed enrollment boundary (reference only)
        run: node --test security/v38/verify_authenticated_enrollment_boundary.test.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Report safe PostgreSQL network identity
        shell: bash
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U postgres -d bharathlink_disposable_v30 -X -v ON_ERROR_STOP=1 -Atqc "SELECT 'CI_DB_DIAG db=' || current_database() || ' client=' || coalesce(inet_client_addr()::text,'local-socket') || ' server=' || coalesce(inet_server_addr()::text,'local-socket');"
      - name: Test isolated atomic consumption lab (rolled back)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGSERVICE PGSERVICEFILE PGOPTIONS PGSSLMODE PGCONNECT_TIMEOUT
          test -s security/v38/atomic_consumption_lab_NOT_FOR_LIVE.sql
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT CASE WHEN current_database()='bharathlink_disposable_v30' AND inet_server_addr() IS NOT NULL AND inet_client_addr() IS NOT NULL AND ((inet_server_addr() <<= inet '127.0.0.0/8' AND inet_client_addr() <<= inet '127.0.0.0/8') OR (current_setting('application_name',true)='bharathlink-v38-ci' AND inet_client_addr()=inet '172.18.0.1' AND inet_server_addr()=inet '172.18.0.2')) THEN 'SAFE' ELSE 'UNSAFE' END" | grep -qx SAFE
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/atomic_consumption_lab_NOT_FOR_LIVE.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v38_atomic_lab'")" = 0
      - name: Test V39 immutable candidate dual-key binding (disposable, rolled back)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/candidate_request_v39_DISPOSABLE_ONLY.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v39_candidate_lab'")" = 0
      - name: Test V39 atomic enrollment and replay rejection (disposable, rolled back)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/atomic_enrollment_v39_DISPOSABLE_ONLY.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v39_atomic_lab'")" = 0
      - name: Test V39 atomic recovery evidence consumption (disposable only)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/v39_recovery_atomic_receipt_DISPOSABLE_ONLY.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v39_atomic_recovery_lab'")" = 0
      - name: Test V39 recovery challenge one-time consumption (disposable only)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/v39_recovery_consumption_DISPOSABLE_ONLY.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v39_recovery_lab'")" = 0
      - name: Test V39 legacy RPC privilege cutover on disposable PostgreSQL
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/v39_legacy_rpc_privilege_disposable_ci.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v39_legacy_rpc_lab'")" = 0
      - name: Test V39 proposed enrollment schema with rollback and privilege assertions
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/V39_PROPOSED_ENROLLMENT_SCHEMA_REVIEW_ONLY.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_enrollment_v39_private'")" = 0
      - name: Test V39 Supabase-compatible RLS boundaries (disposable, rolled back)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          psql "$LOCAL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f security/v38/supabase_compatibility_v39_DISPOSABLE_ONLY.sql
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v39_compat_lab'")" = 0
      - name: Test V39 signed enrollment against real disposable PostgreSQL
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          cd security/v38
          npm install --no-save --no-audit --no-fund --ignore-scripts pg@8.16.3
          node signed_enrollment_real_postgres_ci.mjs
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_v38_enrollment_private'")" = 0
      - name: Test V39 adapter on actual disposable PostgreSQL (rollback and replay)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          cd security/v38
          npm install --no-save --no-audit --no-fund --ignore-scripts pg@8.16.3
          node v39_real_postgres_adapter_ci.mjs
          test "$(psql "$LOCAL_TEST_DATABASE_URL" -X -Atqc "SELECT count(*) FROM pg_namespace WHERE nspname='bl_enrollment_v39_private'")" = 0
      - name: Test concurrent atomic approval consumption (disposable PostgreSQL)
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          python3 security/v38/validate_target.py
          python3 security/v38/atomic_concurrency_ci.py
      - name: Run actual V38 PostgreSQL integration
        shell: bash
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/bharathlink_disposable_v30
          PGAPPNAME: bharathlink-v38-ci
        run: |
          set -euo pipefail
          bash security/v38/run_local.sh
