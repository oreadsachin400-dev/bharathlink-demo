name: BharathLink Phase 7O — independent audit witness evidence (OFFLINE)
on:
  push:
    branches:
      - bharathlink-phase7o-external-audit-witness-ci
    paths:
      - recovery-gate/independent-audit-witness.mjs
      - tests/phase7o-external-witness.test.mjs
      - .github/workflows/phase7o-independent-audit-witness-ci.yml
  pull_request:
    branches:
      - bharathlink-phase7n-owner-hash-bypass-hardstop-ci
    paths:
      - recovery-gate/independent-audit-witness.mjs
      - tests/phase7o-external-witness.test.mjs
      - .github/workflows/phase7o-independent-audit-witness-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-audit-evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic independent witness + retained Phase7I-N regressions
        run: |
          set -euo pipefail
          node --test tests/phase7o-external-witness.test.mjs tests/phase7n-owner-hash-ingress.test.mjs tests/phase7m-verified-ledger-bridge.test.mjs tests/phase7l-ledger-contract.test.mjs tests/phase7k-dual-review-evidence.test.mjs tests/phase7j-trust-posture.test.mjs tests/phase7i-first-device-hold-contract.test.mjs
      - name: Assert witness module has no API, device registration or activation
        run: |
          set -euo pipefail
          ! grep -Eq 'deviceApproved:[[:space:]]*true|canActivate:[[:space:]]*true|e2eeReady:[[:space:]]*true' recovery-gate/independent-audit-witness.mjs
          ! grep -Eq 'fetch[(]|INSERT INTO|UPDATE public[.]|supabase[.]|service_role' recovery-gate/independent-audit-witness.mjs
          echo 'PASS: independent witness verification only, no activation or deployment'
