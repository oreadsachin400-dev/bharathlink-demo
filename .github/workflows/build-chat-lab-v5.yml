name: Build Chat Simulation Lab V5 TEST APK
on:
  push:
    branches: [chat-simulation-lab-v5-test-20261122]
    paths:
      - 'chat-simulation-lab-v5/**'
      - '.github/workflows/build-chat-lab-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK using preinstalled runner tools
        run: |
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: chat-simulation-lab
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chat-Simulation-Lab-V5-TEST-APK
          path: chat-simulation-lab-v5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
