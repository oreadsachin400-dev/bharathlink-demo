name: BharathLink — Installed KeyPrep Signer Read-only Audit Tool CI (NO PHONE)

on:
  push:
    branches:
      - bharathlink-keyprep-installed-signer-audit-ci
    paths:
      - 'scripts/audit_installed_keyprep_signer.py'
      - 'tests/test_installed_keyprep_signer_audit.py'
      - 'KeyPrep-Signer-Check-Windows.cmd'
      - 'tests/test_windows_keyprep_launcher.py'
      - 'tests/test_historical_apk_workflow_hold.py'
      - '.github/workflows/build-android-test.yml'
      - '.github/workflows/build-v36hf-kotlin-test.yml'
      - '.github/workflows/build-v36hf-keyprep-test.yml'
      - '.github/workflows/build-phase6-offline-freshprep.yml'
      - '.github/workflows/build-signing-inspector.yml'
      - '.github/workflows/phase6-offline-freshprep-android.yml'
      - '.github/workflows/installed-keyprep-signer-audit-ci.yml'
      - 'docs/KeyPrep-Installed-Signer-Local-Audit-2026-11-04.md'
      - 'docs/Historical-APK-Workflow-Release-HOLD-Audit-2026-11-04.md'
      - 'docs/security-release-readiness.json'
      - 'tests/test_protected_signing_workflow.py'
      - '.github/workflows/keyprep-protected-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-phone-certificate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic adb/apksigner/aapt positive and negative checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_installed_keyprep_signer_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_windows_keyprep_launcher.py' -v
          python3 -m unittest discover -s tests -p 'test_protected_signing_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_historical_apk_workflow_hold.py' -v
      - name: Verify the tool cannot change a phone or access secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from ast import parse,walk,Constant,Call
          source=Path("scripts/audit_installed_keyprep_signer.py").read_text()
          tree=parse(source)
          protected=Path(".github/workflows/keyprep-protected-signing.yml").read_text()
          assert "    if: false" in protected, "BLOCK: protected APK signing job not held"
          assert "Play Protect harmful-app finding is unresolved" in protected
          import json
          decision=json.loads(Path("docs/security-release-readiness.json").read_text())
          assert decision["release_decision"]=="HOLD"
          assert decision["signing_provenance"]["real_installed_certificate_status"]=="NOT_YET_READ_FROM_PHONE"
          assert decision["signing_provenance"]["protected_github_signing_workflow_status"]=="JOB_LEVEL_HARD_HOLD_IF_FALSE"
          assert "TemporaryDirectory(" in source
          assert '"pm", "path", PKG' in source
          assert '"pull", p, str(apk)' in source
          assert '"safe_update_authorized": False' in source
          assert '"play_protect_clearance_verified": False' in source
          assert '"original_private_signing_key_verified_available": False' in source
          assert "shell=True" not in source
          for bad in ('"install"', '"uninstall"', '"push"', '"root"', '"run-as"',
                      '"clear"', '"disable-verity"', '"reboot"', '"setprop"'):
              assert bad not in source, bad
          assert not any(isinstance(n,Call) and hasattr(n.func,"attr")
             and n.func.attr in ("system","popen","remove","unlink","rmtree")
             for n in walk(tree)), "Prohibited mutable subprocess/file operation"
          print("PASS: read-only ADB pm path + public base APK certificate; no update or destructive operations")
          PY
      - name: No APK and no publish action in installer attestation CI
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'assembleDebug|assembleRelease|actions/upload-artifact@|adb install|adb uninstall' .github/workflows/installed-keyprep-signer-audit-ci.yml
          test ! -d app/build/outputs/apk
          echo "PASS: CI tests a future opt-in local tool; it cannot access any physical Android phone"


  windows-launcher-no-phone-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows launch must refuse when no personal USB device is available
        shell: pwsh
        run: |
          $env:CI = "true"
          # Direct process exit check: do not wait for the long-lived ADB daemon.
          $PSNativeCommandUseErrorActionPreference = $false
          & cmd.exe /d /c "KeyPrep-Signer-Check-Windows.cmd"
          $code = $LASTEXITCODE
          if ($code -ne 1) {
            throw "Blocked: Windows read-only launcher must refuse without an authorized personal USB phone. Exit=$code"
          }
          Write-Host "PASS: Windows launcher refused to claim a phone signer match on a GitHub runner."
      - name: Confirm launcher never packaged or installed a phone app
        shell: pwsh
        run: |
          if (Test-Path "app/build/outputs/apk") { throw "Unexpected Android APK output" }
          Write-Host "PASS: no APK artifact and no test-device update"
