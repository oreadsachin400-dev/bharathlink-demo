name: BharathMail trusted receiver — read-only public MX baseline (NO DEPLOY)

on:
  push:
    branches:
      - blmail-trusted-receiver-dns-readonly-20261105
    paths:
      - 'scripts/bharatmail-public-mx-baseline-readonly.mjs'
      - 'tests/bharatmail-public-mx-baseline-readonly.test.mjs'
      - '.github/workflows/bharatmail-public-mx-baseline-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-mx-observation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit tests (only stub DNS responses)
        run: |
          set -euo pipefail
          node --check scripts/bharatmail-public-mx-baseline-readonly.mjs
          node --test tests/bharatmail-public-mx-baseline-readonly.test.mjs
      - name: Observe public MX and NS via DNS resolver (NO RECORD CHANGES)
        run: |
          set -euo pipefail
          node scripts/bharatmail-public-mx-baseline-readonly.mjs | tee /tmp/bharatmail-public-dns-baseline.json
          grep -Fq '"status": "OBSERVED_NOT_AUTHENTICATED"' /tmp/bharatmail-public-dns-baseline.json
          grep -Fq '"spf": "NOT_CHECKED"' /tmp/bharatmail-public-dns-baseline.json
          grep -Fq '"change_mx_authorized": false' /tmp/bharatmail-public-dns-baseline.json
      - name: Confirm source-only read boundary (NO_DEPLOY)
        run: |
          set -euo pipefail
          test ! -e supabase/functions/bl-mail-auth-attest/index.ts
          grep -Fq 'deployment_authorized:false,change_mx_authorized:false' scripts/bharatmail-public-mx-baseline-readonly.mjs
          grep -Fq 'permissions:' .github/workflows/bharatmail-public-mx-baseline-readonly.yml
          grep -Fq 'contents: read' .github/workflows/bharatmail-public-mx-baseline-readonly.yml
          ! grep -E '(^|[[:space:]])(wrangler[[:space:]]+deploy|supabase[[:space:]]+functions[[:space:]]+deploy|assembleDebug)' scripts/bharatmail-public-mx-baseline-readonly.mjs
          ! grep -Eq '^[[:space:]]*-[[:space:]]+uses:[[:space:]]+actions/upload-artifact' .github/workflows/bharatmail-public-mx-baseline-readonly.yml
