name: BharathLink Phase 6 — Offline Fresh KeyPrep TEST APK

on:
  push:
    branches:
      - bharathlink-phase6-offline-android-freshprep-v1-test
    paths:
      - 'android-freshprep/**'
      - '.github/scripts/v36hf_offline_freshprep.py'
      - '.github/workflows/build-phase6-offline-freshprep.yml'
      - 'docs/Phase6-Offline-Fresh-Android-2026-11-03.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-offline-android:
    # SECURITY HOLD: Play Protect warning unresolved and signing continuity unverified.
    # Historic test APK producer may not run or upload artifacts.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned V36HF source ZIP (not original KeyPrep APK)
        shell: bash
        run: |
          set -euo pipefail
          echo '77bed5a87934d3a674f4f59b00cb652d16f7afcda27225a1280ec20d1502db3c  BharathLink-V36HF-SecurityPatch-TEST-SOURCE-READY.zip' | sha256sum -c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Stage isolated NEW-package offline TEST app in disposable directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v36hf-kotlin-build
          unzip -q BharathLink-V36HF-SecurityPatch-TEST-SOURCE-READY.zip -d v36hf-kotlin-build
          python3 .github/scripts/v36hf_startup_rescue.py
          python3 .github/scripts/v36hf_webview_diag.py
          python3 .github/scripts/v36hf_offline_freshprep.py
      - name: Fail if private trust, Supabase, E2EE, legacy APK or network code leaked
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=v36hf-kotlin-build/app/src/main/java/com/bharathlink/app/freshprep
          test "$(find v36hf-kotlin-build/app/src/main -type f \( -name '*.kt' -o -name '*.java' \) | wc -l)" -eq 2
          test "$(find v36hf-kotlin-build/app/src/test -type f \( -name '*.kt' -o -name '*.java' \) | wc -l)" -eq 1
          grep -q 'applicationIdSuffix = ".test.freshprep"' v36hf-kotlin-build/app/build.gradle.kts
          ! grep -rE 'supabase\.co|Internet|INTERNET|HttpURLConnection|OkHttp|service_role|create_user|register_e2ee_v2_device|bl20_commit_device_approval|addJavascriptInterface|deleteEntry\(' "$SOURCE"
          grep -q 'LOCAL_CRYPTO_SELF_TEST_ONLY_NOT_TRUSTED' "$SOURCE/OfflineProofPolicy.kt"
          grep -q 'setOnClickListener { createOnce() }' "$SOURCE/FreshKeyPrepActivity.kt"
          echo 'PASS: native offline self-test source only'
      - name: Run pure Kotlin security unit tests and compile independent APK
        working-directory: v36hf-kotlin-build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify final packaged APK signing, package, launch activity, and requested permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=v36hf-kotlin-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" > v36hf-kotlin-build/freshprep-apksigner.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > v36hf-kotlin-build/freshprep-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" > v36hf-kotlin-build/freshprep-permissions.txt
          grep -q "^package: name='com.bharathlink.app.test.freshprep' versionCode='1'" v36hf-kotlin-build/freshprep-badging.txt
          grep -q "^launchable-activity: name='com.bharathlink.app.freshprep.FreshKeyPrepActivity'" v36hf-kotlin-build/freshprep-badging.txt
          ! grep -q 'uses-permission:' v36hf-kotlin-build/freshprep-permissions.txt
          ! grep -q 'permission:' v36hf-kotlin-build/freshprep-permissions.txt
          sha256sum "$APK" > v36hf-kotlin-build/freshprep.sha256
          echo 'PASS: NEW app ID, one launcher, signed debug APK, zero permissions'
      - name: Upload isolated disposable TEST APK only
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BharathLink-TEST-Phase6-Fresh-KeyPrep-Offline-APK
          path: |
            v36hf-kotlin-build/app/build/outputs/apk/debug/app-debug.apk
            v36hf-kotlin-build/freshprep.sha256
            v36hf-kotlin-build/freshprep-apksigner.txt
            v36hf-kotlin-build/freshprep-badging.txt
            v36hf-kotlin-build/freshprep-permissions.txt
          if-no-files-found: error
          retention-days: 10
