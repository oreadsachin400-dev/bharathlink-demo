name: Manual chat read/unread RPCs — isolated PG16 review only
on:
  push:
    branches: [security/conversation-read-state-rpc-review-20261111]
    paths:
      - 'sql/review-only/conversation_manual_read_state_candidate.sql'
      - 'tests/fixtures/conversation_read_state_pg16.sql'
      - 'tests/conversation_read_state_contract.pgsql'
      - '.github/workflows/conversation-read-state-contract.yml'
  pull_request:
    paths:
      - 'sql/review-only/conversation_manual_read_state_candidate.sql'
      - 'tests/fixtures/conversation_read_state_pg16.sql'
      - 'tests/conversation_read_state_contract.pgsql'
      - '.github/workflows/conversation-read-state-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bharathlink_isolated_readstate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-pg16-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bharathlink_isolated_readstate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: bharathlink_isolated_readstate
      PGUSER: postgres
      PGPASSWORD: disposable-pg16-only
    steps:
      - uses: actions/checkout@v4
      - name: Confirm disposable PostgreSQL destination
        shell: bash
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "bharathlink_isolated_readstate"
          test "$PGUSER" = "postgres"
          psql -v ON_ERROR_STOP=1 -Atc 'select current_database()' | grep -qx bharathlink_isolated_readstate
      - name: Load fixture with official TEST getter definitions (no real data)
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/conversation_read_state_pg16.sql
      - name: Load default-denied read/unread RPC candidates
        run: psql -v ON_ERROR_STOP=1 -f sql/review-only/conversation_manual_read_state_candidate.sql
      - name: Execute authorization, semantics, idempotency and receipt-isolation tests
        run: psql -v ON_ERROR_STOP=1 -f tests/conversation_read_state_contract.pgsql
