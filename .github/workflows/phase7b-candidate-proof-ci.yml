name: BharathLink Phase 7B — Server Challenge & Atomic Replay CI (TEST ONLY)

on:
  push:
    branches:
      - bharathlink-phase7b-challenge-possession-ci-test
    paths:
      - 'tests/phase7b-*.mjs'
      - 'android-phase7b/**'
      - '.github/scripts/v36hf_phase7b_compileonly.py'
      - 'tests/fixtures/phase7b-*.sql'
      - 'sql/staged/TEST-candidate-possession-v1.sql'
      - 'supabase/functions/bl20-candidate-possession/**'
      - '.github/workflows/phase7b-candidate-proof-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-candidate-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cryptographic signature, forged context and hard-gate tests
        run: node --test tests/candidate-possession.test.mjs tests/phase7b-challenge-crypto.test.mjs

  postgres-atomic-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: phase7b_ephemeral_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: phase7b_ephemeral_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Initialize disposable local DB and existing staged SQL contract
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/phase7b-ci-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/staged/TEST-candidate-possession-v1.sql
      - name: Real PostgreSQL challenge, expiry, grants, replay assertions
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/phase7b-postgres-smoke.sql
      - name: Parallel one-time challenge consume under database row lock
        shell: bash
        run: |
          set -euo pipefail
          node tests/phase7b-concurrent-consume.mjs
      - name: Explicit trust and independent approval remain off
        shell: bash
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "select count(*) from public.messaging_devices" | grep -qx '0'
          grep -Fqx 'const FEATURE_RELEASED=false; // deliberately non-configurable from environment' \
            supabase/functions/bl20-candidate-possession/index.ts
          test ! -e supabase/functions/bl20-phase7b-active/index.ts
          echo "PASS: no remote Supabase writes, no device activation, no Android APK"

  native-signer-compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned TEST source archive
        shell: bash
        run: |
          set -euo pipefail
          echo '77bed5a87934d3a674f4f59b00cb652d16f7afcda27225a1280ec20d1502db3c  BharathLink-V36HF-SecurityPatch-TEST-SOURCE-READY.zip' | sha256sum -c
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Stage Phase7A disposable Kotlin source with Phase7B signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v36hf-kotlin-build
          unzip -q BharathLink-V36HF-SecurityPatch-TEST-SOURCE-READY.zip -d v36hf-kotlin-build
          python3 .github/scripts/v36hf_startup_rescue.py
          python3 .github/scripts/v36hf_webview_diag.py
          python3 .github/scripts/v36hf_phase7a_isolated.py
          python3 .github/scripts/v36hf_phase7b_compileonly.py
      - name: Compile-only native signer and pure policy JUnit tests
        working-directory: v36hf-kotlin-build
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: No APK published or remote device trust activated
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationIdSuffix = ".test.phase7bind"' v36hf-kotlin-build/app/build.gradle.kts
          test -f v36hf-kotlin-build/app/src/main/java/com/bharathlink/app/phase7/Phase7bCandidateSigner.kt
          echo "PASS: compiled signer source only, no APK release, original KeyPrep unaffected"
