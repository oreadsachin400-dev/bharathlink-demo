name: BharathLink Mail Trust Engine — Offline Security and UI Contract

on:
  push:
    branches:
      - bharathlink-mail-trust-engine-staged-ci
    paths:
      - 'bharatmail-trust-engine.js'
      - 'index.html'
      - 'tests/bharatmail-trust-engine.test.mjs'
      - '.github/workflows/bharatmail-trust-engine-ci.yml'
      - 'docs/BharathMail-Trust-Engine-2026-11-04.md'
      - 'docs/BharathMail-Inbound-Auth-Boundary-Audit-2026-11-04.md'
      - 'docs/security-release-readiness.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-mail-trust-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Parse offline engine
        shell: bash
        run: |
          set -euo pipefail
          node --check bharatmail-trust-engine.js
      - name: Execute deterministic sender, phishing, payment and UI integration tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/bharatmail-trust-engine.test.mjs | tee /tmp/bharatmail-trust-results.txt
          grep -q '# fail 0' /tmp/bharatmail-trust-results.txt
          grep -q '# skipped 0' /tmp/bharatmail-trust-results.txt

      - name: Regression check against existing authorization, issuer and device security contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/candidate-possession.test.mjs \
            tests/device-approval-crypto.test.mjs \
            tests/independent-review.test.mjs \
            tests/phase5-recovery-issuer-crypto.test.mjs \
            tests/phase7b-challenge-crypto.test.mjs \
            tests/phase7d-edge-http-contract.test.mjs \
            tests/phase7f-approval-v2-edge-http.test.mjs \
            tests/phase7f-release-gates.test.mjs \
            tests/phase7g-governance-contract.test.mjs \
            tests/phase7h-issuer-pinning-contract.test.mjs \
            tests/phase7i-first-device-hold-contract.test.mjs \
            tests/consolidated-readiness-contract.test.mjs | tee /tmp/bharatmail-regression.txt
          grep -q '# fail 0' /tmp/bharatmail-regression.txt
          grep -q '# skipped 0' /tmp/bharatmail-regression.txt

      - name: Enforce zero backend release, external model request or app distribution
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'fetch\(|XMLHttpRequest|sendBeacon\(' bharatmail-trust-engine.js
          ! grep -E 'supabase (db push|functions deploy)|assembleDebug|actions/upload-artifact@' .github/workflows/bharatmail-trust-engine-ci.yml
          grep -Fq 'BharathMail Sender Trust' index.html
          grep -Fq 'SPF/DKIM/DMARC: not checked' index.html
          grep -Fq 'Not independently verified' index.html
          echo 'PASS: no live Supabase/Netlify changes, identity authority, APK, or external AI data transfer'
