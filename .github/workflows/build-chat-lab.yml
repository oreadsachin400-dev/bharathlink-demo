name: Build Chat Simulation Lab V4 TEST APK
on:
  push:
    branches: [chat-simulation-lab-v4-test-20261122]
    paths:
      - 'chat-simulation-lab/**'
      - '.github/workflows/build-chat-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK using preinstalled runner tools
        run: |
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check embedded JavaScript syntax
        working-directory: chat-simulation-lab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text()
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('chatlab-check.js').write_text(script)
          assert 'EDITED SIMULATION' in script and 'Search simulated messages' in html
          PY
          node --check chatlab-check.js
      - name: Build debug APK
        working-directory: chat-simulation-lab
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chat-Simulation-Lab-V4-TEST-APK
          path: chat-simulation-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
