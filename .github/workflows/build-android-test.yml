name: Build BharathLink TEST APK
on:
  workflow_dispatch:
  push:
    branches: [bharathlink-android-test-build]
    paths:
      - 'BharathLink-Android/**'
      - '.github/workflows/build-android-test.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: BharathLink-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl --fail --location --retry 3 -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/commandlinetools.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build TEST APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify and package
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/BharathLink-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ../out/BharathLink-TEST.apk | tee ../out/signing.txt
          (cd ../out && sha256sum BharathLink-TEST.apk > BharathLink-TEST.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: BharathLink-TEST-APK
          path: out/
          retention-days: 14
