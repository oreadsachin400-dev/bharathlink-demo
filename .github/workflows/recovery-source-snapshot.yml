name: Read-only source recovery snapshot
on:
  push:
    branches:
      - backup/source-snapshot-2026-11-06
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Bundle current repository files
        run: |
          tar --exclude=.git --exclude=source-backup.tar.gz -czf source-backup.tar.gz .
          tar -tzf source-backup.tar.gz >/dev/null
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-recovery-snapshot
          path: source-backup.tar.gz
          retention-days: 7
          if-no-files-found: error
