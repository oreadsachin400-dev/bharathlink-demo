name: BharathLink Mail — Signed Sender Authentication Backend STAGED HOLD

on:
  push:
    branches:
      - bharathlink-mail-signed-auth-backend-hold-ci
    paths:
      - 'supabase/functions/bl-mail-auth-attest/**'
      - 'sql/staged/TEST-bharatmail-signed-sender-auth-v1.sql'
      - 'tests/mail-auth-signed-gate.test.mjs'
      - 'tests/mail-auth-edge-postgres-integrated.test.mjs'
      - 'tests/fixtures/mail-auth-*.sql'
      - '.github/workflows/bharatmail-signed-auth-staged-ci.yml'
      - 'docs/BharathMail-Signed-Authentication-Backend-HOLD-2026-11-04.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-verifier-edge-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Independent P-256 verifier cryptographic tests and disabled Edge HTTP
        shell: bash
        run: |
          set -euo pipefail
          node --check supabase/functions/bl-mail-auth-attest/signed-report.mjs
          node --test tests/mail-auth-signed-gate.test.mjs | tee /tmp/signed-mail-ci.txt
          grep -q '# fail 0' /tmp/signed-mail-ci.txt
          grep -q '# skipped 0' /tmp/signed-mail-ci.txt
      - name: Existing Mail Trust UI and security contract regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/bharatmail-trust-engine.test.mjs | tee /tmp/local-mail-ci.txt
          grep -q '# fail 0' /tmp/local-mail-ci.txt
          grep -q '# skipped 0' /tmp/local-mail-ci.txt
          node --test \
            tests/candidate-possession.test.mjs \
            tests/device-approval-crypto.test.mjs \
            tests/independent-review.test.mjs \
            tests/phase5-recovery-issuer-crypto.test.mjs \
            tests/phase7b-challenge-crypto.test.mjs \
            tests/phase7d-edge-http-contract.test.mjs \
            tests/phase7f-approval-v2-edge-http.test.mjs \
            tests/phase7f-release-gates.test.mjs \
            tests/phase7g-governance-contract.test.mjs \
            tests/phase7h-issuer-pinning-contract.test.mjs \
            tests/phase7i-first-device-hold-contract.test.mjs \
            tests/consolidated-readiness-contract.test.mjs | tee /tmp/security-regression.txt
          grep -q '# fail 0' /tmp/security-regression.txt
          grep -q '# skipped 0' /tmp/security-regression.txt
      - name: Ensure signed report verification is not deployed or enabled
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const MAIL_AUTH_RELEASED=false; // hard HOLD' supabase/functions/bl-mail-auth-attest/index.ts
          ! grep -E 'supabase (db push|functions deploy)|assembleDebug|actions/upload-artifact@' .github/workflows/bharatmail-signed-auth-staged-ci.yml
          grep -Fq 'domainAuthentication: external ?' bharatmail-trust-engine.js
          grep -Fq 'not_checked' bharatmail-trust-engine.js
          echo "PASS: no APK, no live SMTP, no Supabase SQL/deployment, no false Verified sender"

  disposable-postgres-owner-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_mail_auth_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_mail_auth_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Synthetic isolated mail and Auth roles
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/mail-auth-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/staged/TEST-bharatmail-signed-sender-auth-v1.sql
      - name: Atomic binding, owner-only RLS, immutable receipt and negative tests
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/mail-auth-rpc-assertions.sql
          echo "PASS: only synthetic independent issuer data, no real inbox read or mutation"

  signed-edge-real-postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_mail_auth_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_mail_auth_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Fresh synthetic app users, routed mail, and staged RLS receipts
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/mail-auth-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/staged/TEST-bharatmail-signed-sender-auth-v1.sql
      - name: Actual P-256 signed Edge HTTP to PostgreSQL replay/cross-account proof
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mail-auth-edge-postgres-integrated.test.mjs | tee /tmp/blmail-auth-integrated.txt
          grep -q '# fail 0' /tmp/blmail-auth-integrated.txt
          grep -q '# skipped 0' /tmp/blmail-auth-integrated.txt
          echo "PASS: signed synthetic issuer + disposable PostgreSQL, no real sender authentication claims"
