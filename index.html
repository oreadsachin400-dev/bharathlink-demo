/* =====================================================================
   14B. DEVICE SECURITY — APP LOCK + CHAT LOCK
   - 6-digit browser-local security PIN
   - PBKDF2-SHA256 verifier + random salt; raw PIN never stored
   - App Lock auto-locks after ~30s in background
   - Direct and group chats can be locked individually
   Native Android will later add biometrics + Android Keystore.
   ===================================================================== */
const LockSecurity = {
  KEY:'bl_device_security_v27',
  ITERATIONS:160000,
  DEFAULT_AUTO_LOCK_MS:300000,
  _appUnlocked:false,
  _chatUnlocked:new Set(),
  _hiddenAt:0,

  empty(){return {v:1,salt:'',verifier:'',appLock:false,autoLockMs:this.DEFAULT_AUTO_LOCK_MS,chats:[],changedAt:0};},
  cfg(){
    try{
      const raw=JSON.parse(localStorage.getItem(this.KEY)||'null');
      return raw&&raw.v===1
        ? {...this.empty(),...raw,chats:Array.isArray(raw.chats)?raw.chats.map(String):[]}
        : this.empty();
    }catch(_){return this.empty();}
  },
  save(c){
    const clean={...this.empty(),...c,chats:[...new Set((c.chats||[]).map(String))],changedAt:Date.now()};
    localStorage.setItem(this.KEY,JSON.stringify(clean));
    return clean;
  },
  hasPin(){const c=this.cfg();return !!(c.salt&&c.verifier);},
  appLockEnabled(){const c=this.cfg();return this.hasPin()&&c.appLock===true;},
  autoLockMs(){
    const n=Number(this.cfg().autoLockMs);
    return Number.isFinite(n)&&n>=-1?n:this.DEFAULT_AUTO_LOCK_MS;
  },
  setAutoLockMs(ms){
    const allowed=[30000,60000,300000,900000,1800000,3600000,-1];
    const n=Number(ms);
    if(!allowed.includes(n))throw new Error('Unsupported auto-lock time.');
    const c=this.cfg();
    this.save({...c,autoLockMs:n});
    this._hiddenAt=0;
  },
  autoLockLabel(ms=this.autoLockMs()){
    return new Map([
      [30000,'30 seconds'],
      [60000,'1 minute'],
      [300000,'5 minutes'],
      [900000,'15 minutes'],
      [1800000,'30 minutes'],
      [3600000,'1 hour'],
      [-1,'Never automatically']
    ]).get(Number(ms))||'5 minutes';
  },
  isChatLocked(id){return this.cfg().chats.includes(String(id));},
  isChatUnlocked(id){return this._chatUnlocked.has(String(id));},
  lockedChatCount(){return this.cfg().chats.length;},

  toB64(bytes){
    const a=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
    let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
    return btoa(s);
  },
  fromB64(s){
    const bin=atob(String(s||'')),a=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return a;
  },
  validPin(pin){return /^\d{6}$/.test(String(pin||''));},
  async derive(pin,salt){
    const base=await crypto.subtle.importKey(
      'raw',new TextEncoder().encode(String(pin)),'PBKDF2',false,['deriveBits']
    );
    const bits=await crypto.subtle.deriveBits(
      {name:'PBKDF2',salt,iterations:this.ITERATIONS,hash:'SHA-256'},base,256
    );
    return new Uint8Array(bits);
  },
  async verify(pin){
    if(!this.validPin(pin))return false;
    const c=this.cfg();if(!c.salt||!c.verifier)return false;
    try{
      const got=await this.derive(pin,this.fromB64(c.salt));
      const want=this.fromB64(c.verifier);
      if(got.length!==want.length)return false;
      let diff=0;for(let i=0;i<got.length;i++)diff|=(got[i]^want[i]);
      return diff===0;
    }catch(_){return false;}
  },
  async setPin(pin){
    if(!this.validPin(pin))throw new Error('Use exactly 6 digits.');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const verifier=await this.derive(pin,salt);
    const c=this.cfg();
    this.save({...c,salt:this.toB64(salt),verifier:this.toB64(verifier)});
    this._appUnlocked=true;
  },
  setAppLock(enabled){
    const c=this.cfg();
    if(enabled&&!this.hasPin())throw new Error('Create a 6-digit security PIN first.');
    this.save({...c,appLock:!!enabled});
    if(enabled)this._appUnlocked=true;
  },
  lockApp({render=true}={}){
    this._appUnlocked=false;
    this._chatUnlocked.clear();
    if(render&&typeof App!=='undefined')App.render();
  },
  unlockApp(){this._appUnlocked=true;},
  lockChat(id){
    if(!this.hasPin())throw new Error('Create a 6-digit security PIN first.');
    const sid=String(id);
    const c=this.cfg();
    this.save({...c,chats:[...c.chats,sid]});
    this.relockChatSession(sid);
  },
  unlockChatPersistently(id){
    const c=this.cfg();
    this.save({...c,chats:c.chats.filter(x=>String(x)!==String(id))});
    this._chatUnlocked.delete(String(id));
  },
  unlockChatSession(id){this._chatUnlocked.add(String(id));},
  relockChatSession(id){this._chatUnlocked.delete(String(id));},
  removePinAndLocks(){
    this.save(this.empty());
    this._appUnlocked=false;
    this._chatUnlocked.clear();
  },

  pinInput(label){
    return h('input',{
      class:'bl-pin-input',type:'password',inputmode:'numeric',
      autocomplete:'off',maxlength:'6',pattern:'[0-9]{6}',
      placeholder:'••••••','aria-label':label||'6-digit security PIN'
    });
  },
  overlay(title,subtitle,body){
    const ov=h('div',{
      style:'position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.70);display:flex;align-items:center;justify-content:center;padding:18px',
      role:'dialog','aria-modal':'true'
    });
    ov.append(h('div',{class:'bl-lock-card'},
      h('div',{class:'bl-lock-icon'},'🔐'),
      h('div',{class:'bl-lock-title'},title),
      h('div',{class:'bl-lock-sub'},subtitle),
      body
    ));
    document.body.append(ov);
    return ov;
  },

  openCreatePin({enableAppLock=false,onDone=null}={}){
    const p1=this.pinInput('Create 6-digit security PIN');
    const p2=this.pinInput('Confirm 6-digit security PIN');
    const err=h('div',{class:'bl-lock-error','aria-live':'polite'});
    let ov=null,busy=false;
    const save=async()=>{
      if(busy)return;
      if(!this.validPin(p1.value)){err.textContent='Enter exactly 6 digits.';p1.focus();return;}
      if(p1.value!==p2.value){err.textContent='PINs do not match.';p2.focus();return;}
      busy=true;err.textContent='Securing PIN…';
      try{
        await this.setPin(p1.value);
        if(enableAppLock)this.setAppLock(true);
        ov?.remove();
        Toast.show(enableAppLock?'App Lock enabled.':'Security PIN created.');
        onDone?.();
        App.refresh();
      }catch(ex){err.textContent=ex.message||'Could not create PIN.';}
      finally{busy=false;p1.value='';p2.value='';}
    };
    const body=h('div',null,
      p1,h('div',{style:'height:8px'}),p2,err,
      h('div',{class:'bl-lock-actions'},
        Button('Cancel',{variant:'secondary',onClick:()=>ov?.remove()}),
        Button('Save PIN',{onClick:save})
      ),
      h('div',{class:'bl-security-note'},
        'The raw PIN is never stored. This browser stores only a PBKDF2-derived verifier and random salt.'
      )
    );
    ov=this.overlay('Create security PIN','Use one 6-digit PIN for App Lock and locked chats.',body);
    setTimeout(()=>p1.focus(),0);
  },

  openVerify({title='Unlock',subtitle='Enter your 6-digit security PIN.',onSuccess=null,onCancel=null}={}){
    const pin=this.pinInput('Security PIN');
    const err=h('div',{class:'bl-lock-error','aria-live':'polite'});
    let ov=null,busy=false;
    const verifyNow=async()=>{
      if(busy)return;
      busy=true;err.textContent='Checking…';
      const ok=await this.verify(pin.value);
      pin.value='';busy=false;
      if(!ok){err.textContent='Incorrect PIN.';pin.focus();return;}
      ov?.remove();onSuccess?.();
    };
    const body=h('form',{onSubmit:e=>{e.preventDefault();verifyNow();}},
      pin,err,
      h('div',{class:'bl-lock-actions'},
        Button('Cancel',{type:'button',variant:'secondary',onClick:()=>{ov?.remove();onCancel?.();}}),
        Button('Unlock',{type:'submit'})
      )
    );
    ov=this.overlay(title,subtitle,body);
    setTimeout(()=>pin.focus(),0);
    return ov;
  },

  openChangePin(){
    this.openVerify({
      title:'Change security PIN',
      subtitle:'Verify your current PIN first.',
      onSuccess:()=>this.openCreatePin({onDone:()=>Toast.show('Security PIN changed.')})
    });
  },
  openRemovePin(){
    this.openVerify({
      title:'Remove security PIN',
      subtitle:'This also disables App Lock and removes all chat locks on this browser.',
      onSuccess:()=>{
        if(!confirm('Remove the security PIN, App Lock and all chat locks from this browser?'))return;
        this.removePinAndLocks();
        Toast.show('Device locks removed.');
        App.refresh();
      }
    });
  },

  appGate(){
    const pin=this.pinInput('Unlock BharathLink PIN');
    const err=h('div',{class:'bl-lock-error','aria-live':'polite'});
    let busy=false;
    const unlock=async()=>{
      if(busy)return;
      busy=true;err.textContent='Checking…';
      const ok=await this.verify(pin.value);
      pin.value='';busy=false;
      if(!ok){err.textContent='Incorrect PIN.';pin.focus();return;}
      this.unlockApp();App.render();
    };
    const node=h('div',{class:'bl-lock-screen'},
      h('div',{class:'bl-lock-card'},
        h('div',{class:'bl-lock-icon'},'🔒'),
        h('div',{class:'bl-lock-title'},'BharathLink locked'),
        h('div',{class:'bl-lock-sub'},'Enter your 6-digit security PIN to open Calling, Messaging, BharathMail, Pay and Profile on this browser.'),
        h('form',{onSubmit:e=>{e.preventDefault();unlock();}},
          pin,err,h('div',{class:'bl-lock-actions'},Button('Unlock',{type:'submit'}))
        ),
        h('div',{class:'bl-security-note'},'Browser prototype lock. Native Android will later support biometric unlock and Android Keystore-backed protection.')
      )
    );
    setTimeout(()=>pin.focus(),0);
    return node;
  },

  chatGate(id,{back='/chats',label='Chat'}={}){
    const pin=this.pinInput('Unlock chat PIN');
    const err=h('div',{class:'bl-lock-error','aria-live':'polite'});
    let busy=false;
    const unlock=async()=>{
      if(busy)return;
      busy=true;err.textContent='Checking…';
      const ok=await this.verify(pin.value);
      pin.value='';busy=false;
      if(!ok){err.textContent='Incorrect PIN.';pin.focus();return;}
      this.unlockChatSession(id);App.render();
    };
    const node=Screen({
      title:'Locked chat',back,
      children:[h('div',{class:'bl-lock-screen'},
        h('div',{class:'bl-lock-card'},
          h('div',{class:'bl-lock-icon'},'🔐'),
          h('div',{class:'bl-lock-title'},`${label} locked`),
          h('div',{class:'bl-lock-sub'},'This conversation is protected by your device security PIN. Message content stays hidden until you unlock it.'),
          h('form',{onSubmit:e=>{e.preventDefault();unlock();}},
            pin,err,h('div',{class:'bl-lock-actions'},Button('Unlock chat',{type:'submit'}))
          )
        )
      )]
    });
    setTimeout(()=>pin.focus(),0);
    return node;
  },

  settingsSection(){
    const box=h('div');
    const render=()=>{
      const c=this.cfg(),has=this.hasPin(),app=has&&c.appLock===true,count=c.chats.length;
      const buttons=[];
      if(!has)buttons.push(Button('Create 6-digit security PIN',{variant:'secondary',onClick:()=>this.openCreatePin({onDone:render})}));
      else buttons.push(Button('Change security PIN',{variant:'secondary',onClick:()=>this.openChangePin()}));
      if(app){
        buttons.push(Button('Disable App Lock',{variant:'ghost',onClick:()=>this.openVerify({
          title:'Disable App Lock',
          onSuccess:()=>{this.setAppLock(false);Toast.show('App Lock disabled.');render();}
        })}));
        buttons.push(Button('Lock app now',{variant:'ghost',onClick:()=>this.lockApp()}));
      }else{
        buttons.push(Button('Enable App Lock',{variant:'secondary',onClick:()=>{
          if(!this.hasPin())this.openCreatePin({enableAppLock:true,onDone:render});
          else{this.setAppLock(true);Toast.show('App Lock enabled.');render();}
        }}));
      }
      if(has)buttons.push(Button('Remove PIN & all locks',{variant:'ghost',onClick:()=>this.openRemovePin()}));

      const timerOptions=[
        [30000,'30 seconds'],
        [60000,'1 minute'],
        [300000,'5 minutes · Recommended'],
        [900000,'15 minutes'],
        [1800000,'30 minutes'],
        [3600000,'1 hour'],
        [-1,'Never automatically']
      ];
      const timerSelect=h('select',{
        class:'input',
        'aria-label':'Auto-lock timer',
        disabled:!has,
        onChange:e=>{
          try{
            this.setAutoLockMs(Number(e.target.value));
            Toast.show(`Auto-lock: ${this.autoLockLabel()}.`);
            render();
          }catch(ex){Toast.show(ex.message||'Could not change auto-lock time.');}
        }
      },...timerOptions.map(([value,label])=>h('option',{value:String(value)},label)));
      timerSelect.value=String(this.autoLockMs());

      box.replaceChildren(
        h('div',{class:'bl-security-card'},
          h('div',{class:'bl-security-grid'},
            h('span',null,'Security PIN'),h('strong',null,has?'Set':'Not set'),
            h('span',null,'App Lock'),h('strong',null,app?'Enabled':'Disabled'),
            h('span',null,'Auto-lock'),h('strong',null,this.autoLockLabel()),
            h('span',null,'Locked chats'),h('strong',null,String(count))
          ),
          has?h('div',{style:'margin-top:14px'},
            h('label',{style:'display:block;font-weight:800;margin-bottom:7px'},'Lock after app is in background'),
            timerSelect,
            h('div',{class:'bl-security-note',style:'margin-top:7px'},
              'Choose how long BharathLink may stay in the background before it locks. “Never automatically” keeps it unlocked until you tap Lock app now, disable/close/reload the browser session, or the browser discards the page.'
            )
          ):null,
          h('div',{class:'bl-security-buttons'},...buttons),
          h('div',{class:'bl-security-note'},
            'A locked chat asks for its PIN the first time you open it in the current security session. Going Back and reopening it will not ask again. A manual App Lock or an auto-lock timeout clears unlocked chat sessions, so protected chats require authentication again.'
          )
        )
      );
    };
    render();return box;
  },

  installLifecycle(){
    const applyAutoLockIfDue=()=>{
      if(!this._hiddenAt)return;
      const elapsed=Date.now()-this._hiddenAt;
      const wait=this.autoLockMs();
      const shouldResetChats=this.lockedChatCount()>0;
      if(wait>=0&&elapsed>=wait&&(this.appLockEnabled()||shouldResetChats)){
        if(this.appLockEnabled())this.lockApp({render:false});
        else this._chatUnlocked.clear();
        this._hiddenAt=0;
        if(typeof App!=='undefined')App.render();
        return;
      }
      this._hiddenAt=0;
    };
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){
        if(!this._hiddenAt)this._hiddenAt=Date.now();
        return;
      }
      applyAutoLockIfDue();
    });
    window.addEventListener('pagehide',()=>{
      if(!this._hiddenAt)this._hiddenAt=Date.now();
    });
    window.addEventListener('pageshow',()=>applyAutoLockIfDue());
  }
};


/* =====================================================================
   UNIVERSAL VERIFIED ENTITY DIRECTORY
   - Covers government departments/public bodies, police, hospitals,
     courts, utilities, businesses/MSMEs/local shops/sole proprietors,
     NGOs, education and financial institutions.
   - Browser users can submit/claim entities and endpoints, but verification
     status is never self-issued. The backend RPC surface is authoritative.
   - Verified ≠ Safe: verification proves the asserted entity/endpoint was
     confirmed by an authorised source; it is not a safety verdict.
   ===================================================================== */
const EntityDirectory = {
  TYPE_META: Object.freeze({
    government_department:'Government department', public_body:'Public body / authority', police:'Police / law enforcement',
    hospital:'Hospital / healthcare', court_tribunal:'Court / tribunal', public_utility:'Public utility',
    business:'Business / company', msme_small_business:'MSME / small business', local_shop_merchant:'Local shop / merchant',
    sole_proprietor:'Sole proprietor', ngo_nonprofit:'NGO / nonprofit', education:'School / college / university',
    financial_institution:'Bank / financial institution', other:'Other organisation'
  }),
  METHOD_META: Object.freeze({
    government_authority:'Government / statutory authority', gstin:'GST registration', pan_card:'PAN card verification', udyam:'Udyam / MSME registration',
    shop_trade_license:'Shop / trade licence', professional_license:'Professional / sector licence',
    proprietor_kyc:'Proprietor identity / KYC', verified_mobile_upi_bank:'Verified mobile + UPI / bank path',
    other_authoritative_source:'Other authoritative source'
  }),
  async rpc(name,body={}){
    if(!Supabase.accessToken)throw new Error('Sign in first.');
    return Supabase.request(`/rest/v1/rpc/${name}`,{method:'POST',body:JSON.stringify(body)});
  },
  first(x){return Array.isArray(x)?(x[0]||null):x||null;},
  typeLabel(t){return this.TYPE_META[String(t||'')]||String(t||'Organisation').replace(/_/g,' ');},
  methodLabel(t){return this.METHOD_META[String(t||'')]||String(t||'').replace(/_/g,' ');},
  async my(){const r=await this.rpc('list_my_entity_profiles',{});return Array.isArray(r)?r:[];},
  async search(q){const r=await this.rpc('search_verified_entities',{p_query:String(q||'').trim(),p_limit:25});return Array.isArray(r)?r:[];},
  async directorySearch(q){
    const term=String(q||'').trim();
    try{const r=await this.rpc('search_verified_directory',{p_query:term,p_limit:25});return Array.isArray(r)?r:[];}
    catch(ex){if(/does not exist|schema cache|function .* not found|404/i.test(String(ex?.message||ex)))return this.search(term);throw ex;}
  },
  async verifiedEndpoints(entityId){
    try{const r=await this.rpc('list_verified_entity_endpoints',{p_entity_id:entityId});return Array.isArray(r)?r:[];}
    catch(ex){if(/does not exist|schema cache|function .* not found|404/i.test(String(ex?.message||ex)))return [];throw ex;}
  },
  async submit(v){return this.rpc('submit_entity_profile',{
    p_entity_type:v.entityType,p_legal_name:v.legalName,p_display_name:v.displayName||null,p_business_size:v.businessSize||null,
    p_jurisdiction:v.jurisdiction||null,p_branch_name:v.branchName||null,p_verification_method:v.verificationMethod||'other_authoritative_source'
  });},
  async addEndpoint(entityId,type,value){return this.rpc('add_my_entity_endpoint',{p_entity_id:entityId,p_endpoint_type:type,p_endpoint_value:value,p_display_value:value});},
  async endpoints(entityId){const r=await this.rpc('list_my_entity_endpoints',{p_entity_id:entityId});return Array.isArray(r)?r:[];},
  async endpointSummary(entityId){
    try{return this.first(await this.rpc('get_my_entity_endpoint_summary',{p_entity_id:entityId}));}
    catch(ex){if(/does not exist|schema cache|function .* not found|404/i.test(String(ex?.message||ex)))return null;throw ex;}
  },
  async contactPoints(entityId,q='',limit=20,offset=0){
    const r=await this.rpc('list_my_entity_contact_points',{p_entity_id:entityId,p_query:String(q||''),p_limit:limit,p_offset:offset});
    return Array.isArray(r)?r:[];
  },
  async verifiedContactPoints(entityId,q='',limit=20,offset=0){
    try{const r=await this.rpc('list_verified_entity_contact_points',{p_entity_id:entityId,p_query:String(q||''),p_limit:limit,p_offset:offset});return Array.isArray(r)?r:[];}
    catch(ex){if(/does not exist|schema cache|function .* not found|404/i.test(String(ex?.message||ex)))return [];throw ex;}
  },
  async verifiedContactForEndpoint(entityId,type,value){
    try{return this.first(await this.rpc('get_verified_contact_point_for_endpoint',{p_entity_id:entityId,p_endpoint_type:type,p_endpoint_value:value}));}
    catch(ex){if(/does not exist|schema cache|function .* not found|404/i.test(String(ex?.message||ex)))return null;throw ex;}
  },
  async createContactBundle(entityId,v){

      p_entity_id:entityId,

  async bulkImportContacts(entityId,rows){return this.rpc('bulk_import_entity_contacts',{p_entity_id:entityId,p_rows:rows});},
  async updateContactPoint(contactPointId,v){

const LocalContactNames={
  PREFIX:'bl_local_contact_name_v1',
  selfId(){
    try{
      const token=String(Supabase.accessToken||'');
      const p=token.split('.')[1]; if(!p)return'';
      const b64=p.replace(/-/g,'+').replace(/_/g,'/');
      const padded=b64+'='.repeat((4-b64.length%4)%4);
      return String(JSON.parse(atob(padded))?.sub||'');
    }catch(_){return'';}
  },
  key(peerUserId){
    const me=this.selfId(),peer=String(peerUserId||'').trim();
    return me&&peer?`${this.PREFIX}:${me}:${peer}`:'';
  },
  get(peerUserId){
    const k=this.key(peerUserId); if(!k)return'';
    try{return String(localStorage.getItem(k)||'').trim().slice(0,80);}catch(_){return'';}
  },
  set(peerUserId,value){
    const k=this.key(peerUserId); if(!k)throw new Error('Contact identity is not available yet.');
    const clean=String(value||'').replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
    try{if(clean)localStorage.setItem(k,clean);else localStorage.removeItem(k);}catch(_){throw new Error('Could not save the local contact name on this device.');}
    return clean;
  },
  display(conv){return this.get(conv?.peer_user_id)||conv?.peer_display_name||conv?.peer_messaging_id||'BharatLink user';}
};


/* =====================================================================
   LARGE ORGANISATION CONTACT IMPORT
   CSV rows are input records. Rows that resolve to the same role/department
   can be grouped by the backend into one contact bundle with multiple channels.
   ===================================================================== */
const BulkContactsCSV={
  headers:['role_label','department','branch_name','location','mobile','messaging','bharatmail','email','upi','website'],
  template(){return this.headers.join(',')+'\nCustomer Care,Support,Rourkela Main,Rourkela,9876543210,bl_support,bm_support@bharathlink.in,support@example.com,,https://example.com\n';},
  parse(text){
    const src=String(text||'').replace(/^\uFEFF/,'');
    const rows=[];let row=[],field='',quoted=false;
    for(let i=0;i<src.length;i++){
      const ch=src[i];
      if(quoted){
        if(ch==='"'&&src[i+1]==='"'){field+='"';i++;}
        else if(ch==='"')quoted=false;
        else field+=ch;
      }else{
        if(ch==='"')quoted=true;
        else if(ch===','){row.push(field);field='';}
        else if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';}
        else if(ch!=='\r')field+=ch;
      }
    }
    if(field.length||row.length){row.push(field);rows.push(row);}
    return rows.filter(r=>r.some(v=>String(v||'').trim()!==''));
  },
  objects(text){
    const matrix=this.parse(text);if(matrix.length<2)return [];
    const norm=x=>String(x||'').trim().toLowerCase().replace(/[\s-]+/g,'_');
    const aliases={role:'role_label',purpose:'role_label',role_label:'role_label',department:'department',dept:'department',branch:'branch_name',branch_name:'branch_name',location:'location',city:'location',phone:'mobile',mobile:'mobile',mobile_number:'mobile',messaging:'messaging',messaging_id:'messaging',bharathlink_messaging_id:'messaging',bharatmail:'bharatmail',bharathmail:'bharatmail',email:'email',official_email:'email',upi:'upi',upi_id:'upi',website:'website',url:'website',contact_mode:'contact_mode'};
    const headers=matrix[0].map(h=>aliases[norm(h)]||norm(h));
    return matrix.slice(1).map(r=>{const o={};headers.forEach((h,i)=>{if(h)o[h]=String(r[i]??'').trim();});return o;}).filter(o=>Object.values(o).some(Boolean));
  },
  downloadTemplate(){
    const blob=new Blob([this.template()],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bharathlink_official_contacts_template.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
};

/* =====================================================================
   VERIFIED DIRECTORY QUICK SEARCH
   Shared entry point for Calling, Messaging and Pay. Users can search an
   exact phone number or an organisation/department/location. Only entities
   and endpoints already verified by the server are presented as verified.
   A no-match result is never treated as proof that a caller/sender is fake.
   ===================================================================== */
const DirectoryQuickSearch = ({context='general', compact=false}={}) => {
  const input=h('input',{
    class:'input bl-dir-quick__input',type:'search',autocomplete:'off',spellcheck:'false',
    placeholder:'Phone number or organisation, e.g. Rourkela Police',
    'aria-label':'Search verified number or organisation'
  });
  const results=h('div',{class:'bl-dir-quick__results','aria-live':'polite'});
  const searchBtn=Button('Search verified directory',{variant:'secondary'});
  const fullBtn=Button('Open full directory',{variant:'ghost',onClick:()=>Router.go('/entities')});

  const contextHint={
    calling:'Check a caller number or search the official department/organisation before calling back.',
    messaging:'Check a sender number or search the official organisation/department before trusting a message.',
    pay:'Check a recipient, merchant, bank or organisation before paying. A verified identity is not a safety guarantee.'
  }[context]||'Check an exact number or search an organisation, department or location.';

  const renderRow=async row=>{
    const name=row.display_name||row.legal_name||'Verified organisation';
    const bits=[EntityDirectory.typeLabel(row.entity_type),row.branch_name,row.jurisdiction].filter(Boolean).join(' · ');
    const exact=String(row.match_type||'')==='exact_endpoint';
    const matchedType=String(row.matched_endpoint_type||'').replace(/_/g,' ');
    const matchedValue=String(row.matched_endpoint_display_value||'').trim();
    let contactBundles=[];
    try{
      if(exact){const cp=await EntityDirectory.verifiedContactForEndpoint(row.entity_id,row.matched_endpoint_type,row.matched_endpoint_display_value);if(cp)contactBundles=[cp];}
      if(!contactBundles.length)contactBundles=await EntityDirectory.verifiedContactPoints(row.entity_id,'',5,0);
    }catch(_){}
    let endpoints=[];if(!contactBundles.length){try{endpoints=await EntityDirectory.verifiedEndpoints(row.entity_id);}catch(_){}}
    const contactNodes=contactBundles.map(cp=>{
      const channels=Array.isArray(cp.channels)?cp.channels:[];
      const messaging=channels.find(x=>String(x.endpoint_type)==='messaging');
      const mail=channels.find(x=>String(x.endpoint_type)==='bharatmail')||channels.find(x=>String(x.endpoint_type)==='email');
      const actions=[];
      if(messaging)actions.push(Button(String(cp.contact_mode)==='official_chatbot'?'Message official chatbot':'Message',{variant:'ghost',onClick:()=>EntityDirectory.startMessagingEndpoint(messaging.display_value)}));
      if(mail)actions.push(Button('Email',{variant:'ghost',onClick:()=>EntityDirectory.composeMailEndpoint(mail.display_value,mail.endpoint_type)}));
      return h('div',{class:'bl-dir-contact-bundle'},
        h('div',{class:'bl-dir-contact-title'},cp.role_label||'Official contact'),
        h('div',{class:'bl-dir-contact-meta'},[cp.department,cp.branch_name,cp.location,String(cp.contact_mode)==='official_chatbot'?'Automated official chatbot':null].filter(Boolean).join(' · ')),
        ...channels.map(ep=>h('div',{class:'bl-dir-quick__ep'},h('span',null,String(ep.endpoint_type||'').toUpperCase()),h('strong',null,ep.display_value||''))),
        actions.length?h('div',{class:'btn-row bl-dir-contact-actions'},...actions):null
      );
    });
    return h('div',{class:'bl-dir-quick__card'},
      exact?h('div',{class:'bl-dir-quick__exact'},`✓ Exact verified ${matchedType||'endpoint'} match`):h('div',{class:'bl-dir-quick__verified'},'✓ Verified organisation'),
      h('strong',{class:'bl-dir-quick__name'},name),
      h('div',{class:'bl-dir-quick__meta'},bits||'Verified organisation'),
      matchedValue?h('div',{class:'bl-dir-quick__matched'},`${String(row.matched_endpoint_type||'endpoint').toUpperCase()}: ${matchedValue}`):null,
      contactNodes.length?h('div',{class:'bl-dir-quick__eps'},h('div',{class:'bl-dir-quick__eps-title'},'Verified role / department contacts'),...contactNodes):
      endpoints.length?h('div',{class:'bl-dir-quick__eps'},
        h('div',{class:'bl-dir-quick__eps-title'},'Verified official endpoints'),
        ...endpoints.map(ep=>h('div',{class:'bl-dir-quick__ep'},h('span',null,String(ep.endpoint_type||'').toUpperCase()),h('strong',null,ep.display_value||'')))
      ):h('div',{class:'hint',style:'margin-top:8px'},'No verified public endpoint is listed for this entity yet.'),
      h('div',{class:'bl-dir-quick__principle'},'Verified ≠ Safe. Confirm the purpose of the call, message or payment.')
    );
  };

  const doSearch=async()=>{
    const term=String(input.value||'').trim();
    results.replaceChildren();
    if(!term){results.append(h('p',{class:'hint'},'Enter a phone number or organisation/department name.'));return;}
    if(!Supabase.accessToken){results.append(Notice('info','Sign in to search the verified directory.'));return;}
    searchBtn.disabled=true;
    results.append(h('p',{class:'hint'},'Searching verified directory…'));
    try{
      const rows=await EntityDirectory.directorySearch(term);
      results.replaceChildren();
      if(!rows.length){
        const digits=term.replace(/\D/g,'');
        const numberLike=digits.length>=10;
        results.append(Notice('info',numberLike
          ?'No verified match for this number. This does not prove the caller/sender is fake or unofficial. Search the organisation or department name plus city/district and compare its verified official endpoints.'
          :'No verified organisation matched. Try the official name plus city, district or branch. Pending/unverified claims are never shown as verified.'));
        return;
      }
      for(const row of rows)results.append(await renderRow(row));
    }catch(ex){
      results.replaceChildren(Notice('warn',`Directory search failed: ${ex.message||ex}`));
    }finally{searchBtn.disabled=false;}
  };
  searchBtn.addEventListener('click',doSearch);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch();}});

  return h('div',{class:`bl-dir-quick${compact?' bl-dir-quick--compact':''}`},
    compact?h('div',{class:'bl-dir-quick__title'},'🔎 Check number / organisation'):null,
    h('p',{class:'hint bl-dir-quick__hint'},contextHint),
    h('div',{class:'bl-dir-quick__controls'},input,searchBtn),
    results,
    h('div',{class:'bl-dir-quick__footer'},fullBtn)
  );
};

const Views = {

      try{localStorage.setItem(`bl_call_history_${id}`,String(Date.now()));}catch(_){}
      try{window.dispatchEvent(new CustomEvent('bl-call-history-saved',{detail:{conversationId,callId:id}}));}catch(_){}

      const ageSelect = h('select', { class: 'input' },
        h('option', { value: 'unknown' }, 'Unknown'),
        h('option', { value: 'under_18' }, 'Under 18'),
        h('option', { value: '18_plus' }, '18+')
      );
      ageSelect.value = p.age_status || 'unknown';

      const renderProfile = q => profileBox.replaceChildren(
        h('dl', { class: 'kv paycard section' },
          KvRow('Account ID', q.account_id || '—'),
          KvRow('Messaging ID', q.messaging_id || '—'),
          KvRow('BharathMail ID', q.bharatmail_address || '—'),
          KvRow('Display name', q.display_name || 'Not set'),
          KvRow('Age status', q.age_status || 'unknown'),
          KvRow('Mobile verified', q.mobile_verified ? 'Yes' : 'No'),
          KvRow('Aadhaar verified', q.aadhaar_verified ? 'Yes' : 'No'),
          KvRow('KYC verified', q.kyc_verified ? 'Yes' : 'No'),
          KvRow('UPI verified', q.upi_verified ? 'Yes' : 'No'),
          KvRow('Verified legal name', q.legal_name_verified ? (q.verified_legal_name || q.legal_name || 'Verified') : 'Not verified'))
      );
      renderProfile(p);

      const saveMsg = h('div', { 'aria-live': 'polite' });
      const saveBtn = Button('Save profile to Supabase', { onClick: async () => {
        saveMsg.replaceChildren();
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        try {
          const updated = await Supabase.updateMyProfile({
            displayName: nameInput.value.trim() || null,
            ageStatus: ageSelect.value
          });
          if (!updated) throw new Error('No updated profile was returned.');
          renderProfile(updated);
          nameInput.value = updated.display_name || '';
          ageSelect.value = updated.age_status || 'unknown';
          saveMsg.replaceChildren(Notice('info', 'Profile saved to Supabase successfully.'));
        } catch (ex) {
          saveMsg.replaceChildren(Notice('warn', `Profile save failed: ${ex.message || 'Unknown error'}`));
        } finally {
          saveBtn.disabled = false; saveBtn.textContent = 'Save profile to Supabase';
        }
      }});

      const verifyBtn = Button('Run Phase 1B checks', { variant: 'secondary', onClick: async () => {
        saveMsg.replaceChildren();
        verifyBtn.disabled = true; verifyBtn.textContent = 'Checking…';
        try {
          const before = await Supabase.myProfile();
          if (!before) throw new Error('Profile could not be loaded.');
          const required = ['user_id','account_id','messaging_id','bharatmail_address'];
          const missing = required.filter(k => !before[k]);
          if (missing.length) throw new Error(`Missing server fields: ${missing.join(', ')}`);

          const ids = {
            account_id: before.account_id,
            messaging_id: before.messaging_id,
            bharatmail_address: before.bharatmail_address
          };

          // Read twice from the server and verify existing compatibility IDs do not drift.
          const again = await Supabase.myProfile();
          const stable = again &&
            again.account_id === ids.account_id &&
            again.messaging_id === ids.messaging_id &&
            again.bharatmail_address === ids.bharatmail_address;
          if (!stable) throw new Error('Existing server IDs changed unexpectedly.');

          saveMsg.replaceChildren(Notice('info', [
            h('strong', null, 'Phase 1B checks PASS.'), h('br'),
            'Authenticated profile read works; Account ID and existing compatibility IDs are present and stable. ',
            'Profile UPDATE is scoped to the signed-in user. Trust fields are not included in client updates.'
          ]));
        } catch (ex) {
          saveMsg.replaceChildren(Notice('warn', `Phase 1B check failed: ${ex.message || 'Unknown error'}`));
        } finally {
          verifyBtn.disabled = false; verifyBtn.textContent = 'Run Phase 1B checks';
        }
      }});

      const e2eeMsg = h('div', { 'aria-live': 'polite' });
      const activateE2EE = Button('Activate E2EE on this browser', { variant: 'secondary', onClick: async () => {
        activateE2EE.disabled=true; e2eeMsg.replaceChildren();
        try { const d=await E2EEBackend.activate(); e2eeMsg.replaceChildren(Notice('info', `E2EE device active: ${d.deviceId}`)); }
        catch(ex){ e2eeMsg.replaceChildren(Notice('warn', `E2EE activation failed: ${ex.message||'Unknown error'}`)); }
        finally { activateE2EE.disabled=false; }
      }});
      const e2eeText = h('input', { class:'input', type:'text', maxlength:'5000', placeholder:'Encrypted test message' });
      const sendE2EE = Button('Send encrypted backend test', { onClick: async () => {
        const text=e2eeText.value.trim(); if(!text){ e2eeMsg.replaceChildren(Notice('warn','Enter a test message.')); return; }
        sendE2EE.disabled=true; e2eeMsg.replaceChildren();
        try { const r=await E2EEBackend.sendV2(text); e2eeText.value=''; e2eeMsg.replaceChildren(Notice('info', `Encrypted message stored with ${r.envelopeCount} device envelope(s). No plaintext was sent.`)); }
        catch(ex){ e2eeMsg.replaceChildren(Notice('warn', `Encrypted send failed: ${ex.message||'Unknown error'}`)); }
        finally { sendE2EE.disabled=false; }
      }});

      status.replaceChildren(
        Notice('info', [h('strong', null, 'Supabase profile connected successfully.'), h('br'),
          'Phone OTP remains disabled for now.']),
        profileBox,
        h('div', { class: 'section' },
          h('h2', null, 'Profile update test'),
          h('div', { class: 'field' }, h('label', null, 'Display name'), nameInput),
          h('div', { class: 'field' }, h('label', null, 'Age status'), ageSelect),
          saveBtn, verifyBtn, saveMsg),
        h('div', { class: 'section' },
          h('h2', null, 'Phase 1B E2EE backend test'),
          h('p', { class: 'hint' }, 'Private key stays non-extractable in this browser. Activate E2EE on both test accounts before sending.'),
          activateE2EE, e2eeText, sendE2EE, e2eeMsg),
        Button('Sign out test session', { variant: 'secondary', onClick: () => {
          Supabase.clearTestSession();
          status.replaceChildren(Notice('info', 'Test session cleared. Sign in again to confirm the saved profile persists.'));
        }})
      );
    };

    const form = h('form', { novalidate: 'novalidate', onSubmit: async e => {
      e.preventDefault(); emailErr.textContent = ''; passErr.textContent = ''; status.replaceChildren();
      const ev = email.value.trim();
      if (!ev || !ev.includes('@')) { emailErr.textContent = 'Enter a valid test email.'; return; }
      if (!password.value) { passErr.textContent = 'Enter the test account password.'; return; }
      btn.disabled = true; btn.textContent = 'Connecting…';
      try {
        await Supabase.signInWithPassword(ev, password.value);
        password.value = '';
        const profile = await Supabase.syncMyProfile();
        if (!profile) throw new Error('Signed in, but no profile row was returned.');
        showProfile(profile);
      } catch (ex) {
        Supabase.clearTestSession();
        status.replaceChildren(Notice('warn', `Test login failed: ${ex.message || 'Unknown error'}`));
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in & test Supabase';
      }
    }},
      h('div', { class: 'field' }, h('label', { for: 'test-email' }, 'Test account email'), email, emailErr),
      h('div', { class: 'field' }, h('label', { for: 'test-password' }, 'Password'), password, passErr), btn);

    setTimeout(async () => {
      if (!Supabase.restoreTestSession()) return;
      try { const p = await Supabase.syncMyProfile(); if (p) { showProfile(p); if (Router.current() !== '/test-login') App.refresh(); } }
      catch (_) { Supabase.clearTestSession(); }
    }, 0);

    return Screen({ title: 'Phase 1B test login', back: backRoute, children: [
      Notice('dev', [h('strong', null, 'Temporary testing only. '),
        'Use an existing Supabase email test account. Do not share its password in chat.']),
      h('p', { class: 'lede' }, 'This verifies real Supabase Auth and the protected profiles table before phone OTP is connected at the end.'),
      form, status
    ]});
  },

  /* ----- Onboarding 3: OTP ----- */
  otp(flow = null) {
    const P = Auth.pending;
    const linking = (flow || P?.flow) === 'link';
    const err = ErrorText('otp-err');
    const input = h('input', { class: 'input input--otp', id: 'otp', name: 'otp', type: 'text', inputmode: 'numeric',
      autocomplete: 'one-time-code', maxlength: String(CONFIG.OTP_LENGTH), required: true, 'aria-describedby': 'otp-err' });
    const btn = Button('Verify code', { type: 'submit' });
    const resendBtn = Button('Resend code', { variant: 'ghost' });
    const tick = () => {
      const wait = Math.ceil((P.resendAvailableAt - Date.now()) / 1000);
      resendBtn.disabled = wait > 0;
      resendBtn.textContent = wait > 0 ? `Resend code in ${wait}s` : 'Resend code';
    };
    tick();
    const iv = setInterval(tick, 1000); Lifecycle.add(() => clearInterval(iv));
    resendBtn.addEventListener('click', async () => { await Auth.resend(); Toast.show('New test code created'); App.render(); });

    const form = h('form', { novalidate: 'novalidate', onSubmit: async e => {
      e.preventDefault(); setError(err, input, '');
      const v = Validate.otp(input.value);
      if (!v.ok) return setError(err, input, v.error);
      btn.disabled = true;
      const r = await Auth.verify(v.value);
      if (r.ok) {
        if (r.flow === 'link') {
          Toast.show('Mobile ownership demo completed. Real provider verification is still pending.');
          return Router.go('/identity', { replace: true });
        }
        return Router.go('/setup', { replace: true });
      }
      btn.disabled = false;
      const msg = {
        mismatch: `That code doesn\u2019t match. ${r.attemptsLeft} ${r.attemptsLeft === 1 ? 'attempt' : 'attempts'} left.`,
        expired: 'This code has expired. Request a new one.',
        locked: 'Too many wrong attempts. Request a new code.',
        no_session: 'This code is no longer valid. Request a new one.'
      }[r.reason] || 'The code could not be checked.';
      if (r.reason !== 'mismatch') { clearInterval(iv); btn.disabled = true; resendBtn.disabled = false; resendBtn.textContent = 'Request a new code'; }
      setError(err, input, msg);
    } }, Field({ id: 'otp', label: 'One-time code', input, error: err }), btn);

    return Screen({ title: 'Enter the code', back: linking ? '/mobile-link' : '/mobile', children: [
      h('p', { class: 'lede' }, `Code for ${Util.formatMobile(P.mobile)}.`),
      Auth.provider.isDevelopment ? Notice('dev', [h('strong', null, 'Test mode. '), 'No SMS was sent. Your test code is ',
        h('strong', { class: 'devcode', id: 'dev-otp' }, P.devCode), '.']) : null,
      form,
      h('div', { class: 'stack section' }, resendBtn,
        Button('Change number', { variant: 'ghost', onClick: () => Router.go(linking ? '/mobile-link' : '/mobile', { replace: true }) }))] });
  },

  /* ----- Onboarding 4: Activation / Identity setup ----- */
  setup() {
    const err = ErrorText('name-err'), ageErr = ErrorText('age-err');
    const input = h('input', { class: 'input', id: 'displayname', name: 'displayname', type: 'text', autocomplete: 'name',
      autocapitalize: 'words', maxlength: '60', required: true, 'aria-describedby': 'displayname-hint name-err' });
    const radio = (value, label) => h('label', { class: 'choice' }, h('input', { type: 'radio', name: 'age', value }), h('span', null, label));
    const form = h('form', { novalidate: 'novalidate', onSubmit: e => {
      e.preventDefault(); setError(err, input, ''); ageErr.textContent = '';
      const v = Validate.displayName(input.value);
      if (!v.ok) return setError(err, input, v.error);
      const age = form.querySelector('input[name="age"]:checked');
      if (!age) { ageErr.textContent = 'Choose your age group.'; return; }
      Identity.create({ displayName: v.value, ageStatus: age.value === 'adult' ? 'adult' : 'minor' });
      Router.go('/onboard/identity', { replace: true });
    } },
      Field({ id: 'displayname', label: 'Display name', input, error: err,
        hint: 'Choose the name people will see. It is self-declared and is not your verified legal identity.' }),
      h('fieldset', { class: 'fieldset' }, h('legend', null, 'Age'),
        h('div', { class: 'choices' }, radio('adult', '18 or older'), radio('minor', 'Under 18')),
        h('p', { class: 'hint' }, 'Self-declared for now.'), ageErr),
      Notice('info', 'This prototype never asks for your Aadhaar number or any ID document number, and does not store them.', 'shield'),
      Button('Continue', { type: 'submit' }));
    return Screen({ title: 'Set up your identity', children: [
      h('p', { class: 'lede' }, 'Your number is confirmed for this test session. Choose a display name. Legal identity verification is separate.'), form] });
  },

  /* ----- Onboarding 5: Digital identity + activation chain ----- */
  onboardIdentity() {
    const s = Store.state, running = Verification.running;
    return Screen({ title: 'Your digital identity', children: [
      h('p', { class: 'lede' }, 'This is your identity so far. Each trust check below activates when an authorised partner is connected.'),
      TrustCard(s, { showIds: false }),
      Section('Activation', TrustThread(s),
        h('p', { class: 'hint section' }, 'You can simulate the checks to preview activation. Simulated results are labelled Demo / Test and never count as verification.')),
      h('div', { class: 'stack section' },
        Button(running ? 'Simulating\u2026' : 'Simulate checks (demo)', { variant: 'secondary', disabled: running,
          onClick: () => Verification.runDemoChecks(() => App.refresh()) }),
        Button('Continue', { disabled: running, onClick: () => Router.go('/onboard/ids') }))] });
  },

  /* ----- Onboarding 6: Automatic IDs ----- */
  onboardIds() {
    const s = Store.state;
    if (!s.ids) {
      const status = h('p', { class: 'lede', role: 'status' }, 'Creating your IDs\u2026');
      IdService.allocateFor(s).then(ids => { Store.update(st => { st.ids = ids; }); App.refresh(); })
        .catch(() => { status.textContent = 'Your IDs could not be created. Go back and try again.'; });
      return Screen({ title: 'Your BharathLink IDs', back: '/onboard/identity', children: [status] });
    }
    return Screen({ title: 'Your BharathLink IDs', back: '/onboard/identity', children: [
      h('p', { class: 'lede' }, 'These were created automatically from your account. They aren\u2019t usernames you pick, so two people with the same name always get different IDs.'),
      IdBlock('Messaging ID', s.ids.messagingId, 'chat'),
      IdBlock('BharathMail ID', s.ids.mailId, 'mail'),
      Notice('warn', 'Provisional: allocated on this device. In production the BharathLink server issues final IDs and guarantees they are unique.'),
      Button('Go to Home', { onClick: () => {
        Store.update(st => { st.onboarding.complete = true; });
        Mail.seedWelcome();
        Router.go('/home', { replace: true });
      } })] });
  },

  /* ----- Home ----- */
  home() {
    const s=Store.state;
    const sum=Verification.summary(s);
    const verified=!!s.verifiedIdentity;

    const header=h('header',{class:'topbar topbar--home'},
      Logo(32),
      h('span',{class:'wordmark'},'BharathLink'),
      h('span',{class:'pill'},verified?'Identity verified':'Trust dashboard')
    );

    const activityBox=h('div',{class:'bl-home-activity'});
    const activityState=h('div',{class:'bl-home-loading'},Supabase.accessToken?'Loading live activity…':'Sign in to load live cross-layer activity.');

    const msgCount=h('span',{class:'bl-home-service-count'});
    const mailCount=h('span',{class:'bl-home-service-count'});
    const callCount=h('span',{class:'bl-home-service-count'});
    const payCount=h('span',{class:'bl-home-service-count'});

    const setCount=(node,n)=>{
      const v=Math.max(0,Number(n)||0);
      node.textContent=String(v);
      node.style.display=v?'inline-flex':'none';
    };

    const service=(key,route,icon,title,desc,link,countNode)=>h('a',{
      class:`bl-home-service bl-home-service--${key}`,href:`#${route}`
    },
      countNode||null,
      h('span',{class:'bl-home-service-icon'},Icon(icon,24)),
      h('span',null,
        h('span',{class:'bl-home-service-title'},title),
        h('span',{class:'bl-home-service-desc'},desc),
        h('span',{class:'bl-home-service-link'},`${link}  ›`)
      )
    );

    const profile=h('section',{class:'bl-home-profile'},
      h('div',{class:'bl-home-profile-main'},
        h('button',{class:'profile-avatar-button bl-home-status-avatar',type:'button','aria-label':'View your status',title:'View your status',onClick:async()=>{
          try{if(await StatusStories.openOwnerStories())return;}catch(ex){Toast.show(ex.message||'Could not open your status.');return;}
          Router.go('/identity');
        }},ProfileAvatar(s.profile.displayName,'avatar--on-ink')),
        h('div',null,
          h('div',{class:'bl-home-profile-name'},s.profile.displayName),
          h('div',{class:'bl-home-profile-sub'},
            verified
              ? `Verified legal name: ${s.verifiedIdentity.legalName}`
              : `${Util.maskMobile(s.account.mobile)} · Identity verification pending`
          )
        ),
        h('button',{class:'bl-home-profile-action',type:'button','aria-label':'Open profile',onClick:()=>Router.go('/identity')},'›')
      ),
      h('div',{class:'bl-home-trustline'},
        h('span',null,'BharathLink trust state'),
        h('span',{class:'bl-home-truststate'},verified?'✓ Verified identity':'○ Not verified')
      )
    );

    const services=h('div',{class:'bl-home-services'},
      service('calls','/calls','phone','Calling','Caller identity and secure call history','Open calling',callCount),
      service('chats','/chats','chat','Messaging','End-to-end encrypted chats and groups','Open messages',msgCount),
      service('mail','/mail','mail','BharathMail','Identity-aware secure mailbox','Open mailbox',mailCount),
      service('pay','/pay','rupee','UPI / Pay','Review identity before handing off payment','Open payments',payCount),
      service('identity','/identity','id','Identity','Display name, verified legal name and permanent IDs','Open identity')
    );

    const warning=h('div',{class:'bl-home-warning'},
      h('strong',null,'⚠ Core principle: Verified ≠ Safe. '),
      'Verification confirms who an account belongs to through authorised checks. It never guarantees that a person, call, message or payment request is safe, legitimate or free from fraud.'
    );

    const aiTrustCard=h('div',{
      class:'bl-ai-home',role:'button',tabindex:'0',
      onClick:()=>Router.go('/trust-ai'),
      onKeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();Router.go('/trust-ai');}}
    },
      h('div',{class:'bl-ai-home-top'},
        h('span',{class:'bl-ai-home-icon'},'✦'),
        h('span',{class:'bl-ai-home-copy'},
          h('span',{class:'bl-ai-home-title'},'AI Trust Engine'),
          h('span',{class:'bl-ai-home-sub'},'Local explainable checks across Messaging, BharathMail and UPI/Pay. No external AI API in this phase.')
        ),
        h('span',{class:'bl-ai-home-link'},'Open ›')
      )
    );

    const activityRow=a=>{
      const iconName=a.kind==='mail'?'mail':a.kind==='pay'?'rupee':a.kind==='call'?'phone':'chat';
      const cls=`bl-home-activity-icon ${a.kind||'message'}`;
      const open=()=>{
        if(a.kind==='call'&&a.callMessageId){
          try{sessionStorage.setItem('bl_call_target_message',String(a.callMessageId));}catch(_){}
        }else if(a.jumpMessageId){
          try{sessionStorage.setItem('bl_jump_message',String(a.jumpMessageId));}catch(_){}
        }
        if(a.route)Router.go(a.route);
      };
      return h('div',{
        class:`bl-home-activity-row${a.empty?' is-empty':''}`,
        role:'link',tabindex:'0',
        onClick:open,
        onKeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}}
      },
        h('span',{class:cls},Icon(iconName,21)),
        h('span',{class:'bl-home-activity-copy'},
          h('span',{class:'bl-home-activity-title'},a.title),
          h('span',{class:'bl-home-activity-preview'},a.preview||'')
        ),
        h('span',{class:'bl-home-activity-right'},
          h('span',{class:'bl-home-activity-time'},a.timeLabel||'')
        )
      );
    };

    const formatActivityTime=at=>{
      const t=Number(at)||new Date(at||0).getTime();
      if(!t)return '';
      const d=new Date(t),now=new Date();
      if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const yesterday=new Date(now);yesterday.setDate(now.getDate()-1);
      if(d.toDateString()===yesterday.toDateString())return'Yesterday';
      return d.toLocaleDateString([],{day:'2-digit',month:'short'});
    };

    const loadActivity=async()=>{
      const latest={message:null,call:null,pay:null,mail:null};
      let unreadMessages=0,unreadMail=0,callCountTotal=0;

      const newer=(kind,item)=>{
        if(!item)return;
        const at=Number(item.at)||new Date(item.at||0).getTime()||0;
        const old=latest[kind];
        const oldAt=old?(Number(old.at)||new Date(old.at||0).getTime()||0):0;
        if(!old||at>oldAt)latest[kind]=item;
      };

      /* Latest UPI / payment item */
      try{
        for(const p of Payments.list()){
          newer('pay',{
            kind:'pay',
            at:p.updatedAt||p.createdAt,
            title:`₹${Number(p.amount||0).toLocaleString('en-IN')} · UPI / Pay`,
            preview:p.payeeName?`Recipient: ${p.payeeName}`:Payments.targetLabel(p),
            route:`/pay/${p.id}`
          });
        }
        setCount(payCount,Payments.list().length);
      }catch(_){}

      if(Supabase.accessToken){
        /* Latest encrypted MESSAGE and latest CALL, separately. */
        try{
          const convs=await E2EEBackend.directConversations();
          const limited=(convs||[]).slice(0,10);
          for(const cv of limited){
            let cutoff=null,rows=[],unread=0;
            try{cutoff=await E2EEBackend.getConversationClearCutoff(cv.conversation_id);}catch(_){}
            try{rows=await E2EEBackend.receiveV2(cv.conversation_id,cutoff,true,20);}catch(_){}
            try{unread=await E2EEBackend.unreadCount(cv.conversation_id);}catch(_){}
            unreadMessages+=Number(unread)||0;

            const name=cv.peer_display_name||cv.peer_messaging_id||'BharathLink contact';
            for(const m of rows){
              if(m.call){
                callCountTotal++;
                const c=m.call||{},video=c.media==='video';
                let preview='';
                if(c.outcome==='completed'){
                  const sec=Math.max(0,Math.floor(Number(c.duration_sec)||0));
                  preview=sec<60?`Completed · ${sec}s`:`Completed · ${Math.floor(sec/60)}m ${sec%60}s`;
                }else{
                  const raw=String(c.outcome||'Call ended').replace(/_/g,' ');
                  preview=raw.charAt(0).toUpperCase()+raw.slice(1);
                }
                newer('call',{
                  kind:'call',
                  at:m.created_at,
                  title:`${name} · ${video?'Video call':'Voice call'}`,
                  preview,
                  route:'/calls',
                  callMessageId:m.message_id
                });
                continue;
              }

              if(m.payment_request||m.payment_response)continue;

              let preview='';
              if(m.photo)preview='📷 Photo';
              else if(m.video)preview='🎥 Video';
              else if(m.audio)preview='🎵 Audio';
              else if(m.document)preview='📄 Document';
              else preview=String(m.text||'Encrypted message').replace(/\s+/g,' ').trim().slice(0,95)||'Encrypted message';

              newer('message',{
                kind:'message',
                at:m.created_at,
                title:`${name} · Messaging`,
                preview,
                route:`/e2ee-chat/${cv.conversation_id}`,
                jumpMessageId:m.message_id
              });
            }
          }
        }catch(_){}

        /* Latest inbox email only. */
        try{
          await Mail.refresh({force:false});
          const inbox=Mail.list('inbox')||[];
          unreadMail=inbox.filter(m=>!m.read).length;
          for(const m of inbox){
            newer('mail',{
              kind:'mail',
              at:m.at,
              title:`${m.from||'BharathMail'} · BharathMail`,
              preview:`${m.subject||'(No subject)'}${m.body?` · ${String(m.body).replace(/\s+/g,' ').trim().slice(0,70)}`:''}`,
              route:`/mail/${m.id}`
            });
          }
        }catch(_){}
      }

      setCount(msgCount,unreadMessages);
      setCount(mailCount,unreadMail);
      setCount(callCount,callCountTotal);

      /* Always show the same four layers, matching the reference screen. */
      const rows=[
        latest.message ? {...latest.message,timeLabel:formatActivityTime(latest.message.at)} : {

  /* ----- AI Trust Engine: local explainable phase ----- */
  trustAi() {
    const status=h('div',{class:'bl-ai-status'},Supabase.accessToken?'Scanning recent local trust context…':'Sign in to include encrypted Messaging and BharathMail context.');
    const summary=h('div',{class:'bl-ai-summary'});
    const list=h('div',{class:'bl-ai-signal-list'});

    const openSignal=s=>{
      if(s.messageId){
        try{sessionStorage.setItem('bl_jump_message',String(s.messageId));}catch(_){}
      }
      if(s.route)Router.go(s.route);
    };

    const signalNode=s=>h('div',{
      class:'bl-ai-signal',
      role:s.route?'button':undefined,
      tabindex:s.route?'0':undefined,
      onClick:s.route?(()=>openSignal(s)):undefined,
      onKeydown:s.route?(e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSignal(s);}}):undefined
    },
      h('div',{class:'bl-ai-signal-head'},
        h('span',{class:`bl-ai-severity ${s.severity||'info'}`},s.severity||'info'),
        h('span',{class:'bl-ai-signal-title'},s.title)
      ),
      h('div',{class:'bl-ai-signal-reason'},s.reason),
      h('div',{class:'bl-ai-signal-action'},`Suggested check: ${s.action}`),
      h('div',{class:'bl-ai-signal-source'},s.source||'BharathLink Trust Engine')
    );

    const intro=h('div',{class:'bl-ai-intro'},
      h('strong',null,'AI Trust Engine · Phase 1'),
      'This first version uses transparent local rules across Messaging, BharathMail and UPI/Pay to detect trust mismatches and risky request patterns. It does not decide that a person is a scammer.',
      h('div',{class:'bl-ai-privacy'},'Privacy: decrypted E2EE messages and mail content are checked locally in this page. This phase sends no decrypted content to an external AI model.')
    );

    const axes=h('div',{class:'bl-ai-four'},
      h('div',{class:'bl-ai-axis'},h('strong',null,'WHO'),h('span',null,'Who is the person or institution?')),
      h('div',{class:'bl-ai-axis'},h('strong',null,'SAME WHO'),h('span',null,'Does identity stay consistent across channels?')),
      h('div',{class:'bl-ai-axis'},h('strong',null,'WHERE'),h('span',null,'Where will money or value actually terminate?')),
      h('div',{class:'bl-ai-axis'},h('strong',null,'AUTHORITY'),h('span',null,'Is this verified party authorised for this exact request?'))
    );

    const load=async()=>{
      try{
        const signals=await TrustEngine.scan();
        if(!signals.length){
          list.replaceChildren(h('div',{class:'bl-ai-empty'},
            h('strong',null,'No material signal found in the bounded recent scan'),
            'This does not prove that a call, message, email or payment is safe. Continue verifying unexpected requests.'
          ));
          summary.replaceChildren(
            h('div',{class:'bl-ai-summary-card high'},h('strong',null,'0'),h('span',null,'High')),
            h('div',{class:'bl-ai-summary-card medium'},h('strong',null,'0'),h('span',null,'Medium')),
            h('div',{class:'bl-ai-summary-card info'},h('strong',null,'0'),h('span',null,'Info'))
          );
          status.textContent='Scan complete · 0 material signals';
          return;
        }
        list.replaceChildren(...signals.map(signalNode));
        const high=signals.filter(x=>x.severity==='high').length;
        const med=signals.filter(x=>x.severity==='medium').length;
        const info=signals.filter(x=>x.severity==='info').length;
        summary.replaceChildren(
          h('div',{class:'bl-ai-summary-card high'},h('strong',null,String(high)),h('span',null,'High')),
          h('div',{class:'bl-ai-summary-card medium'},h('strong',null,String(med)),h('span',null,'Medium')),
          h('div',{class:'bl-ai-summary-card info'},h('strong',null,String(info)),h('span',null,'Info'))
        );
        status.textContent=`Scan complete · ${signals.length} material signal${signals.length===1?'':'s'}`;
      }catch(ex){
        list.replaceChildren(h('div',{class:'bl-ai-empty'},h('strong',null,'Trust scan could not complete'),ex?.message||'Unknown error'));
        status.textContent='Scan failed';
      }
    };

    const node=Screen({title:'AI Trust Engine',back:'/home',nav:'home',children:[
      intro,
      axes,
      status,
      summary,
      list,
      h('div',{class:'bl-ai-rule'},'Core rules: Not Verified ≠ Scam. Verified ≠ Safe. A risk signal is a reason to verify, not a verdict. Sensitive actions such as sending money still require the user’s explicit decision.')
    ]});
    node.classList.add('bl-ai-screen');
    setTimeout(()=>load(),0);
    return node;
  },

    const professionalVerifiedValue=h('span',null,'No verified professional title');

      ageTrustBox.replaceChildren(h('p',{class:'hint'},'Loading Age Trust state…'));
      try{

          AgeTrust.myState().catch(()=>null),
          AgeTrust.pendingGuardianRequests().catch(()=>[]),
          AgeTrust.mobileAccessStates().catch(()=>[]),
          AgeTrust.pendingAgeRequests().catch(()=>[]),

        const nodes=[];

            const btn=Button('Send guardian request',{variant:'secondary',onClick:async()=>{

            nodes.push(h('div',{class:'bl-entity-card'},

        nodes.push(h('div',{style:'font-weight:750;margin-top:8px'},'Parents & guardians'));
        if(guardians.length){
          for(const g of guardians){

                h('span',{class:`bl-entity-badge ${fullyVerified?'is-verified':'is-pending'}`},fullyVerified?'Verified':'Pending')),
              h('div',{class:'bl-entity-card__meta'},`Messaging ID: ${g.guardian_messaging_id||'—'}`),
              h('div',{class:'bl-entity-card__meta'},`Identity: ${identityOk?'verified':'pending'} · Relationship: ${relationOk?'verified':'pending'} · Consent: ${g.guardian_consent_recorded?'recorded':'pending'}`),

                h('span',{class:`bl-entity-badge ${fullyVerified?'is-verified':'is-pending'}`},fullyVerified?'Guardian link verified':'Link pending')),
              h('div',{class:'bl-entity-card__meta'},`Your relationship: ${relationshipLabel(c.relationship)}`),
              h('div',{class:'bl-entity-card__meta'},`Messaging ID: ${c.child_messaging_id||'—'}`),
              h('div',{class:'bl-entity-card__meta'},`Guardian identity: ${guardianIdentityOk?'verified':'pending'} · Relationship: ${relationOk?'verified':'pending'} · Consent: ${c.guardian_consent_recorded?'recorded':'pending'}`),

            nodes.push(h('div',{class:'bl-entity-card'},

            ));

      if(!Supabase.accessToken){Toast.show('Sign in first.');return;}
      const ov=h('div',{class:'profile-sheet',onClick:e=>{if(e.target===ov)ov.remove();}});

      const validUntil=h('input',{class:'input',type:'date','aria-label':'Valid until (optional)'});
      const msg=h('div',{class:'hint'},'The raw registration/licence reference is sent to the protected backend only to create a one-way hash; it is not stored or shown publicly. Submission stays Pending until an authoritative verifier confirms it.');
      const submit=Button('Submit for verification',{onClick:async()=>{
        if(String(credential.value||'').trim().length<2){msg.textContent='Enter the credential / qualification name.';return;}
        if(String(authority.value||'').trim().length<2){msg.textContent='Enter the issuing or registration authority.';return;}
        if(String(reference.value||'').trim().length<4){msg.textContent='Enter the registration / licence reference.';return;}
        if(validFrom.value&&validUntil.value&&validUntil.value<validFrom.value){msg.textContent='Valid-until date cannot be before valid-from date.';return;}
        submit.disabled=true;
        try{
          await ProfessionalCredentials.submit({professionCode:type.value,credentialName:credential.value,issuingAuthority:authority.value,registrationReference:reference.value,validFrom:validFrom.value||null,validUntil:validUntil.value||null});
          reference.value='';
          ov.remove();
          Toast.show('Professional credential submitted. The title remains unverified until an authoritative check passes.');
          await loadProfessionalCredentials();
        }catch(ex){msg.textContent=ex.message||'Could not submit professional credential.';}
        finally{if(submit.isConnected)submit.disabled=false;}
      }});
      ov.append(h('div',{class:'profile-sheet__card',onClick:e=>e.stopPropagation()},
        h('h2',{class:'profile-sheet__title'},'Add professional credential'),
        h('p',{class:'hint'},'A professional title is never self-issued. BharathLink shows Dr., CA, Adv., CS, CMA or Ar. as verified only after an independent authoritative credential check.'),
        type,credential,authority,reference,
        h('div',{class:'hint',style:'margin-top:8px'},'Validity dates (optional)'),validFrom,validUntil,msg,
        h('div',{class:'btn-row'},Button('Cancel',{variant:'secondary',onClick:()=>ov.remove()}),submit)));
      document.body.appendChild(ov);credential.focus();
    };

    const loadProfessionalCredentials=async()=>{

    const renderPermanentIdentity = info => {

    const loadDirect=async()=>{

      if(!Supabase.accessToken){directActive=[];directArchived=[];directLoaded=true;loading=false;syncStatus.textContent='Sign in required';renderResults();return;}
      try{
        const [rows,archivedRows,pinnedRows,manualUnreadRows,deletedRows,profileRows,storyRows]=await Promise.all([
          E2EEBackend.directConversations(),E2EEBackend.getMyArchivedConversations(),E2EEBackend.getMyPinnedConversations(),E2EEBackend.getMyUnreadConversations(),E2EEBackend.getMyDeletedConversations(),ProfilePresence.directMedia(true).catch(()=>[]),StatusStories.direct(true).catch(()=>[])

        profileByConversation=new Map((profileRows||[]).map(r=>[String(r.conversation_id),r]));
        const storiesByOwner=new Map();
        for(const st of (storyRows||[])){

          if(!peerStories.length)continue;
          const key=String(cv.conversation_id); const base=profileByConversation.get(key)||{};
          profileByConversation.set(key,{...base,peer_user_id:cv.peer_user_id,status_active:true,status_seen:peerStories.every(x=>!!x.seen),status_text:base.status_text||peerStories[0]?.status_text||'',status_created_at:base.status_created_at||peerStories[0]?.created_at||null});
        }

        manualUnreadIds=new Set((manualUnreadRows||[]).map(archiveId).filter(Boolean));
        const deletedAt=new Map((deletedRows||[]).map(r=>[archiveId(r),r?.deleted_at||'']).filter(([id])=>id));
        const pinnedAt=new Map((pinnedRows||[]).map(r=>[archiveId(r),r?.pinned_at||'']).filter(([id])=>id));
        const enrich=async cv=>{
          let cutoff=null;try{cutoff=await E2EEBackend.getConversationClearCutoff(cv.conversation_id);}catch(_){}
          const deleteCutoff=deletedAt.get(cv.conversation_id)||null;
          const floor=[cutoff,deleteCutoff].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0]||null;
          let last=null,headProbeOk=false,head=null;
          try{const heads=await E2EEBackend.groupMessageHeads(cv.conversation_id,1);headProbeOk=true;head=Array.isArray(heads)?heads[0]||null:null;}catch(_){}
          if(headProbeOk){
            const headVisible=!!head&&(!floor||new Date(head.created_at).getTime()>new Date(floor).getTime());
            if(headVisible){const cached=directPreviewCache.get(cv.conversation_id);if(cached&&String(cached.message_id)===String(head.message_id))last=cached;else{try{const msgs=await E2EEBackend.receiveV2(cv.conversation_id,floor,true,1);last=msgs[msgs.length-1]||null;if(last)directPreviewCache.set(cv.conversation_id,last);}catch(_){last=cached||null;}}}else directPreviewCache.delete(cv.conversation_id);
          }else{try{const msgs=await E2EEBackend.receiveV2(cv.conversation_id,floor,true,1);last=msgs[msgs.length-1]||null;if(last)directPreviewCache.set(cv.conversation_id,last);}catch(_){last=directPreviewCache.get(cv.conversation_id)||null;}}
          let unread=0;try{unread=await E2EEBackend.unreadCount(cv.conversation_id);}catch(_){}if(!last)unread=0;
          return {...cv,last,unread,hiddenByDelete:!!deleteCutoff&&!last};
        };
        const allById=new Map((rows||[]).map(cv=>[cv.conversation_id,cv]));
        (archivedRows||[]).forEach(a=>{const id=archiveId(a);if(id&&!allById.has(id))allById.set(id,a.conversation||a);});
        const enriched=await Promise.all([...allById.values()].filter(cv=>cv?.conversation_id).map(enrich));
        const visible=enriched.filter(cv=>!cv.hiddenByDelete);
        directActive=visible.filter(cv=>!archivedIds.has(cv.conversation_id));
        directArchived=visible.filter(cv=>archivedIds.has(cv.conversation_id));
        directActive.sort((a,b)=>{const ap=pinnedIds.has(a.conversation_id),bp=pinnedIds.has(b.conversation_id);if(ap!==bp)return ap?-1:1;if(ap&&bp)return new Date(pinnedAt.get(b.conversation_id)||0)-new Date(pinnedAt.get(a.conversation_id)||0);return new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0);});
        directArchived.sort((a,b)=>new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0));

    };

          h('div',{class:'bl-msg-brand'},h('span',{class:'bl-msg-logo'},'💬'),h('div',{class:'bl-msg-brandcopy'},h('strong',null,'Messaging'),brandSub)),
          h('button',{type:'button',class:'bl-msg-new',onClick:()=>Router.go('/chats/new')},'✎ New chat')

      h('div',{class:'bl-msg-tabs'},chatsTab,groupsTab),
      h('div',{class:'bl-msg-trust'},h('strong',null,'⚠ Trust principle: '),'Verified ≠ Safe. End-to-end encryption protects message content; identity verification confirms who an account belongs to, not their intent.'),

        if(issued){idAddress.replaceChildren(...breakable(p.permanent_messaging_id));idBadge.textContent='✓ Identity verified';idBadge.classList.add('is-verified');brandSub.textContent='Verified identity · End-to-end encrypted';}
        else{idAddress.textContent='Pending identity verification';idBadge.textContent='Not verified';idBadge.classList.remove('is-verified');brandSub.textContent='End-to-end encrypted messaging';}
      }catch(_){}
    },0);

    const node=Screen({title:'Messaging',back:'/home',nav:'chats',children:[backdrop,drawer,shell]});
    setTimeout(loadDirect,0);setTimeout(loadGroups,0);

    const refresh=async()=>{if(stopped||document.hidden||Router.current()!=='/chats'||!Supabase.accessToken||busy)return;busy=true;try{await loadDirect();if(mode==='groups')await loadGroups();}finally{busy=false;}};
    const schedule=()=>{clearTimeout(timer);if(!stopped)timer=setTimeout(async()=>{await refresh();schedule();},30000);};

    let pendingLocalTyping=null;
    const topic=`realtime:bl-typing-${conversationId}`;
    const send=(event,payload={},forcedTopic=topic)=>{
      if(!ws||ws.readyState!==1)return false;
      const r=String(++ref),jr=event==='phx_join'?r:(event==='heartbeat'?null:joinRef);
      try{ws.send(JSON.stringify({topic:forcedTopic,event,payload,ref:r,join_ref:jr}));return r;}catch(_){return false;}
    };
    const sendTypingState=value=>send('broadcast',{type:'broadcast',event:'typing',payload:{typing:!!value}});
    try{
      const u=new URL(CONFIG.SUPABASE_URL);
      const wsUrl=`wss://${u.host}/realtime/v1/websocket?apikey=${encodeURIComponent(CONFIG.SUPABASE_PUBLISHABLE_KEY)}&vsn=1.0.0`;
      ws=new WebSocket(wsUrl);
      ws.onopen=()=>{
        joinRef=send('phx_join',{config:{private:true,broadcast:{ack:false,self:false},presence:{enabled:false},postgres_changes:[]},access_token:Supabase.accessToken||''});
        heartbeat=setInterval(()=>send('heartbeat',{},'phoenix'),25000);
      };
      ws.onmessage=e=>{
        let m;try{m=JSON.parse(e.data);}catch(_){return;}
        if(m.event==='phx_reply'&&m.ref===joinRef&&m.topic===topic){
          joined=m.payload?.status==='ok';
          try{onStatus?.(joined?'joined':'join-failed',joined?'':JSON.stringify(m.payload?.response||m.payload||{}).slice(0,220));}catch(_){}
          if(joined&&pendingLocalTyping!==null){
            const value=pendingLocalTyping;
            pendingLocalTyping=null;
            sendTypingState(value);
          }
          return;
        }
        if(m.topic===topic&&(m.event==='phx_error'||m.event==='phx_close')){
          joined=false;
          try{onStatus?.('channel-error',m.event);}catch(_){}
          return;
        }
        if(m.topic===topic&&m.event==='broadcast'&&m.payload?.event==='typing'){
          onTyping(!!m.payload?.payload?.typing);
          clearTimeout(stopTimer);
          if(m.payload?.payload?.typing)stopTimer=setTimeout(()=>onTyping(false),2200);
        }
      };
      ws.onerror=()=>{joined=false;try{onStatus?.('socket-error','');}catch(_){}};
      ws.onclose=()=>{joined=false;try{onStatus?.('socket-close','');}catch(_){}};
    }catch(_){ }
    return {
      typing(value){
        const v=!!value;
        if(joined){pendingLocalTyping=null;sendTypingState(v);}
        else pendingLocalTyping=v;
      },
      close(){closed=true;joined=false;pendingLocalTyping=null;clearInterval(heartbeat);clearTimeout(stopTimer);try{if(ws&&ws.readyState===1)send('phx_leave',{});ws?.close();}catch(_){} }
    };
  },

    const attachBtn=h('button',{class:'bl-compose-iconbtn bl-compose-attach',type:'button','aria-label':'Attach file',title:'Attach file',onClick:()=>attach.click()},'📎');

      const files=selectedAttachments.slice();const mode=Mail.sendMode({to:vTo.value,cc:cc.value,bcc:bcc.value});

  mailMessage(id) {
    const m=Mail.get(id);if(!m)return Views.notFound('/mail');
    if(m.folder==='inbox'){
      const wasUnread=!m.read;
      if(wasUnread){
        Mail.setMeta(id,{read:true});
        m.read=true;
        const rr=Mail.remote.find(x=>String(x.id)===String(id));
        if(rr)rr.read=true;
        const ll=Store.state.mail.messages.find(x=>String(x.id)===String(id));
        if(ll)ll.read=true;
      }
      if(Supabase.accessToken&&m.source==='external'&&wasUnread){
        Supabase.request('/rest/v1/rpc/mark_my_external_bharatmail_read',{method:'POST',body:JSON.stringify({p_message_id:String(id),p_read:true})}).then(()=>{Mail.lastRefreshAt=0;}).catch(()=>{});
      }else if(Supabase.accessToken&&m.source!=='external'&&m.delivery!=='local'){
        Supabase.request('/rest/v1/rpc/mark_bharatmail_read',{method:'POST',body:JSON.stringify({p_message_id:id})}).then(()=>{Mail.lastRefreshAt=0;return Mail.refresh({force:true});}).catch(()=>{});
        Supabase.request('/rest/v1/rpc/record_bharatmail_open',{method:'POST',body:JSON.stringify({p_message_id:id})}).catch(()=>{});
      }
    }

    const reply=()=>{Mail.composeSeed={title:'Reply',external:m.source==='external',to:m.from,subject:/^Re:/i.test(m.subject)?m.subject:`Re: ${m.subject}`,body:`\n\n--- Original message ---\nFrom: ${m.from}\n${m.body}`};Router.go('/mail/compose');};
    const replyAll=()=>{Mail.composeSeed={title:'Reply all',external:m.source==='external',to:m.from,subject:/^Re:/i.test(m.subject)?m.subject:`Re: ${m.subject}`,body:`\n\n--- Original message ---\nFrom: ${m.from}\n${m.body}`};Router.go('/mail/compose');};
    const forward=()=>{Mail.composeSeed={title:'Forward',to:'',subject:/^Fwd:/i.test(m.subject)?m.subject:`Fwd: ${m.subject}`,body:`\n\n--- Forwarded message ---\nFrom: ${m.from}\nTo: ${m.to}\nSubject: ${m.subject}\n\n${m.body}`};Router.go('/mail/compose');};

      const svg=svgEl('svg',{viewBox:'0 0 24 24',width:size,height:size,fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'});
      paths.forEach(d=>svg.appendChild(svgEl('path',{d})));
      return svg;
    };
    const I={

      trash:()=>detailIcon(['M4 7h16','M9 7V4h6v3','M7 7l1 13h8l1-13']),
      unread:()=>detailIcon(['M3 6h18v12H3z','M3 7l9 7 9-7']),
      reply:()=>detailIcon(['M9 9l-5 4 5 4','M5 13h8c4 0 6 2 6 6']),
      replyAll:()=>detailIcon(['M8 8l-4 4 4 4','M4 12h8c4 0 6 2 6 6','M13 7l-2 2 2 2']),
      forward:()=>detailIcon(['M15 9l5 4-5 4','M19 13h-8c-4 0-6 2-6 6'])
    };

    const runAction=async(kind,back=false)=>{
      try{await Mail.action(id,kind);if(back)Router.go('/mail',{replace:true});}
      catch(ex){Toast.show(ex.message||'Mail action failed.');}
    };

    const moreWrap=h('div',{class:'bl-detail-morewrap'});
    const moreMenu=h('div',{class:'bl-detail-menu'});moreMenu.hidden=true;
    let openDetailsFromMenu=()=>{};
    const menuButton=(icon,label,fn,cls='')=>h('button',{type:'button',class:cls,onClick:()=>{moreMenu.hidden=true;fn();}},h('span',{'aria-hidden':'true'},icon),h('span',{},label));
    moreMenu.append(
      menuButton(m.starred?'★':'☆',m.starred?'Unstar':'Star',()=>runAction('star')),
      menuButton('✉',m.read?'Mark unread':'Mark read',()=>runAction(m.read?'unread':'read')),
      menuButton('ⓘ','Message details',()=>openDetailsFromMenu()),
      h('div',{class:'bl-detail-menu-sep'}),
