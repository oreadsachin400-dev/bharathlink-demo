  async receiveV2(conversationId, clearCutoff=null, latestOnly=false, latestLimit=50, beforeCursor=null){
    const local=await this.activate();
    if(!conversationId)throw new Error('Conversation-scoped encrypted message fetch requires conversationId.');
    const rows=[];
    // Migration egress guard: every encrypted-message read is server-filtered to one
    // conversation and one bounded page. Older history is fetched only when the user
    // explicitly asks for it, using the stable (created_at,message_id) cursor.
    const pageSize=Math.max(1,Math.min(50,Number(latestLimit)||50));
    const beforeCreatedAt=beforeCursor?.created_at||null;
    const beforeMessageId=beforeCursor?.message_id||null;
    const batch=await this.rpc('get_my_encrypted_messages_v2_for_conversation',{
      p_device_id:local.deviceId,
      p_conversation_id:conversationId,
      p_limit:pageSize,
      p_before_created_at:beforeCreatedAt,
      p_before_message_id:beforeMessageId
    });
    let arr=Array.isArray(batch)?batch:[];
    if(clearCutoff){
      const cutoffMs=new Date(clearCutoff).getTime();
      arr=arr.filter(r=>new Date(r.created_at).getTime()>cutoffMs);
    }
    rows.push(...arr);
    // Conversation RPC returns newest-first; renderer expects chronological.
    rows.sort((a,b)=>{
      const ta=new Date(a.created_at).getTime(), tb=new Date(b.created_at).getTime();
      if(ta!==tb)return ta-tb;
      return String(a.message_id).localeCompare(String(b.message_id));
    });
    const out=[];
    for(const r of (rows||[])){
      try{
        const header={v:2,conversation_id:r.conversation_id,client_message_id:r.client_message_id,sender_user_id:r.sender_id,sender_device_id:r.sender_device_id};
        const wrapKey=await this.deriveUnwrapKey(local.privateKey,r.sender_public_key_jwk,r.eph_pub,header,local.deviceId);
        const envAad=this.enc.encode(this.canon({...header,recipient_user_id:local.userId,recipient_device_id:local.deviceId}));
        const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(r.wrap_iv),additionalData:envAad},wrapKey,this.unb64(r.wrapped_key));
        const msgKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(r.message_iv),additionalData:this.enc.encode(this.canon(header))},msgKey,this.unb64(r.message_ciphertext));
        const decoded=this.dec.decode(pt);
        let text=decoded,reply=null,forwarded=false,forward_source=null,photo=null,video=null,audio=null,document=null,location=null,contact=null,album=null,call=null,payment_request=null,payment_response=null,disappearing=null,disappearing_control=null,view_once=null;
        if(decoded.startsWith('BLMSG1:')){
          try{const payload=JSON.parse(decoded.slice(7));text=String(payload?.text??'');reply=payload?.reply||null;forwarded=payload?.forwarded===true;forward_source=payload?.forward_source||null;photo=payload?.photo||null;video=payload?.video||null;audio=payload?.audio||null;document=payload?.document||null;location=LocationShare.sanitize(payload?.location);contact=ContactShare.sanitize(payload?.contact);album=payload?.album||null;call=payload?.call||null;payment_request=payload?.payment_request||null;payment_response=payload?.payment_response||null;disappearing=payload?.disappearing||null;disappearing_control=payload?.disappearing_control||null;view_once=payload?.view_once||null;}catch(_){}
        }
        out.push({...r,text,reply,forwarded,forward_source,photo,video,audio,document,location,contact,album,call,payment_request,payment_response,disappearing,disappearing_control,view_once,decryptOk:true});
      }catch(_){out.push({...r,text:'Unable to decrypt this message',decryptOk:false});}
    }
    return out;
  }
};

/* =====================================================================
   5D. E2EE V2 DEVICE REGISTRATION TEST (TEST BUILD ONLY)
   Isolated plumbing test for the V2 backend. It does NOT touch V1
   messaging: not E2EEBackend, not messaging_devices, not the V1 IndexedDB
   database 'bharathlink-e2ee-v2'.
   Exact RPC signature used (no other parameters are ever sent):
     register_e2ee_v2_device(p_device_id uuid,
                             p_signing_public_key text,
                             p_curve25519_public_key text)
   - Uses the existing authenticated Supabase session. No password, no manual token.
   - p_curve25519_public_key is a real WebCrypto X25519 public key. If this
     browser has no X25519 support the test FAILS; it never substitutes P-256.
   - p_signing_public_key is WebCrypto Ed25519 when supported, otherwise an
     ECDSA P-256 fallback that is labelled as such.
   - These are TEMPORARY TEST keys for backend plumbing only. They are not the
     production identity/prekey keys, and there is no X3DH/PQXDH or Double
     Ratchet here. Production V2 crypto will come from a vetted library.
   - Private keys are non-extractable and never leave IndexedDB.
   - Public keys are sent as base64 of the raw public key bytes.
   ===================================================================== */
const E2EEV2DeviceTest = {
  DB: 'bharathlink-e2ee-v2-device-test', STORE: 'devices', RECORD_VERSION: 2,
  RPC: 'register_e2ee_v2_device',
  RPC_PARAMS: Object.freeze(['p_device_id', 'p_signing_public_key', 'p_curve25519_public_key']),
  result: null, running: false, autoRan: false,
  b64(buf) { let s = ''; for (const b of new Uint8Array(buf)) s += String.fromCharCode(b); return btoa(s); },
  hex(bytes) { return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(''); },
  uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const x = this.hex(b); return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}`;
  },
  slot(userId) { return `test-device:${userId}`; },
  openDb() { return new Promise((resolve, reject) => { const r = indexedDB.open(this.DB, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(this.STORE)) r.result.createObjectStore(this.STORE); };
    r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); }); },
  async idb(mode, fn) { const db = await this.openDb(); return new Promise((resolve, reject) => {
    const tx = db.transaction(this.STORE, mode), req = fn(tx.objectStore(this.STORE)); let out = null;
    if (req) req.onsuccess = () => { out = req.result; };
    tx.oncomplete = () => { db.close(); resolve(out); }; tx.onerror = () => { db.close(); reject(tx.error); }; }); },
  getLocal(userId) { return this.idb('readonly', s => s.get(this.slot(userId))); },
  putLocal(userId, v) { return this.idb('readwrite', s => s.put(v, this.slot(userId))); },
  delLocal(userId) { return this.idb('readwrite', s => s.delete(this.slot(userId))); },

  assertBrowserSafeKey() {
    const k = String(CONFIG.SUPABASE_PUBLISHABLE_KEY || '');
    if (k.startsWith('sb_secret_')) throw new Error('A secret key is configured. Refusing to run.');
    if (k.startsWith('eyJ')) { try { if (JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role === 'service_role') throw new Error('x'); }
      catch (_) { throw new Error('Configured key is not a browser-safe publishable key. Refusing to run.'); } }
  },
  async generateLocal(userId) {
    let x;
    try { x = await crypto.subtle.generateKey({ name: 'X25519' }, false, ['deriveBits']); }
    catch (_) { throw new Error('This browser does not support WebCrypto X25519, so no Curve25519 test key could be made. Update Chrome and try again.'); }
    let sign, signAlg;
    try { sign = await crypto.subtle.generateKey({ name: 'Ed25519' }, false, ['sign', 'verify']); signAlg = 'Ed25519'; }
    catch (_) { sign = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']); signAlg = 'ECDSA-P256'; }
    return { v: this.RECORD_VERSION, userId, deviceId: this.uuid(), createdAt: Date.now(), registeredAt: null, verifiedReturnedId: null,
      signing: { alg: signAlg, privateKey: sign.privateKey, publicKey: sign.publicKey, rawB64: this.b64(await crypto.subtle.exportKey('raw', sign.publicKey)) },
      curve25519: { alg: 'X25519', privateKey: x.privateKey, publicKey: x.publicKey, rawB64: this.b64(await crypto.subtle.exportKey('raw', x.publicKey)) } };
  },
  signParams(alg) { return alg === 'Ed25519' ? { name: 'Ed25519' } : { name: 'ECDSA', hash: 'SHA-256' }; },
  async checkLocal(l) {
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(l.deviceId || '')) throw new Error('Local device ID is not a valid UUID.');
    if (l.curve25519?.alg !== 'X25519' || atob(l.curve25519.rawB64).length !== 32) throw new Error('Local Curve25519 test key is not a 32-byte X25519 public key.');
    for (const k of [l.signing?.privateKey, l.curve25519?.privateKey]) {
      if (!(k instanceof CryptoKey) || k.type !== 'private') throw new Error('A local private key is missing.');
      if (k.extractable !== false) throw new Error('A local private key is extractable. Refusing to continue.');
    }
    const msg = new TextEncoder().encode(`bharathlink-v2-test|${l.deviceId}|${l.curve25519.rawB64}`);
    const sig = await crypto.subtle.sign(this.signParams(l.signing.alg), l.signing.privateKey, msg);
    if (!await crypto.subtle.verify(this.signParams(l.signing.alg), l.signing.publicKey, sig, msg)) throw new Error('Local signing key self-check failed.');
  },
  buildPayload(l) {
    const payload = { p_device_id: l.deviceId, p_signing_public_key: l.signing.rawB64, p_curve25519_public_key: l.curve25519.rawB64 };
    const keys = Object.keys(payload);
    if (keys.length !== this.RPC_PARAMS.length || !this.RPC_PARAMS.every(k => keys.includes(k))) throw new Error('Payload does not match the exact RPC signature.');
    for (const v of Object.values(payload)) if (typeof v !== 'string' || !v) throw new Error('Every RPC parameter must be a non-empty string.');
    if (/"d"\s*:/.test(JSON.stringify(payload))) throw new Error('Refusing to send: payload contains private key material.');
    return payload;
  },
  async callRpc(name, body, allowRefresh = true) {
    const go = () => fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${name}`, { method: 'POST', headers: Supabase.headers(), body: JSON.stringify(body) });
    let res = await go();
    if (res.status === 401 && allowRefresh && Supabase.refreshToken) { await Supabase.refreshAccessToken(); res = await go(); }
    const text = await res.text(); let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
    return { ok: res.ok, status: res.status, data };
  },
  extractId(d, depth = 0) {
    if (depth > 3 || d == null) return null;
    if (Array.isArray(d)) return this.extractId(d[0], depth + 1);
    if (typeof d === 'string') return d;
    if (typeof d === 'object') {
      const direct = d.device_id || d.id || d.p_device_id;
      if (typeof direct === 'string') return direct;
      for (const v of Object.values(d)) { const x = this.extractId(v, depth + 1); if (x) return x; }
    }
    return null;
  },
  describe(res) {
    const d = res.data && typeof res.data === 'object' ? res.data : {};
    return [`HTTP ${res.status}`, d.code, d.message || (typeof res.data === 'string' ? res.data : ''), d.details, d.hint ? `Hint: ${d.hint}` : '']
      .filter(Boolean).join(' | ');
  },
  async run() {
    if (this.running) return;
    this.running = true;
    const r = this.result = { auth: 'pending', keys: 'pending', rpc: 'pending', userId: null, deviceId: null, returnedId: null,
      signingAlg: null, notes: [], sentParams: [], server: null };
    this.refresh();
    try {
      try {
        this.assertBrowserSafeKey();
        if (!Supabase.accessToken) throw new Error('Not signed in. Sign in with the BharathLink login first.');
        const me = await Supabase.currentAuthUser();
        r.userId = me.id; r.auth = 'pass';
      } catch (e) { r.auth = 'fail'; r.notes.push(`Authenticated user: ${e.message}`); return; }

      let local;
      try {
        if (!window.isSecureContext || !crypto?.subtle) throw new Error('WebCrypto is unavailable because this page is not a secure context.');
        local = await this.getLocal(r.userId);
        if (!local || local.userId !== r.userId || local.v !== this.RECORD_VERSION) {
          if (local && local.v !== this.RECORD_VERSION) r.notes.push('Replaced an older local test device from the previous test build.');
          local = await this.generateLocal(r.userId); await this.putLocal(r.userId, local);
          r.notes.push('Generated a new local test device.');
        } else r.notes.push('Reused the saved local test device.');
        await this.checkLocal(local);
        r.deviceId = local.deviceId; r.signingAlg = local.signing.alg; r.keys = 'pass';
        if (local.signing.alg !== 'Ed25519') r.notes.push('This browser has no WebCrypto Ed25519, so the signing test key is ECDSA P-256.');
      } catch (e) { r.keys = 'fail'; r.notes.push(`Local key generation: ${e.message}`); return; }

      try {
        const payload = this.buildPayload(local);
        r.sentParams = Object.keys(payload);
        const res = await this.callRpc(this.RPC, payload);
        if (res.ok) r.returnedId = this.extractId(res.data);
        else {
          r.server = this.describe(res);
          const dup = res.data && res.data.code === '23505';
          if (dup && local.verifiedReturnedId && local.verifiedReturnedId.toLowerCase() === local.deviceId.toLowerCase()) {
            r.returnedId = local.verifiedReturnedId;
            r.notes.push(`Already registered: an earlier run on this device verified the returned ID (${new Date(local.registeredAt).toLocaleString()}). The server rejected re-registration as a duplicate.`);
          } else throw new Error(r.server);
        }
        if (!r.returnedId) throw new Error('The RPC succeeded but returned no device ID.');
        if (r.returnedId.toLowerCase() !== local.deviceId.toLowerCase())
          throw new Error(`Returned device ID ${r.returnedId} does not match the local device ID.`);
        local.registeredAt = local.registeredAt || Date.now(); local.verifiedReturnedId = r.returnedId;
        await this.putLocal(r.userId, local);
        r.rpc = 'pass';
      } catch (e) { r.rpc = 'fail'; r.notes.push(`V2 device registration RPC: ${e.message}`); }
    } finally {
      for (const k of ['auth', 'keys', 'rpc']) if (r[k] === 'pending') r[k] = 'skip';
      this.running = false; this.refresh();
    }
  },
  async forget() {
    const me = await Supabase.currentAuthUser();
    await this.delLocal(me.id);
    this.result = null; this.refresh();
  },
  refresh() { if (Router.current() === '/e2ee-v2-test') App.refresh(); }
};

/* =====================================================================
   5E. ENCRYPTED LOCATION SHARING (Phase 1E.17)
   - Location is requested ONLY after the user taps 📍 Location, never on load.
   - Coordinates travel only inside the existing BLMSG1 payload, which
     E2EEBackend.sendV2 encrypts with AES-GCM before anything reaches Supabase.
     There are no plaintext coordinate columns or separate requests.
   - Received locations are validated before display (untrusted sender).
   - Maps link uses Google Maps URLs over HTTPS (no API key, no SDK).
   ===================================================================== */
const LocationShare = {
  OPTIONS: Object.freeze({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }),
  round(n) { return Math.round(n * 1e6) / 1e6; },
  sanitize(v) {
    if (!v || typeof v !== 'object') return null;
    const num = x => typeof x === 'number' ? x : (typeof x === 'string' && x.trim() !== '' ? Number(x) : NaN);
    const lat = num(v.lat), lng = num(v.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    const acc = num(v.accuracy_m), t = num(v.captured_at);
    return { v: 1, lat: this.round(lat), lng: this.round(lng),
      accuracy_m: v.accuracy_m != null && Number.isFinite(acc) && acc >= 0 && acc < 1e7 ? Math.round(acc) : null,
      captured_at: v.captured_at != null && Number.isFinite(t) && t > 0 ? Math.round(t) : null };
  },
  errorMessage(err) {
    switch (err && err.code) {
      case 1: return 'Location permission was denied. Allow location for this site in your browser settings, then try again.';
      case 2: return 'Your location is unavailable right now. Turn on device location (GPS) and try again.';
      case 3: return 'Getting your location took too long. Try again, ideally with a clear view of the sky.';
      default: return 'Could not get your location. Please try again.';
    }
  },
  request() {
    return new Promise((resolve, reject) => {
      const geo = navigator.geolocation;
      if (!geo || typeof geo.getCurrentPosition !== 'function')
        return reject(new Error('This browser does not support location sharing.'));
      if (!window.isSecureContext)
        return reject(new Error('Location sharing needs a secure HTTPS page. Open BharathLink from its HTTPS address to share your location.'));
      geo.getCurrentPosition(pos => {
        const loc = this.sanitize({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy_m: pos.coords.accuracy, captured_at: pos.timestamp });
        loc ? resolve(loc) : reject(new Error('The device returned an invalid location.'));
      }, err => reject(new Error(this.errorMessage(err))), this.OPTIONS);
    });
  },
  mapsUrl(loc) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${loc.lat},${loc.lng}`)}`; },
  accuracyLabel(m) { return m == null ? 'unknown accuracy' : m >= 1000 ? `±${(m / 1000).toFixed(1)} km` : `±${m} m`; },
  open(loc) {
    const a = document.createElement('a');
    a.href = this.mapsUrl(loc); a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.click();
  }
};

/* =====================================================================
   5F. ENCRYPTED CONTACT SHARING (Phase 1E.18)
   - Starts ONLY when the user taps 👤 Contact. Uses the browser Contact
     Picker (navigator.contacts.select) where available (Android Chrome,
     secure page); otherwise the user types the contact into a small form.
     No fake or sample contacts, no address-book access beyond the one pick.
   - The contact travels only inside the existing BLMSG1 payload, which
     E2EEBackend.sendV2 encrypts before anything reaches Supabase.
   - Every contact (sent or received) is validated/normalised here; the card
     only renders text nodes, and tel:/mailto: links are built from
     normalised values only.
   ===================================================================== */
const ContactShare = {
  MAX: Object.freeze({ name: 100, phones: 3, emails: 3 }),
  clean(s, max) {
    return typeof s === 'string' ? s.replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim().slice(0, max) : '';
  },
  phone(p) {
    const s = this.clean(p, 40);
    if (!/^\+?[0-9 ()\-.]+$/.test(s)) return '';
    const digits = s.replace(/\D/g, '');
    if (digits.length < 3 || digits.length > 15) return '';
    return (s.startsWith('+') ? '+' : '') + digits;
  },
  email(e) {
    const s = this.clean(e, 254);
    return /^[^\s@<>"'()\[\]\\,;:]+@[^\s@<>"'()\[\]\\,;:]+\.[^\s@<>"'()\[\]\\,;:]{2,}$/.test(s) ? s : '';
  },
  sanitize(v) {
    if (!v || typeof v !== 'object') return null;
    const list = (a, fn, max) => [...new Set((Array.isArray(a) ? a : []).map(x => fn.call(this, x)).filter(Boolean))].slice(0, max);
    const phones = list(v.phones, this.phone, this.MAX.phones), emails = list(v.emails, this.email, this.MAX.emails);
    if (!phones.length && !emails.length) return null;
    return { v: 1, name: this.clean(v.name, this.MAX.name) || phones[0] || emails[0], phones, emails };
  },
  pickerAvailable() { return !!(navigator.contacts && typeof navigator.contacts.select === 'function'); },
  async pick() {
    let props = ['name', 'tel', 'email'];
    try { if (typeof navigator.contacts.getProperties === 'function') { const ok = await navigator.contacts.getProperties(); props = props.filter(p => ok.includes(p)); } } catch (_) {}
    if (!props.includes('tel') && !props.includes('email')) throw new Error('This browser cannot read phone numbers or emails from contacts.');
    const res = await navigator.contacts.select(props, { multiple: false });
    const c = Array.isArray(res) ? res[0] : null;
    if (!c) return { contact: null, reason: 'none' };
    const name = this.clean(Array.isArray(c.name) ? c.name[0] : '', this.MAX.name);
    const contact = this.sanitize({ name, phones: c.tel, emails: c.email });
    return contact ? { contact } : { contact: null, reason: 'unusable', name };
  },
  summary(c) { return [c.name, ...c.phones, ...c.emails].filter((x, i, a) => a.indexOf(x) === i).join('\n'); },
  open(href) { const a = document.createElement('a'); a.href = href; a.rel = 'noopener noreferrer'; a.click(); }
};

/* =====================================================================
   5G. LINK CARDS (Phase 1E.19)
   - Links are ordinary message text, so they are already end-to-end
     encrypted by the existing BLMSG1/sendV2 pipeline. Nothing new is sent.
   - Only http(s) and www. links are recognised; everything is parsed with
     URL() and shown with its real host name (punycode stays visible).
   - No preview fetching: fetching titles/thumbnails would reveal the link to
     other servers and is blocked by this app's CSP anyway.
   ===================================================================== */
const LinkShare = {
  RE: /(?:https?:\/\/|www\.)[^\s<>"'`]+/gi,
  parse(raw) {
    const s = String(raw).replace(/[.,;:!?)\]}'"]+$/, '');
    try {
      const u = new URL(/^www\./i.test(s) ? `https://${s}` : s);
      if ((u.protocol !== 'https:' && u.protocol !== 'http:') || !u.hostname.includes('.') || u.username || u.password) return null;
      return { text: s, href: u.href, url: u };
    } catch (_) { return null; }
  },
  split(text) {
    const out = [], s = String(text || ''); let last = 0; this.RE.lastIndex = 0;
    for (const m of s.matchAll(this.RE)) {
      const link = this.parse(m[0]); if (!link) continue;
      if (m.index > last) out.push({ t: s.slice(last, m.index) });
      out.push({ link }); last = m.index + link.text.length;
    }
    if (last < s.length) out.push({ t: s.slice(last) });
    return out;
  },
  first(text) { const p = this.split(text).find(x => x.link); return p ? p.link : null; },
  kind(u) {
    const host = u.hostname.toLowerCase().replace(/^(www|m)\./, ''), path = u.pathname.toLowerCase();
    if (host === 'music.youtube.com') return { icon: '🎵', title: 'YouTube Music' };
    if (host === 'youtube.com' || host === 'youtu.be' || host.endsWith('.youtube.com'))
      return path.startsWith('/shorts/') ? { icon: '▶️', title: 'YouTube Shorts' } : { icon: '▶️', title: 'YouTube video' };
    const music = { 'open.spotify.com': 'Spotify', 'spotify.com': 'Spotify', 'jiosaavn.com': 'JioSaavn', 'gaana.com': 'Gaana', 'wynk.in': 'Wynk Music', 'music.apple.com': 'Apple Music', 'soundcloud.com': 'SoundCloud' };
    if (music[host]) return { icon: '🎵', title: music[host] };
    if (host === 'instagram.com' && /^\/(reel|reels|p)\//.test(path)) return { icon: '🎬', title: 'Instagram' };
    return { icon: '🔗', title: 'Link' };
  },
  open(href) { const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.click(); }
};

/* =====================================================================
   6. AUTH / OTP PROVIDER
   OtpProvider interface (swap DevLocalOtpProvider for a server-backed one):
     sendOtp(mobile)            -> Promise<{ sessionId, expiresAt, resendAvailableAt, devCode? }>
     verifyOtp(sessionId, code) -> Promise<{ ok:true, mobile } | { ok:false, reason, attemptsLeft? }>
   A real provider runs both steps on the server, never exposes the code,
   and on success sets an httpOnly session cookie. The UI does not change.
   ===================================================================== */
const DevLocalOtpProvider = {
  id: 'dev-local-otp', isDevelopment: true, authoritative: false,
  _sessions: new Map(), // memory only
  async sendOtp(mobile) {
    const now = Date.now(), sessionId = Util.uuid(), code = Util.randomDigits(CONFIG.OTP_LENGTH);
    this._sessions.clear();
    this._sessions.set(sessionId, { mobile, code, expiresAt: now + CONFIG.OTP_TTL_MS, attempts: 0 });
    return { sessionId, expiresAt: now + CONFIG.OTP_TTL_MS, resendAvailableAt: now + CONFIG.OTP_RESEND_MS, devCode: code };
  },
  async verifyOtp(sessionId, code) {
    const s = this._sessions.get(sessionId);
    if (!s) return { ok: false, reason: 'no_session' };
    if (Date.now() > s.expiresAt) { this._sessions.delete(sessionId); return { ok: false, reason: 'expired' }; }
    s.attempts++;
    if (Util.constantTimeEqual(code, s.code)) { this._sessions.delete(sessionId); return { ok: true, mobile: s.mobile }; }
    const left = CONFIG.OTP_MAX_ATTEMPTS - s.attempts;
    if (left <= 0) { this._sessions.delete(sessionId); return { ok: false, reason: 'locked' }; }
    return { ok: false, reason: 'mismatch', attemptsLeft: left };
  }
};

const Auth = {
  provider: DevLocalOtpProvider,
  pending: null,     // in-memory OTP session; lost on refresh by design
  lastMobile: '',
  lastFlow: 'signup',
  async start(mobile, flow = 'signup') {
    const r = await this.provider.sendOtp(mobile);
    this.lastMobile = mobile;
    this.lastFlow = flow === 'link' ? 'link' : 'signup';
    this.pending = Object.assign({ mobile, flow: this.lastFlow }, r);
    return this.pending;
  },
  resend() {
    const mobile = this.pending ? this.pending.mobile : this.lastMobile;
    const flow = this.pending ? this.pending.flow : this.lastFlow;
    return this.start(mobile, flow);
  },
  async verify(code) {
    if (!this.pending) return { ok: false, reason: 'no_session' };
    const pending = this.pending;
    const r = await this.provider.verifyOtp(pending.sessionId, code);
    if (r.ok) {
      this.pending = null;
      if (pending.flow === 'link' && Store.state.account) {
        Store.update(s => {
          s.account.mobile = r.mobile;
          s.account.authProvider = this.provider.id;
          s.account.authAuthoritative = !!this.provider.authoritative;
          s.account.mobileLinkedAt = Date.now();
        });
        Verification.record('mobile', {
          status: this.provider.isDevelopment ? VStatus.DEMO : VStatus.VERIFIED,
          note: this.provider.isDevelopment ? 'Local test OTP matched. No SMS/provider verification was performed.' : null
        }, this.provider);
      } else {
        Account.create(r.mobile, this.provider);
      }
      return Object.assign({}, r, { flow: pending.flow });
    }
    if (r.reason !== 'mismatch') this.pending = null;
    return Object.assign({}, r, { flow: pending.flow });
  }
};

const Account = {
  create(mobile, provider) {
    Store.update(s => {
      s.account = { accountId: Util.uuid(), mobile, createdAt: Date.now(),
        authProvider: provider.id, authAuthoritative: !!provider.authoritative };
    });
    Verification.record('mobile', {
      status: provider.isDevelopment ? VStatus.DEMO : VStatus.VERIFIED,
      note: provider.isDevelopment ? 'Test code shown on screen. No SMS was sent.' : null
    }, provider);
  }
};


/* =====================================================================
   PROFILE / STATUS CONTACT SYNC
   - Optional backend layer: requires BharatLink_Profile_Status_Sync.sql.
   - Profile/status media stays in a PRIVATE Storage bucket.
   - Only the owner and users who already share a 1:1 conversation may read.
   - Message ciphertext, E2EE keys, Realtime and media-message transport are untouched.
   - If the migration is not installed, every method fails soft and the local
     profile/status foundation continues to work exactly as before.
   ===================================================================== */
const ProfilePresence = {
  BUCKET: 'profile-media',
  _directRows: [], _directAt: 0, _objectUrls: new Map(), _objectPromises: new Map(),
  _syncPromise: null, _syncDone: false,
  rpc(name, body = {}) {
    if (!Supabase.accessToken) return Promise.reject(new Error('Sign in required.'));
    return Supabase.request(`/rest/v1/rpc/${name}`, { method: 'POST', body: JSON.stringify(body) });
  },
  encPath(path) { return String(path || '').split('/').map(encodeURIComponent).join('/'); },
  dataUrlBlob(dataUrl) {
    const m = /^data:(image\/[a-z0-9.+-]+);base64,([A-Za-z0-9+/=]+)$/i.exec(String(dataUrl || ''));
    if (!m) throw new Error('Invalid profile image data.');
    const bin = atob(m[2]), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: m[1] || 'image/jpeg' });
  },
  blobDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader(); r.onload = () => resolve(String(r.result || '')); r.onerror = () => reject(r.error || new Error('Could not read image.')); r.readAsDataURL(blob);
    });
  },
  async uploadDataUrl(dataUrl, kind) {
    if (!Supabase.accessToken) throw new Error('Sign in required for profile sync.');
    const me = await Supabase.currentAuthUser();
    const blob = this.dataUrlBlob(dataUrl);
    if (blob.size > 1572864) throw new Error('Profile image is too large after processing.');
    const path = `${me.id}/${kind}/${Date.now()}-${Util.uuid()}.jpg`;
    const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/${this.BUCKET}/${this.encPath(path)}`, {
      method: 'POST',
      headers: Supabase.headers({ 'Content-Type': 'image/jpeg', 'x-upsert': 'false' }),
      body: blob
    });
    if (!res.ok) {
      let msg = ''; try { msg = (await res.json())?.message || ''; } catch (_) {}
      throw new Error(msg || `Profile media upload failed (${res.status}).`);
    }
    return path;
  },
  async deletePath(path) {
    if (!path || !Supabase.accessToken) return;
    try { await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/${this.BUCKET}/${this.encPath(path)}`, { method: 'DELETE', headers: Supabase.headers() }); } catch (_) {}
    const u = this._objectUrls.get(path); if (u) { try { URL.revokeObjectURL(u); } catch (_) {} this._objectUrls.delete(path); }
  },
  async objectUrl(path) {
    if (!path || !Supabase.accessToken) return '';
    if (this._objectUrls.has(path)) return this._objectUrls.get(path);
    if (this._objectPromises.has(path)) return this._objectPromises.get(path);
    const p = (async () => {
      const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/authenticated/${this.BUCKET}/${this.encPath(path)}`, { headers: Supabase.headers({ 'Content-Type': 'application/octet-stream' }) });
      if (!res.ok) throw new Error(`Profile media unavailable (${res.status}).`);
      const url = URL.createObjectURL(await res.blob());
      this._objectUrls.set(path, url); return url;
    })().finally(() => this._objectPromises.delete(path));
    this._objectPromises.set(path, p); return p;
  },
  async objectDataUrl(path) {
    if (!path || !Supabase.accessToken) return '';
    const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/authenticated/${this.BUCKET}/${this.encPath(path)}`, { headers: Supabase.headers({ 'Content-Type': 'application/octet-stream' }) });
    if (!res.ok) return '';
    return this.blobDataUrl(await res.blob());
  },
  async own() {
    try {
      const rows = await this.rpc('get_my_profile_media');
      // Empty rows mean the backend migration exists but this account has not
      // published profile media yet. Keep that distinct from an RPC failure so
      // syncExistingLocal() can upload an existing device-local photo/status.
      return Array.isArray(rows) ? (rows[0] || {}) : (rows || {});
    } catch (_) { return null; }
  },
  invalidate() { this._directRows = []; this._directAt = 0; },
  async publishPhoto(dataUrl) {
    const old = await this.own();
    const path = await this.uploadDataUrl(dataUrl, 'profile');
    try { await this.rpc('set_my_profile_photo', { p_storage_path: path }); }
    catch (e) { await this.deletePath(path); throw e; }
    if (old?.photo_path && old.photo_path !== path) await this.deletePath(old.photo_path);
    this.invalidate(); return path;
  },
  async clearPhoto() {
    const old = await this.own();
    await this.rpc('clear_my_profile_photo');
    if (old?.photo_path) await this.deletePath(old.photo_path);
    this.invalidate();
  },
  async publishStatus(status) {
    if (!status) throw new Error('No active status.');
    const old = await this.own();
    let path = null;
    if (status.photoData) path = await this.uploadDataUrl(status.photoData, 'status');
    try { await this.rpc('set_my_profile_status', { p_text: status.text || '', p_storage_path: path }); }
    catch (e) { if (path) await this.deletePath(path); throw e; }
    if (old?.status_photo_path && old.status_photo_path !== path) await this.deletePath(old.status_photo_path);
    this.invalidate();
  },
  async clearStatus() {
    const old = await this.own();
    await this.rpc('clear_my_profile_status');
    if (old?.status_photo_path) await this.deletePath(old.status_photo_path);
    this.invalidate();
  },
  _viewerDiag: null,
  async viewers() {
    if (!Supabase.accessToken) {
      this._viewerDiag = { ok:false, stage:'auth', error:'No Supabase access token in this file.' };
      return [];
    }
    let me = null;
    try { me = await Supabase.currentAuthUser(); }
    catch (e) {
      this._viewerDiag = { ok:false, stage:'auth-user', error:e?.message || String(e) };
      return [];
    }
    const call = async (method, body) => {
      const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/get_my_profile_status_viewers`, {
        method,
        headers: Supabase.headers(),
        ...(body !== undefined ? { body: JSON.stringify(body) } : {})
      });
      const raw = await res.text();
      let data = null;
      try { data = raw ? JSON.parse(raw) : null; } catch (_) { data = raw; }
      return { ok:res.ok, status:res.status, data, raw };
    };
    let first;
    try { first = await call('POST', {}); }
    catch (e) {
      this._viewerDiag = { ok:false, stage:'network-post', user_id:me?.id || null, error:e?.message || String(e) };
      return [];
    }
    if (first.ok) {
      const rows = Array.isArray(first.data) ? first.data : [];
      this._viewerDiag = { ok:true, method:'POST', status:first.status, user_id:me?.id || null, count:rows.length, raw:first.raw };
      return rows;
    }
    let second;
    try { second = await call('GET'); }
    catch (e) {
      this._viewerDiag = { ok:false, stage:'network-get', user_id:me?.id || null, post_status:first.status, post_raw:first.raw, error:e?.message || String(e) };
      return [];
    }
    const rows = second.ok && Array.isArray(second.data) ? second.data : [];
    this._viewerDiag = {
      ok:second.ok, method:'GET', status:second.status, user_id:me?.id || null, count:rows.length,
      post_status:first.status, post_raw:first.raw, raw:second.raw
    };
    return rows;
  },
  async directMedia(force = false) {
    if (!Supabase.accessToken) return [];
    if (!force && this._directRows.length && Date.now() - this._directAt < 15000) return this._directRows;
    try {
      const rows = await this.rpc('get_my_direct_profile_media');
      this._directRows = Array.isArray(rows) ? rows : [];
      this._directAt = Date.now(); return this._directRows;
    } catch (_) { return []; }
  },
  async forConversation(conversationId, force = false) {
    const rows = await this.directMedia(force);
    return rows.find(r => String(r.conversation_id) === String(conversationId)) || null;
  },
  applyPhoto(el, path) {
    if (!el || !path) return;
    this.objectUrl(path).then(url => {
      if (!url || !el.isConnected) return;
      el.classList.add('avatar--photo'); el.textContent = ''; el.style.backgroundImage = `url("${url}")`;
    }).catch(() => {});
  },
  async markSeen(media) {
    if (!media?.peer_user_id || !media?.status_created_at || media.status_seen) return;
    try {
      await this.rpc('mark_profile_status_seen', { p_owner_user_id: media.peer_user_id, p_status_created_at: media.status_created_at });
      media.status_seen = true;
      document.querySelectorAll(`[data-peer-user-id="${CSS.escape(String(media.peer_user_id))}"]`).forEach(el => {
        el.classList.remove('avatar--status-ring'); el.classList.add('avatar--status-seen');
      });
    } catch (_) {}
  },
  async openPeerStatus(name, media) {
    if (!media?.status_active) return;
    try { if (await StatusStories.openPeer(name, media)) return; } catch (_) {}
    const ov = h('div', { class: 'profile-sheet', onClick: e => { if (e.target === ov) ov.remove(); } });
    const photo = h('img', { class: 'status-card__media', alt: `${name} status photo`, style: 'display:none' });
    const card = h('div', { class: 'profile-sheet__card', onClick: e => e.stopPropagation() },
      h('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:10px' },
        h('div', null, h('h2', { class: 'profile-sheet__title', style: 'margin-bottom:2px' }, name), h('p', { class: 'hint' }, '24-hour status')),
        h('button', { type: 'button', class: 'btn btn--ghost', style: 'width:auto;min-width:0;padding:8px 10px', onClick: () => ov.remove(), 'aria-label': 'Close status' }, '×')),
      photo,
      media.status_text ? h('div', { class: 'status-card__text', style: 'font-size:1.08rem' }, media.status_text) : null);
    ov.append(card); document.body.appendChild(ov);
    if (media.status_photo_path) this.objectUrl(media.status_photo_path).then(url => { if (url && photo.isConnected) { photo.src = url; photo.style.display = 'block'; } }).catch(() => {});
    await this.markSeen(media);
  },
  async syncExistingLocal() {
    if (this._syncDone || !Supabase.accessToken) return;
    if (this._syncPromise) return this._syncPromise;
    this._syncPromise = (async () => {
      const remote = await this.own();
      if (remote === null) return; // migration absent or unavailable: fail soft
      const localPhoto = Store.state?.profileMedia?.photoData || '';
      const localStatus = ProfileMedia.activeStatus();
      if (localPhoto && !remote.photo_path) await this.publishPhoto(localPhoto);
      else if (!localPhoto && remote.photo_path) {
        const d = await this.objectDataUrl(remote.photo_path).catch(() => '');
        if (d) Store.update(st => { st.profileMedia.photoData = d; st.profileMedia.photoUpdatedAt = Date.now(); });
      }
      if (localStatus && !remote.status_active) await this.publishStatus(localStatus);
      else if (!localStatus && remote.status_active) {
        const d = remote.status_photo_path ? await this.objectDataUrl(remote.status_photo_path).catch(() => '') : '';
        Store.update(st => { st.profileMedia.status = { text: remote.status_text || '', photoData: d || null, createdAt: Date.parse(remote.status_created_at) || Date.now(), expiresAt: Date.parse(remote.status_expires_at) || (Date.now() + ProfileMedia.STATUS_TTL_MS) }; });
      }
      this._syncDone = true;
    })().catch(() => {}).finally(() => { this._syncPromise = null; });
    return this._syncPromise;
  }
};


/* =====================================================================
   STATUS / STORIES V2
   - Multiple 24-hour text/photo/video/audio items.
   - Private Supabase Storage bucket; only owner + existing direct contacts.
   - Per-item viewers, likes and private comments.
   - Chat-message E2EE, calls, BharathMail and payment code are untouched.
   ===================================================================== */
const StatusStories = {
  BUCKET: 'status-media',
  MAX_ITEMS: 10,
  MAX_VIDEO_BYTES: 25 * 1024 * 1024,
  MAX_AUDIO_BYTES: 20 * 1024 * 1024,
  _available: null,
  _ownRows: [], _ownAt: 0,
  _directRows: [], _directAt: 0,
  _urls: new Map(), _urlPromises: new Map(),
  rpc(name, body = {}) {
    if (!Supabase.accessToken) return Promise.reject(new Error('Sign in required.'));
    return Supabase.request(`/rest/v1/rpc/${name}`, { method: 'POST', body: JSON.stringify(body) });
  },
  first(v) { return Array.isArray(v) ? (v[0] || null) : (v || null); },
  invalidate() { this._ownRows = []; this._ownAt = 0; this._directRows = []; this._directAt = 0; ProfilePresence.invalidate(); },
  encPath(path) { return String(path || '').split('/').map(encodeURIComponent).join('/'); },
  kindForFile(file) {
    const t = String(file?.type || '').toLowerCase();
    if (t.startsWith('image/')) return 'photo';
    if (t.startsWith('video/')) return 'video';
    if (t.startsWith('audio/')) return 'audio';
    throw new Error('Choose only photos, videos or audio/music files.');
  },
  extFor(file, kind) {
    const raw = String(file?.name || '').split('.').pop()?.toLowerCase().replace(/[^a-z0-9]/g, '') || '';
    if (raw && raw.length <= 8) return raw;
    return kind === 'photo' ? 'jpg' : kind === 'video' ? 'mp4' : 'mp3';
  },
  async prepareFile(file, kind) {
    if (kind === 'photo') {
      const dataUrl = await ProfileMedia.imageData(file, { maxSide: 1440, quality: 0.78 });
      const blob = ProfilePresence.dataUrlBlob(dataUrl);
      if (blob.size > 4 * 1024 * 1024) throw new Error('Prepared photo is too large.');
      return { blob, mime: 'image/jpeg', ext: 'jpg' };
    }
    if (kind === 'video') {
      if (file.size > this.MAX_VIDEO_BYTES) throw new Error('Choose a video smaller than 25 MB.');
      return { blob: file, mime: file.type || 'video/mp4', ext: this.extFor(file, kind) };
    }
    if (file.size > this.MAX_AUDIO_BYTES) throw new Error('Choose an audio/music file smaller than 20 MB.');
    return { blob: file, mime: file.type || 'audio/mpeg', ext: this.extFor(file, kind) };
  },
  async uploadFile(file, kind) {
    if (!Supabase.accessToken) throw new Error('Sign in before sharing a status.');
    const me = await Supabase.currentAuthUser();
    const prepared = await this.prepareFile(file, kind);
    const path = `${me.id}/story/${Date.now()}-${Util.uuid()}.${prepared.ext}`;
    const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/${this.BUCKET}/${this.encPath(path)}`, {
      method: 'POST',
      headers: Supabase.headers({ 'Content-Type': prepared.mime, 'x-upsert': 'false' }),
      body: prepared.blob
    });
    if (!res.ok) {
      let msg = ''; try { msg = (await res.json())?.message || ''; } catch (_) {}
      throw new Error(msg || `Status media upload failed (${res.status}).`);
    }
    return { path, mime: prepared.mime };
  },
  async deletePath(path) {
    if (!path || !Supabase.accessToken) return;
    try { await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/${this.BUCKET}/${this.encPath(path)}`, { method: 'DELETE', headers: Supabase.headers() }); } catch (_) {}
    const u = this._urls.get(path); if (u) { try { URL.revokeObjectURL(u); } catch (_) {} this._urls.delete(path); }
  },
  async objectUrl(path) {
    if (!path || !Supabase.accessToken) return '';
    if (this._urls.has(path)) return this._urls.get(path);
    if (this._urlPromises.has(path)) return this._urlPromises.get(path);
    const p = (async () => {
      const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/authenticated/${this.BUCKET}/${this.encPath(path)}`, { headers: Supabase.headers({ 'Content-Type': 'application/octet-stream' }) });
      if (!res.ok) throw new Error(`Status media unavailable (${res.status}).`);
      const url = URL.createObjectURL(await res.blob()); this._urls.set(path, url); return url;
    })().finally(() => this._urlPromises.delete(path));
    this._urlPromises.set(path, p); return p;
  },
  async own(force = false) {
    if (!Supabase.accessToken) return [];
    if (!force && this._ownRows.length && Date.now() - this._ownAt < 10000) return this._ownRows;
    try {
      const r = await this.rpc('get_my_active_status_story_items');
      this._available = true; this._ownRows = Array.isArray(r) ? r : []; this._ownAt = Date.now(); return this._ownRows;
    } catch (e) {
      this._available = false; this._ownRows = []; this._ownAt = Date.now(); return [];
    }
  },
  async direct(force = false) {
    if (!Supabase.accessToken) return [];
    if (!force && this._directRows.length && Date.now() - this._directAt < 10000) return this._directRows;
    try {
      const r = await this.rpc('get_my_direct_status_story_items');
      this._available = true; this._directRows = Array.isArray(r) ? r : []; this._directAt = Date.now(); return this._directRows;
    } catch (e) {
      this._available = false; this._directRows = []; this._directAt = Date.now(); return [];
    }
  },
  async createBatch(files, text = '') {
    if (!Supabase.accessToken) throw new Error('Sign in before sharing a status.');
    const list = Array.from(files || []);
    if (list.length > this.MAX_ITEMS) throw new Error(`Share up to ${this.MAX_ITEMS} media items at a time.`);
    const clean = String(text || '').replace(/\r\n/g, '\n').trim().slice(0, 220);
    if (!list.length && !clean) throw new Error('Write a status or choose photo/video/music.');
    const created = [];
    if (!list.length) {
      const r = this.first(await this.rpc('create_my_status_story_item', { p_kind: 'text', p_text: clean, p_media_path: null, p_media_mime: null }));
      if (r) created.push(r);
    } else {
      for (let i = 0; i < list.length; i++) {
        const file = list[i], kind = this.kindForFile(file);
        const uploaded = await this.uploadFile(file, kind);
        try {
          const r = this.first(await this.rpc('create_my_status_story_item', {
            p_kind: kind,
            p_text: clean || null,
            p_media_path: uploaded.path,
            p_media_mime: uploaded.mime
          }));
          if (r) created.push(r);
        } catch (e) { await this.deletePath(uploaded.path); throw e; }
      }
    }
    const marker = clean || (list.length === 1 ? `${this.kindForFile(list[0])} status` : `${list.length} new status items`);
    try { ProfileMedia.setStatus({ text: marker, photoData: null }); } catch (_) {}
    this.invalidate();
    return created;
  },
  async deleteItem(row) {
    if (!row?.item_id) return;
    let path = row.media_path || null;
    const returned = await this.rpc('delete_my_status_story_item', { p_item_id: row.item_id });
    if (typeof returned === 'string' && returned) path = returned;
    if (path) await this.deletePath(path);
    this.invalidate();
    const left = await this.own(true).catch(() => []);
    if (!left.length) ProfileMedia.clearStatus();
  },
  async markSeen(itemId) { if (itemId) await this.rpc('mark_status_story_item_seen', { p_item_id: itemId }); },
  async toggleLike(itemId) { return this.first(await this.rpc('toggle_status_story_item_like', { p_item_id: itemId })); },
  async viewers(itemId) { const r = await this.rpc('get_my_status_story_item_viewers', { p_item_id: itemId }); return Array.isArray(r) ? r : []; },
  async comments(itemId) { const r = await this.rpc('get_status_story_item_comments', { p_item_id: itemId }); return Array.isArray(r) ? r : []; },
  async addComment(itemId, body) { return this.first(await this.rpc('add_status_story_item_comment', { p_item_id: itemId, p_body: String(body || '').trim().slice(0, 500) })); },
  async resolveNames(rows, idKey = 'viewer_user_id') {
    const arr = Array.isArray(rows) ? rows.map(x => ({ ...x })) : [];
    let direct = [];
    try { direct = await E2EEBackend.directConversations(); } catch (_) {}
    for (const r of arr) {
      const uid = r[idKey] || r.author_user_id;
      const c = direct.find(x => String(x.peer_user_id || '') === String(uid || '') || (r.messaging_id && x.peer_messaging_id === r.messaging_id));
      r._resolved_name = r.display_name || c?.peer_display_name || r.messaging_id || c?.peer_messaging_id || 'BharatLink contact';
    }
    return arr;
  },
  timeLabel(v) {
    if (!v) return '';
    const d = new Date(v); if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  },
  kindLabel(kind) { return ({ text: 'Text', photo: 'Photo', video: 'Video', audio: 'Music / audio' })[kind] || 'Status'; },
  async mediaNode(row, { compact = false } = {}) {
    if (!row?.media_path) return row?.status_text ? h('div', { class: 'status-card__text', style: compact ? 'font-size:1rem' : 'font-size:1.16rem' }, row.status_text) : h('div');
    const url = await this.objectUrl(row.media_path);
    if (row.kind === 'photo') return h('img', { class: 'status-card__media', src: url, alt: 'Status photo', style: compact ? 'max-height:260px;object-fit:cover' : '' });
    if (row.kind === 'video') return h('video', { class: 'status-card__media', src: url, controls: true, playsinline: true, preload: 'metadata', style: compact ? 'max-height:260px' : 'max-height:62vh' });
    return h('audio', { src: url, controls: true, preload: 'metadata', style: 'width:100%;margin:12px 0' });
  },
  async openPeer(name, media) {
    if (!media?.peer_user_id || !Supabase.accessToken) return false;
    const all = await this.direct(true);
    const rows = all.filter(r => String(r.owner_user_id) === String(media.peer_user_id));
    if (!rows.length) return false;
    let pos = Math.max(0, rows.findIndex(r => !r.seen));
    if (pos < 0) pos = 0;
    const ov = h('div', { class: 'profile-sheet', onClick: e => { if (e.target === ov) ov.remove(); } });
    const title = h('h2', { class: 'profile-sheet__title', style: 'margin-bottom:2px' }, name);
    const meta = h('p', { class: 'hint', style: 'margin:0' }, '24-hour status');
    const stage = h('div', { style: 'margin-top:12px;min-height:120px' });
    const caption = h('div', { class: 'status-card__text', style: 'display:none;margin-top:10px' });
    const likeBtn = h('button', { type: 'button', class: 'btn btn--secondary', style: 'width:auto;min-width:120px' }, '♡ Like');
    const commentInput = h('input', { class: 'input', type: 'text', maxlength: '500', placeholder: 'Private comment to status owner', 'aria-label': 'Private status comment' });
    const commentBtn = Button('Send comment', { variant: 'secondary' });
    const threadBtn = Button('View comments', { variant: 'ghost' });
    const threadBox = h('div', { class:'bl-status-thread', hidden:true });
    const refreshThread = async () => {
      try {
        const list = await this.resolveNames(await this.comments(rows[pos].item_id), 'author_user_id');
        threadBtn.textContent = `Comments ${list.length}`;
        threadBox.replaceChildren(...(list.length ? list.map(c => h('div',{class:'bl-status-comment-row'},
          h('div',{class:'bl-status-comment-head'},h('strong',null,c._resolved_name),h('button',{type:'button',class:'btn btn--ghost bl-status-comment-reply',onClick:()=>{commentInput.value=`Reply to ${c._resolved_name}: `;commentInput.focus();}},'Reply')),
          h('div',{class:'hint',style:'margin:2px 0 0'},this.timeLabel(c.created_at)),
          h('div',{style:'margin-top:5px;line-height:1.4'},c.body)
        )) : [h('p',{class:'hint',style:'padding:10px 0'},'No comments yet.') ]));
      } catch (_) { threadBox.replaceChildren(h('p',{class:'hint',style:'padding:10px 0'},'Comments could not be loaded.')); }
    };
    const prev = h('button', { type: 'button', class: 'btn btn--ghost', style: 'width:auto;min-width:70px' }, '‹ Prev');
    const next = h('button', { type: 'button', class: 'btn btn--ghost', style: 'width:auto;min-width:70px' }, 'Next ›');
    const count = h('strong', null, '');
    const draw = async () => {
      const row = rows[pos]; count.textContent = `${pos + 1} / ${rows.length}`;
      meta.textContent = `${this.kindLabel(row.kind)} · ${this.timeLabel(row.created_at)}`;
      stage.replaceChildren(h('p', { class: 'hint' }, 'Loading status…'));
      try { stage.replaceChildren(await this.mediaNode(row)); } catch (_) { stage.replaceChildren(h('p', { class: 'hint' }, 'Media could not be loaded.')); }
      if (row.status_text && row.kind !== 'text') { caption.textContent = row.status_text; caption.style.display = 'block'; }
      else caption.style.display = 'none';
      likeBtn.textContent = `${row.liked_by_me ? '♥ Liked' : '♡ Like'}${Number(row.like_count || 0) ? ` · ${row.like_count}` : ''}`;
      prev.disabled = pos === 0; next.disabled = pos === rows.length - 1;
      try { await this.markSeen(row.item_id); row.seen = true; } catch (_) {}
      if (rows.every(x => x.seen)) document.querySelectorAll(`[data-peer-user-id="${CSS.escape(String(media.peer_user_id))}"]`).forEach(el => { el.classList.remove('avatar--status-ring'); el.classList.add('avatar--status-seen'); });
    };

/* =====================================================================
   7. VERIFICATION PROVIDERS
   VerificationProvider interface:
     { id, kind, authoritative:boolean, check(context) -> Promise<{ status, note?, attestation? }> }
   Production: check() calls the BharathLink server, which talks to UIDAI /
   KYC / NPCI partners under proper authorisation and returns a signed
   attestation. Only then may a result become "verified".
   ===================================================================== */
const Attestation = {
  // Phase 1A has no trusted server and no signing keys, so nothing is accepted.
  verify(/* attestation */) { return false; }
};

const DemoVerificationProvider = kind => ({
  id: `demo-${kind}`, kind, authoritative: false, isDevelopment: true,
  async check() { await Util.delay(700); return { status: VStatus.DEMO, note: 'Simulated for testing. No real check was made.' }; }
});

const Verification = {
  providers: new Map(['aadhaar', 'kyc', 'upi'].map(k => [k, DemoVerificationProvider(k)])),
  running: false,
  register(kind, provider) { this.providers.set(kind, provider); },
  record(kind, result, provider) {
    let status = result.status;
    // Guard: an unattested "verified" is never stored, whatever the caller claims.
    if (status === VStatus.VERIFIED && !(provider && provider.authoritative && Attestation.verify(result.attestation))) {
      console.warn(`[Verification] Rejected unattested "verified" result for ${kind}.`);
      status = provider && provider.isDevelopment ? VStatus.DEMO : VStatus.NOT_CHECKED;
    }
    Store.update(s => {
      s.verification[kind] = { status, source: provider ? provider.id : null, note: result.note || null,
        authoritative: status === VStatus.VERIFIED, updatedAt: Date.now() };
      // Phase 1A never writes verifiedIdentity. A future server adapter must create it only after authoritative verification.
    });
  },
  async runDemoChecks(onProgress) {
    if (this.running) return;
    this.running = true;
    try {
      for (const kind of ['aadhaar', 'kyc', 'upi']) {
        const p = this.providers.get(kind);
        Store.update(s => { s.verification[kind] = Object.assign(blankVerification(), { status: VStatus.PENDING }); });
        if (onProgress) onProgress();
        this.record(kind, await p.check({ accountId: Store.state.account.accountId }), p);
        if (onProgress) onProgress();
      }
    } finally { this.running = false; if (onProgress) onProgress(); }
  },
  clearDemo() { Store.update(s => { for (const k of ['aadhaar', 'kyc', 'upi']) s.verification[k] = blankVerification(); }); },
  summary(s) {
    const statuses = ['aadhaar', 'kyc'].map(k => s.verification[k].status);
    if (statuses.every(x => x === VStatus.VERIFIED)) return { status: VStatus.VERIFIED, label: 'Identity verified' };
    if (statuses.some(x => x === VStatus.DEMO)) return { status: VStatus.DEMO, label: 'Demo checks only' };
    return { status: VStatus.NOT_CHECKED, label: 'Not verified yet' };
  }
};

/* =====================================================================
   8. IDENTITY / PROFILE
   Display name is self-declared. Verified legal identity is a separate,
   future server-only record and is never inferred from this profile.
   ===================================================================== */
const Identity = {

  },

  trustSnapshot(s = Store.state) {

/* =====================================================================
   10. ID ALLOCATION
   Permanent identifiers are name-independent. Display-name edits never
   reissue them. Production allocation moves server-side with uniqueness.
   ===================================================================== */
const LocalIdAllocator = {
  id: 'local-provisional-v2', authoritative: false,
  async allocate({ accountId, taken }) {
    for (let attempt = 0; attempt < 64; attempt++) {
      const a = Util.toCode(Util.hash53(`${accountId}|msg|${attempt}`), 8).toUpperCase();
      const messagingId = `BL-${a.slice(0,4)}-${a.slice(4,8)}`;
      if (!taken.has(messagingId)) {
        const m = Util.toCode(Util.hash53(`${accountId}|mail|${attempt}`), 10).toLowerCase();
        return { handle: messagingId, messagingId, mailId: `${m}@${CONFIG.MAIL_DOMAIN}`,
          allocatedBy: this.id, provisional: true, allocatedAt: Date.now(), attempt };
      }
    }
    throw new Error('Could not allocate a unique ID');
  }
};

const IdService = {
  allocator: LocalIdAllocator, inflight: null,
  allocateFor(state) {
    if (!this.inflight) this.inflight = this.allocator.allocate({ accountId: state.account.accountId, taken: Directory.takenHandles() }).finally(() => { this.inflight = null; });
    return this.inflight;
  }
};

/* =====================================================================
   11. MESSAGING
   Sample-directory chats remain local demo UI. The separate backend E2EE test
   chat below is bound to the authenticated direct conversation and never falls
   back to plaintext transport.
   ===================================================================== */
const LocalMessagingTransport={id:'local-demo-only',async send(){return{delivery:'saved_on_device'};}};
const E2EE={provider:null,isActive(){return false;}};
const Messaging={
  list(){return Object.values(Store.state.messaging.conversations).sort((a,b)=>b.updatedAt-a.updatedAt);},

  openWith(contactId){const found=Object.values(Store.state.messaging.conversations).find(c=>c.contactId===contactId);if(found)return found.id;const id=Util.uuid();Store.update(s=>{s.messaging.conversations[id]={id,contactId,messages:[],updatedAt:Date.now()};});return id;},
  async send(convId,text){

    const now = Date.now();

    const text = String(raw || '').trim();
    if (!/^upi:\/\/pay\?/i.test(text)) throw new Error('This QR is not a UPI payment QR.');
    const q = text.slice(text.indexOf('?') + 1);
    const params = new URLSearchParams(q);
    const pa = String(params.get('pa') || '').trim();
    const vpa = Validate.vpa(pa);
    if (!vpa.ok) throw new Error('The QR does not contain a valid UPI ID.');
    const cu = String(params.get('cu') || 'INR').trim().toUpperCase();
    if (cu && cu !== 'INR') throw new Error('Only INR UPI payment QR codes are supported.');
    const out = {
      payeeVpa: vpa.value,
      payeeName: String(params.get('pn') || '').trim().slice(0, 60),
      amount: '',
      note: String(params.get('tn') || '').trim().slice(0, CONFIG.LIMITS.payNote)
    };
    const rawAmount = String(params.get('am') || '').trim();
    if (rawAmount) {
      const a = Validate.amount(rawAmount);
      if (a.ok) out.amount = a.value;
    }
    return out;
  },
  upiLink(req) {
    // A known VPA can use the standard UPI pay intent. Mobile-only mode must not
    // fabricate a VPA or launch a bare upi://pay URI because many UPI apps reject it.
    if (!req.payeeVpa) return '';
    const p = [['pa', req.payeeVpa]];
    if (req.payeeName) p.push(['pn', req.payeeName]);
    p.push(['am', req.amount], ['cu', 'INR']);
    if (req.note) p.push(['tn', req.note]);
    return 'upi://pay?' + p.map(([k, v]) => `${k}=${encodeURIComponent(v).replace(/%40/g, '@')}`).join('&');
  }

                this.pushUnique(out,{

                  title:'Urgent payment language detected',
                  reason:`A recent message from ${peerName} combines urgency with a request to send/pay money.`,
                  action:'Verify WHO is asking and WHERE the money will go before acting. Urgency is a risk signal, not proof of fraud.',
                  source:'Messaging · local content signal',
                  route:`/e2ee-chat/${cv.conversation_id}`,messageId:m.message_id
                });
              }else if(flags.includes('money_request')){
                this.pushUnique(out,{
                  kind:'money_request_language',severity:'info',
                  title:'Money request detected',
                  reason:`A recent message from ${peerName} appears to ask for money, even without using the ₹ symbol.`,
                  action:'Before paying, confirm WHO is asking and WHERE the money will terminate. Verified ≠ Safe.',
                  source:'Messaging · local content signal',
                  route:`/e2ee-chat/${cv.conversation_id}`,messageId:m.message_id
                });
              }
              if(flags.includes('risky_link_context')){
                this.pushUnique(out,{
                  kind:'risky_link_context',severity:'medium',
                  title:'Link appears in a sensitive request context',
                  reason:`A recent message from ${peerName} combines a web link with payment, credential or urgency language.`,
                  action:'Avoid opening the link until the sender and destination are independently verified.',
                  source:'Messaging · local content signal',
                  route:`/e2ee-chat/${cv.conversation_id}`,messageId:m.message_id
                });
              }
            }
          }
        }
      }catch(_){}

      /* BharathMail:
         Scan BOTH internal BharathMail and external internet email.
         Internal routing proves only that the message came through the
         BharathMail system; it does NOT automatically prove verified legal
         identity or authority for a sensitive request. */
      try{
        await Mail.refresh({force:false});
        const inbox=(Mail.list('inbox')||[]).slice(0,25);
        for(const m of inbox){
          const flags=this.sensitiveTextFlags(`${m.subject||''}\n${m.body||''}`);
          if(!flags.length)continue;

          const external=m.source==='external';
          const sender=String(m.from||'unknown sender');
          const channelLabel=external?'External email':'BharathMail';
          const identityNote=external
            ? 'The visible internet email address is not a BharathLink verified identity.'
            : 'A BharathMail address/routing path alone does not prove verified legal identity or authority for this exact request.';

          if(flags.includes('credential_request')){
            this.pushUnique(out,{
              kind:external?'mail_credential_request_external':'mail_credential_request_internal',
              severity:'high',
              title:external
                ? 'External email may be requesting a secret credential'
                : 'BharathMail message may be requesting a secret credential',
              reason:`${channelLabel} from ${sender} contains language associated with OTP/PIN/password sharing. ${identityNote}`,
              action:'Do not reply with OTPs, PINs, passwords or CVVs. Verify the sender and the request through an independently trusted channel.',
              source:'BharathMail · WHO / AUTHORITY',
              route:`/mail/${m.id}`
            });
            continue;
          }

          if(flags.includes('urgent_money')){
            this.pushUnique(out,{
              kind:external?'external_mail_urgent_payment':'internal_mail_urgent_payment',
              severity:'medium',
              title:external
                ? 'Urgent payment language in external email'
                : 'Urgent payment language in BharathMail',
              reason:`${channelLabel} from ${sender} combines urgency with a request to send/pay money. ${identityNote}`,
              action:'Verify WHO sent the request, WHERE the payment will terminate, and whether the sender has AUTHORITY for this exact request.',
              source:'BharathMail · WHO / WHERE / AUTHORITY',
              route:`/mail/${m.id}`
            });
          }else if(flags.includes('money_request')){
            this.pushUnique(out,{
              kind:external?'external_mail_money_request':'internal_mail_money_request',
              severity:'info',
              title:external?'Money request detected in external email':'Money request detected in BharathMail',
              reason:`${channelLabel} from ${sender} appears to ask for money, even without using the ₹ symbol. ${identityNote}`,
              action:'Before paying, confirm WHO sent the request and WHERE the money will terminate. Verified ≠ Safe.',
              source:'BharathMail · WHO / WHERE',
              route:`/mail/${m.id}`
            });
          }

          if(flags.includes('risky_link_context')){
            this.pushUnique(out,{
              kind:external?'external_mail_risky_link':'internal_mail_risky_link',
              severity:'medium',
              title:external
                ? 'Sensitive link context in external email'
                : 'Sensitive link context in BharathMail',
              reason:`${channelLabel} from ${sender} combines a web link with payment, credential or urgency language. ${identityNote}`,
              action:'Avoid using the link until the sender identity and requested destination are independently verified.',
              source:'BharathMail · WHO / WHERE',
              route:`/mail/${m.id}`
            });
          }
        }
      }catch(_){}
    }

    const rank={high:0,medium:1,info:2};
    out.sort((a,b)=>(rank[a.severity]??9)-(rank[b.severity]??9));
    return out.slice(0,16);
  }
};

/* =====================================================================
   13C. LIVE CALL RISK SIGNALS — V37 BETA
   The risk rules run locally on transient transcript text. BharathLink does
   not persist call audio/transcripts and does not upload them to Supabase.
   Compatible desktop Chromium can feed the remote MediaStreamTrack directly
   to Web Speech. Android/iOS web builds deliberately do NOT fall back to the
   local microphone, because that would analyse the wrong side of the call and
   can interfere with WebRTC microphone capture. A future native Android layer
   may supply transient transcript chunks through `bl-native-call-transcript`.
   ===================================================================== */
const LiveCallRisk = {
  create({onState,onSignal}={}){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
    const ua=String(navigator.userAgent||'');
    const mobileWeb=/Android|iPhone|iPad|iPod/i.test(ua);
    let enabled=false,closed=false,track=null,recognition=null,retryTimer=null,buffer='',lastKey='',lastAt=0;
    const emitState=(mode,text)=>{try{onState?.({mode,text});}catch(_){}};
    const stopRecognition=()=>{
      clearTimeout(retryTimer);retryTimer=null;
      const r=recognition;recognition=null;
      if(r){try{r.onend=r.onerror=r.onresult=null;r.stop();}catch(_){try{r.abort();}catch(__){}}}
    };
    const ingest=text=>{
      if(!enabled||closed)return;
      const chunk=String(text||'').replace(/\s+/g,' ').trim();
      if(!chunk)return;
      buffer=(buffer+' '+chunk).slice(-1400);
      const signal=TrustEngine.callSpeechRisk(buffer);
      if(!signal)return;
      const key=`${signal.severity}|${signal.title}|${signal.reason}`;
      const now=Date.now();
      if(key===lastKey&&now-lastAt<8000)return;
      lastKey=key;lastAt=now;
      try{onSignal?.(signal);}catch(_){}
    };
    const startBrowser=()=>{
      if(!enabled||closed)return;
      if(!track||track.kind!=='audio'||track.readyState!=='live'){
        emitState('waiting','Live Risk armed · waiting for caller audio…');
        return;
      }
      if(mobileWeb){
        emitState('unsupported','Live caller-audio transcription is not supported safely in this Android/iPhone web build. Native Android support is required.');
        return;
      }
      if(!SR){
        emitState('unsupported','This browser does not provide compatible speech recognition for Live Call Risk Signals.');
        return;
      }
      stopRecognition();
      try{
        const r=new SR();recognition=r;
        r.continuous=true;r.interimResults=true;r.maxAlternatives=1;r.lang='en-IN';
        r.onresult=e=>{
          let text='';
          for(let i=e.resultIndex||0;i<e.results.length;i++)text+=' '+String(e.results[i]?.[0]?.transcript||'');
          ingest(text);
        };
        r.onerror=e=>{
          if(!enabled||closed)return;
          const code=String(e?.error||'');
          if(['not-allowed','service-not-allowed','audio-capture'].includes(code)){
            enabled=false;emitState('error','Live Risk could not access the browser speech-recognition service. The call itself is unchanged.');
          }
        };
        r.onend=()=>{
          recognition=null;
          if(enabled&&!closed&&track?.readyState==='live')retryTimer=setTimeout(startBrowser,550);
        };
        r.start(track);
        emitState('listening','Live Risk ON · caller speech is checked for risk patterns. Transcript is not saved by BharathLink. Your browser may provide the speech-recognition service.');
      }catch(_){
        recognition=null;
        emitState('unsupported','This browser cannot transcribe the remote caller audio track. The call continues normally.');
      }
    };
    const nativeTranscript=e=>{if(enabled)ingest(e?.detail?.text||e?.detail?.transcript||'');};
    window.addEventListener('bl-native-call-transcript',nativeTranscript);
    return {
      attachTrack(t){track=t?.kind==='audio'?t:null;if(enabled)startBrowser();},
      enable(){if(closed)return false;enabled=true;buffer='';lastKey='';lastAt=0;emitState('waiting',track?'Starting Live Risk…':'Live Risk armed · waiting for caller audio…');startBrowser();return true;},
      disable(){enabled=false;stopRecognition();buffer='';emitState('off','Live Call Risk Signals are off.');},
      isEnabled(){return enabled;},
      ingest,
      close(){closed=true;enabled=false;stopRecognition();buffer='';track=null;window.removeEventListener('bl-native-call-transcript',nativeTranscript);}
    };
  }
};

const SAFE_HREF = /^(#|tel:|upi:|mailto:)/i;

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) { if (typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v); }
      else if (k === 'href') { if (SAFE_HREF.test(v)) el.setAttribute('href', v); }
      else if (k === 'value') el.value = v;
      else if (typeof v === 'boolean') el[k] = v;
      else el.setAttribute(k, String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function svgEl(tag, attrs, children = []) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  children.forEach(c => el.appendChild(c));
  return el;
}

    badge.textContent=String(signal.severity||'signal').toUpperCase();

    body.textContent=signal.reason||'A call risk pattern was detected.';
    foot.textContent=`${signal.action||'Verify independently before acting.'} · Risk signal · not a verdict`;
    if(button){button.classList.add('is-alert');button.textContent='Risk Signal';}

  };
  const monitor=LiveCallRisk.create({onState:paintState,onSignal:paintSignal});
  button=h('button',{type:'button',class:'bl-live-risk-btn',onClick:()=>{
    if(monitor.isEnabled()){

      body.textContent='Tap Live Risk to check caller speech for authority, investigation, payment and credential-risk patterns.';

      button.classList.remove('is-alert');

  }},'Live Risk');

}

  const merged = { ...(media || {}) };

  if (!peerUserId || !Supabase.accessToken) return merged;
  try {

}

/* Screen shell: top bar with back navigation, main content, optional nav/footer. */
function Screen({ title, back, actions = [], nav = null, children, header, footer }) {

const Toast = {
  el: null, timer: null,
  show(msg) {
    this.el.textContent = msg; this.el.classList.add('is-visible');
    clearTimeout(this.timer); this.timer = setTimeout(() => this.el.classList.remove('is-visible'), 3000);
  }
};

/* Timers that must stop when the screen changes. */
const Lifecycle = { cleanups: [], add(fn) { this.cleanups.push(fn); }, run() { this.cleanups.splice(0).forEach(fn => fn()); } };
