<style>
/* =====================================================================
   DESIGN TOKENS
   Ink indigo = infrastructure / trust.  Marigold = the "link" thread.
   Status colours are reserved for verification state and never reused
   decoratively, so a colour always means the same thing.
   ===================================================================== */
:root{
  --ink:#14205A; --ink-2:#23338F; --ink-soft:#E6E9F5;
  --marigold:#E4A13A; --marigold-soft:#FCF0DA;
  --paper:#F3F5FA; --surface:#FFFFFF;
  --text:#18203A; --muted:#545E77; --line:#DCE1EC; --line-strong:#B9C1D3;
  --ok:#0E6B47; --ok-bg:#E1F3EA;
  --warn:#7A5200; --warn-bg:#FFF1CF;
  --demo:#4E3A9C; --demo-bg:#EEEAFB; --demo-stripe:#E0D8F7;
  --none:#4F5668; --none-bg:#ECEEF3;
  --danger:#B42318; --danger-bg:#FDECEA;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Bengali",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:16px/1.5 var(--font);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
a{color:var(--ink-2)}
button{font:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative}
@media (min-width:520px){body{background:#DFE4EF}#app{box-shadow:0 0 0 1px var(--line)}}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{padding-bottom:0}
@supports(padding:max(0px)){.content{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;min-height:60px;padding:calc(var(--safe-t) + 6px) 8px 6px;background:var(--ink);color:#fff}
.topbar h1{flex:1;min-width:0;font-size:1.125rem;font-weight:650;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.topbar h1:focus{outline:none}
.topbar__spacer{width:8px}
.topbar--home{gap:10px;padding-left:16px;padding-right:12px}
.wordmark{font-weight:750;font-size:1.125rem;letter-spacing:.01em;flex:1;min-width:0}
.pill{font-size:.75rem;font-weight:650;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.iconbtn{flex:none;width:48px;height:48px;display:inline-grid;place-items:center;border:0;background:transparent;color:inherit;border-radius:12px;cursor:pointer;text-decoration:none}
.iconbtn:active{background:rgba(255,255,255,.12)}

/* ---------- Content ---------- */
.content{flex:1;padding:20px 16px calc(100px + var(--safe-b))}
.content--nonav{padding-bottom:calc(32px + var(--safe-b))}
.lede{color:var(--muted);font-size:1rem;line-height:1.55;margin-bottom:20px;max-width:60ch}
.section{margin-top:28px}
.section-title{font-size:1.0625rem;font-weight:700;margin-bottom:12px;color:var(--text)}
.stack{display:grid;gap:12px}
.footnote{margin-top:28px;font-size:.8125rem;color:var(--muted);text-align:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid transparent;font-weight:650;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center;line-height:1.2}
.btn--primary{background:var(--ink);color:#fff}
.btn--primary:active{background:var(--ink-2)}
.btn--secondary{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn--marigold{background:var(--marigold);color:var(--ink)}
.btn--ghost{background:transparent;color:var(--ink-2);min-height:48px}
.btn--danger{background:var(--surface);color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Forms ---------- */
.field{display:grid;gap:6px;margin-bottom:18px}
.field>label,.fieldset legend{font-weight:650;font-size:.9375rem}
.input{width:100%;min-height:52px;padding:12px 14px;font:inherit;font-size:1.0625rem;color:var(--text);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;appearance:none}
.input:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(35,51,143,.22)}
.input[aria-invalid="true"]{border-color:var(--danger)}
textarea.input{min-height:120px;resize:vertical;line-height:1.45}
.input[readonly]{background:var(--ink-soft);color:var(--muted)}
.prefix{display:flex;align-items:stretch}
.prefix__cc{display:grid;place-items:center;padding:0 14px;border:1.5px solid var(--line-strong);border-right:0;border-radius:12px 0 0 12px;background:var(--ink-soft);font-weight:650}
.prefix .input{border-radius:0 12px 12px 0;min-width:0}
.input--otp{font-size:1.625rem;letter-spacing:.45em;text-align:center;font-variant-numeric:tabular-nums;padding-left:.45em}
.hint{font-size:.875rem;color:var(--muted)}
.error{color:var(--danger);font-size:.9375rem;font-weight:550}
.error:empty{display:none}
.fieldset{border:0;padding:0;margin:0 0 18px}
.fieldset legend{margin-bottom:8px;padding:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600}
.choice input{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:none}
.choice:has(input:checked){border-color:var(--ink);background:var(--ink-soft)}

/* ---------- Notices ---------- */
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:.9375rem;line-height:1.45;margin-bottom:16px;border:1px solid transparent}
.notice .icon{flex:none;margin-top:1px}
.notice--info{background:var(--ink-soft);color:var(--ink)}
.notice--warn{background:var(--warn-bg);color:var(--warn);border-color:#EED9A3}
.notice--dev{background:repeating-linear-gradient(135deg,var(--demo-bg) 0 10px,var(--demo-stripe) 10px 20px);color:var(--demo);border-color:#CFC4F2}
.devcode{font-size:1.125rem;letter-spacing:.12em;font-variant-numeric:tabular-nums}

/* ---------- Status badges (the verification vocabulary) ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:.8125rem;font-weight:650;line-height:1.35;white-space:nowrap;vertical-align:middle}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.badge--none{color:var(--none);background:var(--none-bg)}
.badge--none::before{background:transparent;border:1.5px solid currentColor}
.badge--pending{color:var(--warn);background:var(--warn-bg)}
.badge--demo{color:var(--demo);background:repeating-linear-gradient(135deg,var(--demo-bg) 0 5px,var(--demo-stripe) 5px 10px)}
.badge--verified{color:var(--ok);background:var(--ok-bg)}
.badge--failed{color:var(--danger);background:var(--danger-bg)}

/* ---------- Trust thread (signature element) ---------- */
.thread{list-style:none;margin:0;padding:0}
.thread__step{position:relative;padding:0 0 20px 40px}
.thread__step::before{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--line-strong)}
.thread__step:last-child{padding-bottom:0}
.thread__step:last-child::before{display:none}
.thread__node{position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--none);background:var(--surface)}
.thread__node--demo{border-color:var(--demo);background:repeating-linear-gradient(135deg,var(--demo-bg) 0 3px,var(--demo-stripe) 3px 6px)}
.thread__node--pending{border-color:var(--warn);background:var(--warn-bg);animation:pulse 1.2s ease-in-out infinite}
.thread__node--verified{border-color:var(--ok);background:var(--ok)}
.thread__node--failed{border-color:var(--danger);background:var(--danger-bg)}
.thread__head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.thread__title{font-weight:650}
.thread__detail{font-size:.875rem;color:var(--muted);margin-top:2px}
.thread__note{font-size:.8125rem;color:var(--demo);margin-top:4px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(122,82,0,.12)}}

/* ---------- Trust card ---------- */
.trustcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.trustcard__head{position:relative;display:flex;align-items:center;gap:14px;padding:20px 18px 22px;background:var(--ink);color:#fff}
.trustcard__head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--marigold) 0 38%,transparent 38% 41%,#fff 41% 60%,transparent 60% 63%,var(--marigold) 63%)}
.trustcard__who{min-width:0}
.trustcard__label{font-size:.8125rem;opacity:.8}
.trustcard__name{font-size:1.375rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.trustcard__source{font-size:.8125rem;opacity:.85;margin-top:4px}
.kv{margin:0;padding:4px 18px 8px}
.kv__row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv__row:last-child{border-bottom:0}
.kv dt{color:var(--muted);font-size:.9375rem;flex:none;max-width:45%}
.kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kv dd .hint{font-weight:400}
.trustcard__foot{padding:12px 18px 16px;font-size:.8125rem;color:var(--muted);border-top:1px solid var(--line);background:#FAFBFD}

/* ---------- Avatars & rows ---------- */
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9375rem;color:var(--ink);background:var(--ink-soft)}
.avatar--c1{background:#FCEBD2;color:#6B4200}.avatar--c2{background:#DDF1EE;color:#0B5A51}.avatar--c3{background:#E9E4FA;color:#43308A}.avatar--c4{background:#FBE3E6;color:#8A1C2C}
.avatar--lg{width:64px;height:64px;font-size:1.375rem}
.avatar--on-ink{background:rgba(255,255,255,.14);color:#fff;border:2px solid var(--marigold)}
.list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;background:var(--surface);color:var(--text);text-decoration:none;border:0;text-align:left;cursor:pointer}
.row:active{background:var(--ink-soft)}
.row__body{flex:1;min-width:0;display:grid;gap:2px}
.row__title{font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.row__sub{font-size:.875rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__trail{flex:none;max-width:45%;font-size:.8125rem;color:var(--muted);text-align:right}
.row__trail .badge{white-space:normal;text-align:left}
.empty{padding:28px 18px;text-align:center;background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:16px;color:var(--muted)}
.empty p{margin-bottom:14px}

/* ---------- Welcome ---------- */
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 36px) 24px calc(28px + var(--safe-b));background:var(--ink);color:#fff}
.welcome__brand{display:flex;align-items:center;gap:12px}
.welcome__brand .wordmark{font-size:1.5rem;flex:none}
.welcome__title{margin-top:44px;font-size:clamp(1.75rem,7.2vw,2.25rem);line-height:1.15;font-weight:750;letter-spacing:-.01em;max-width:16ch}
.welcome__title:focus{outline:none}
.welcome__lede{margin-top:18px;color:#C9D0EA;max-width:40ch}
.welcome__actions{margin-top:auto;padding-top:32px}
.welcome__note{margin-top:14px;font-size:.8125rem;color:#AEB6D6;text-align:center}
.eco{margin-top:36px;display:flex;flex-direction:column;align-items:center}
.eco__core{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid var(--marigold);font-weight:650;position:relative}
.eco__core::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:18px;background:var(--marigold)}
.eco__spokes{list-style:none;margin:18px 0 0;padding:16px 0 0;width:100%;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.eco__spokes::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:2px;background:var(--marigold)}
.eco__spokes li{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8125rem;color:#DDE2F4}
.eco__spokes li::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--marigold)}
.eco__spokes .icon{width:40px;height:40px;padding:9px;border-radius:12px;background:rgba(255,255,255,.1)}

/* ---------- Home ---------- */
.hero{background:var(--ink);color:#fff;padding:6px 16px 26px;margin:-20px -16px 20px}
.hero h1{font-size:1.625rem;font-weight:750;line-height:1.2}
.hero h1:focus{outline:none}
.hero__strip{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none}
.hero__who{flex:1;min-width:0;display:grid}
.hero__name{font-weight:650;overflow-wrap:anywhere}
.hero__mobile{font-size:.875rem;color:#C9D0EA;white-space:nowrap}
.hero__who .badge{justify-self:start;margin-top:6px}
.services{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;min-height:140px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none}
.tile:active{border-color:var(--ink-2)}
.tile__icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile__title{font-weight:700;line-height:1.25}
.tile__desc{font-size:.875rem;color:var(--muted);line-height:1.4}
.tile--identity{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;border:1.5px solid var(--ink)}
.tile__text{flex:1;min-width:0;display:grid;gap:4px}
.tile--calls .tile__icon{background:#DDF1EE;color:#0B5A51}
.tile--chats .tile__icon{background:var(--ink-soft);color:var(--ink)}
.tile--mail .tile__icon{background:var(--marigold-soft);color:#6B4200}
.tile--pay .tile__icon{background:#E4F3E8;color:#155C2E}
.tile--identity .tile__icon{background:var(--ink);color:var(--marigold)}

/* ---------- Bottom nav ---------- */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:6;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.bottomnav a{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.75rem;font-weight:550;color:var(--muted);text-decoration:none;position:relative}
.bottomnav a[aria-current="page"]{color:var(--ink);font-weight:700}
.bottomnav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--marigold)}

/* ---------- Identity blocks / caller ---------- */
.idblock{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.idblock__label{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted);font-weight:600}
.idblock__value{display:flex;align-items:center;gap:8px;margin-top:6px}
.idblock__text{flex:1;min-width:0;font-size:1.1875rem;font-weight:700;color:var(--ink);overflow-wrap:break-word;user-select:all;-webkit-user-select:all}
.idblock .iconbtn{color:var(--ink-2)}
.caller{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 16px;border-radius:20px;background:var(--ink);color:#fff}
.caller__name{font-size:1.375rem;font-weight:700;overflow-wrap:anywhere}
.caller__sub{color:#C9D0EA;font-size:.9375rem;overflow-wrap:anywhere}
.result{margin-top:14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;gap:10px;justify-items:start}
.result__title{font-weight:700}

/* ---------- Chat ---------- */
.chat-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px;font-size:.875rem;color:var(--muted);overflow-wrap:anywhere}
.messages{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.bubble{align-self:flex-end;max-width:82%;padding:10px 12px 6px;border-radius:16px 16px 4px 16px;background:var(--ink);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble--incoming{align-self:flex-start;border-radius:16px 16px 16px 4px;background:var(--surface);color:var(--text);border:1px solid var(--line)}
.bubble--incoming .bubble__meta{color:var(--muted);text-align:left}
.bubble__meta{display:block;text-align:right;font-size:.75rem;color:#C9D0EA;margin-top:2px}
.composer{position:sticky;bottom:0;z-index:4;display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + var(--safe-b));background:var(--paper);border-top:1px solid var(--line)}
.composer .input{min-height:48px;max-height:140px;resize:none;border-radius:24px;padding:12px 16px;line-height:1.35}
.sendbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer}

/* ---------- Mail ---------- */
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--ink-soft);margin-bottom:14px}
.segmented button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.segmented button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(20,32,90,.18)}
.mailview__subject{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere;margin-bottom:10px}
.mailview__body{margin-top:16px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- Pay ---------- */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:step}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.steps li::before{counter-increment:step;content:counter(step);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink-soft);color:var(--ink);font-weight:700;font-size:.875rem}
.steps__body{flex:1;min-width:0;display:grid;gap:4px;justify-items:start}
.steps__title{font-weight:650}
.amount{font-size:2.25rem;font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.paycard{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.paycard .kv{padding:4px 0 0}
.kv.paycard{padding:4px 18px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,16px);max-width:calc(100% - 32px);width:max-content;padding:12px 16px;border-radius:12px;background:var(--text);color:#fff;font-size:.9375rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.is-visible{opacity:1;transform:translate(-50%,0)}

<script>
(function () {
'use strict';

/* =====================================================================
   1. CONFIG
   No secrets or API keys live here. Anything secret belongs server-side.
   ===================================================================== */
const CONFIG = Object.freeze({
  APP_NAME: 'BharathLink',
  VERSION: '1B.6.0-E2EE',
  SUPABASE_URL: 'https://whpafxijzruynmivudbz.supabase.co',
  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_N93Mn2uaq6F1KbM26lRiOg_54oKKsNX',
  STORAGE_KEY: 'bharathlink.phase1a.v2.state',
  SCHEMA_VERSION: 2,
  // RFC 2606 reserved TLD: can never route real mail. Replace when a real
  // domain and mail backend exist.
  MAIL_DOMAIN: 'bharatmail.test',
  OTP_LENGTH: 6,
  OTP_TTL_MS: 5 * 60 * 1000,
  OTP_MAX_ATTEMPTS: 5,
  OTP_RESEND_MS: 30 * 1000,
  LIMITS: Object.freeze({ messagesPerChat: 500, mailItems: 200, payments: 100,
    chatText: 2000, mailSubject: 150, mailBody: 5000, payNote: 50 })
});

/* =====================================================================
   2. UTILITIES (pure helpers, no app state)
   ===================================================================== */
const Util = {
  bytes(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; },
  hex(bytes) { return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(''); },
  // RFC 4122 v4 UUID via getRandomValues. Works outside secure contexts
  // (unlike crypto.randomUUID), so testing on a phone over LAN http works.
  uuid() {
    const b = Util.bytes(16); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = Util.hex(b);
    return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
  },
  // Unbiased random digits (rejection sampling).
  randomDigits(n) {
    let out = '';
    while (out.length < n) for (const b of Util.bytes(n)) if (b < 250 && out.length < n) out += String(b % 10);
    return out;
  },
  // cyrb53: fast NON-cryptographic hash. Used only to derive deterministic
  // provisional ID suffixes. Uniqueness is enforced by an explicit collision
  // check, never by the hash alone.
  hash53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  },
  // Human-safe alphabet: no 0/o or 1/l/i ambiguity.
  toCode(num, len) {
    const A = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '', n = num;
    for (let i = 0; i < len; i++) { s += A[n % A.length]; n = Math.floor(n / A.length); }
    return s;
  },
  constantTimeEqual(a, b) {
    if (a.length !== b.length) return false;
    let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return r === 0;
  },
  formatMobile(m) { return m ? `+91 ${m.slice(0,5)} ${m.slice(5)}` : ''; },
  maskMobile(m) { return m ? `+91 ${m.slice(0,2)}••• ••${m.slice(7)}` : ''; },
  initials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    const first = parts[0] ? Array.from(parts[0])[0] : '?';
    const last = parts.length > 1 ? Array.from(parts[parts.length - 1])[0] : '';
    return (first + last).toUpperCase();
  },
  firstName(name) { return String(name || '').trim().split(/\s+/)[0] || ''; },
  time(ts) { try { return new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit' }).format(ts); } catch (e) { return ''; } },
  dateTime(ts) { try { return new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).format(ts); } catch (e) { return ''; } },
  rupees(v) { return '₹' + Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
  delay(ms) { return new Promise(r => setTimeout(r, ms)); }
};

/* =====================================================================
   3. VALIDATION (client-side input rules; the server must re-validate)
   ===================================================================== */
const Validate = {
  mobile(raw) {
    let d = String(raw || '').replace(/[\s()-]/g, '');
    if (/^\+91\d{10}$/.test(d)) d = d.slice(3);
    else if (/^91\d{10}$/.test(d)) d = d.slice(2);
    else if (/^0\d{10}$/.test(d)) d = d.slice(1);
    return /^[6-9]\d{9}$/.test(d) ? { ok: true, value: d }
      : { ok: false, error: 'Enter a 10-digit Indian mobile number that starts with 6, 7, 8 or 9.' };
  },
  otp(raw) {
    const v = String(raw || '').replace(/\s/g, '');
    return new RegExp(`^\\d{${CONFIG.OTP_LENGTH}}$`).test(v) ? { ok: true, value: v }
      : { ok: false, error: `Enter the ${CONFIG.OTP_LENGTH}-digit code.` };
  },
  displayName(raw) {
    const v = String(raw || '').normalize('NFC').replace(/\s+/g, ' ').trim();
    if (v.length < 2) return { ok: false, error: 'Enter your display name.' };
    if (v.length > 60) return { ok: false, error: 'Keep the display name under 60 characters.' };
    if (!/^[\p{L}\p{M}][\p{L}\p{M} .'-]*$/u.test(v)) return { ok: false, error: 'Use letters, spaces, dots, apostrophes and hyphens only.' };
    return { ok: true, value: v };
  },
  vpa(raw) {
    const v = String(raw || '').trim();
    return /^[a-zA-Z0-9][a-zA-Z0-9._-]{1,255}@[a-zA-Z][a-zA-Z0-9]{1,63}$/.test(v) ? { ok: true, value: v }
      : { ok: false, error: 'Enter a UPI ID like name@bank.' };
  },
  amount(raw) {
    const v = String(raw || '').trim();
    if (!/^\d{1,6}(\.\d{1,2})?$/.test(v)) return { ok: false, error: 'Enter an amount in rupees, with up to 2 decimal places.' };
    const n = Number(v);
    if (n < 1 || n > 100000) return { ok: false, error: 'Enter an amount between ₹1 and ₹1,00,000.' };
    return { ok: true, value: n.toFixed(2) };
  },
  email(raw) {
    const v = String(raw || '').trim();
    return v.length <= 254 && /^[^\s@<>()"',;:\\]{1,64}@[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$/.test(v)
      ? { ok: true, value: v.toLowerCase() } : { ok: false, error: 'Enter an address like name@example.com.' };
  },
  text(raw, max, label, { required = true } = {}) {
    const v = String(raw || '').replace(/\r\n/g, '\n').trim();
    if (!v) return required ? { ok: false, error: `Write a ${label} first.` } : { ok: true, value: '' };
    if (v.length > max) return { ok: false, error: `Keep the ${label} under ${max} characters.` };
    return { ok: true, value: v };
  }
};

/* =====================================================================
   4. VERIFICATION VOCABULARY
   "verified" can only come from an authoritative provider whose result
   carries a server attestation that Attestation.verify() accepts.
   In Phase 1A nothing can reach that state.
   ===================================================================== */
const VStatus = Object.freeze({ NOT_CHECKED: 'not_checked', PENDING: 'pending', DEMO: 'demo', VERIFIED: 'verified', FAILED: 'failed' });
const VStatusMeta = Object.freeze({
  not_checked: { label: 'Not checked', tone: 'none' },
  pending:     { label: 'Checking…',   tone: 'pending' },
  demo:        { label: 'Demo / Test',  tone: 'demo' },
  verified:    { label: 'Verified',     tone: 'verified' },
  failed:      { label: 'Could not verify', tone: 'failed' }
});
const TRUST_STEPS = Object.freeze([
  { key: 'mobile',  title: 'Mobile number ownership', detail: 'Confirms you control this number.' },
  { key: 'aadhaar', title: 'Aadhaar-linked identity', detail: 'Confirms your legal name through an authorised provider. BharathLink will not store your Aadhaar number.' },
  { key: 'kyc',     title: 'KYC', detail: 'Know-your-customer check by a regulated partner.' },
  { key: 'upi',     title: 'UPI payment identity', detail: 'Checks that an active UPI identity matches you, where applicable.' }
]);
const blankVerification = () => ({ status: VStatus.NOT_CHECKED, source: null, note: null, authoritative: false, updatedAt: null });

/* =====================================================================
   5. STORAGE + STORE
   State slices: account / identity / verification / ids / onboarding /
   messaging / mail / payments. Persisted to localStorage on this device.
   OTP sessions are never persisted.
   ===================================================================== */
const Storage = {
  load() {
    try {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
      if (!raw) return null;
      const o = JSON.parse(raw);
      return o && o.schema === CONFIG.SCHEMA_VERSION ? o : null;
    } catch (e) { return null; }
  },
  save(state) { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); return true; } catch (e) { return false; } },
  clear() { try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* ignore */ } }
};

function defaultState() {
  return {
    schema: CONFIG.SCHEMA_VERSION,
    createdAt: Date.now(),
    account: null,     // { accountId, mobile, createdAt, authProvider, authAuthoritative }
    profile: null,     // { displayName, displayNameSource, ageStatus, ageSource, createdAt, updatedAt }
    verifiedIdentity: null, // future server-only authoritative identity; null in Phase 1A
    verification: { mobile: blankVerification(), aadhaar: blankVerification(), kyc: blankVerification(), upi: blankVerification() },
    ids: null,         // { handle, messagingId, mailId, allocatedBy, provisional, allocatedAt }
    onboarding: { complete: false },
    messaging: { conversations: {} },
    mail: { messages: [], seeded: false },
    payments: { requests: [] }
  };
}

const Store = {
  state: null,
  persistOk: true,
  init() {
    const loaded = Storage.load();
    this.state = loaded ? Object.assign(defaultState(), loaded) : defaultState();
    // A check cannot still be running after a reload, so "pending" resets.
    for (const k of Object.keys(this.state.verification)) {
      if (this.state.verification[k].status === VStatus.PENDING) this.state.verification[k] = blankVerification();
    }
    this.persist();
  },
  update(mutator) { mutator(this.state); this.persist(); },
  persist() { this.persistOk = Storage.save(this.state); },
  reset() { Storage.clear(); this.state = defaultState(); this.persist(); }
};

/* =====================================================================
   5B. SUPABASE PHASE 1B FOUNDATION
   Publishable key is intentionally safe for browser use. RLS remains the
   authority: this client never uses a secret/service-role key.
   Phase 1A's local OTP is retained until real phone auth is enabled in
   Supabase. Profile reads/writes require a real Supabase access token.
   ===================================================================== */
const Supabase = {
  accessToken: null,
  refreshToken: null,
  setAccessToken(token) { this.accessToken = token || null; this._authUserCache=null; this._authUserPromise=null; },
  async refreshAccessToken() {
    if (!this.refreshToken) throw new Error('Test session expired. Sign in again.');
    const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': CONFIG.SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: this.refreshToken })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || data.message || 'Test session expired. Sign in again.');
    this.accessToken = data.access_token;
    if (data.refresh_token) this.refreshToken = data.refresh_token;
    sessionStorage.setItem('bharathlink.phase1b.test_access_token', this.accessToken);
    sessionStorage.setItem('bharathlink.phase1b.test_refresh_token', this.refreshToken);
    return this.accessToken;
  },
  headers(extra = {}) {
    return Object.assign({
      'apikey': CONFIG.SUPABASE_PUBLISHABLE_KEY,
      'Content-Type': 'application/json'
    }, this.accessToken ? { 'Authorization': `Bearer ${this.accessToken}` } : {}, extra);
  },
  async request(path, options = {}, allowRefresh = true) {
    let res = await fetch(`${CONFIG.SUPABASE_URL}${path}`, Object.assign({}, options, {
      headers: this.headers(options.headers || {})
    }));
    if (res.status === 401 && allowRefresh && this.refreshToken) {
      await this.refreshAccessToken();
      res = await fetch(`${CONFIG.SUPABASE_URL}${path}`, Object.assign({}, options, {
        headers: this.headers(options.headers || {})
      }));
    }
    if (!res.ok) {
      let detail = '';
      try { const e = await res.json(); detail = e.message || e.msg || e.error_description || ''; } catch (_) {}
      throw new Error(detail || `Supabase request failed (${res.status})`);
    }
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  },
  async health() {
    const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/`, {
      headers: { 'apikey': CONFIG.SUPABASE_PUBLISHABLE_KEY }
    });
    return res.ok;
  },
  async myProfile() {
    if (!this.accessToken) throw new Error('Real Supabase sign-in is required before profile sync.');
    const rows = await this.request('/rest/v1/profiles?select=user_id,account_id,messaging_id,bharatmail_address,bharatmail_id,display_name,age_status,mobile,mobile_verified,aadhaar_verified,kyc_verified,verified_legal_name,legal_name,legal_name_verified,upi_verified&limit=1');
    return Array.isArray(rows) ? (rows[0] || null) : null;
  },
  applyProfileToStore(p) {
    if (!p) return false;
    const s = Store.state;
    if (!s.account) s.account = { accountId: p.account_id || null, mobile: '', createdAt: Date.now() };
    if (!s.profile) s.profile = { displayName: p.display_name || 'Test user', displayNameSource: 'self_declared', ageStatus: 'unknown', ageSource: 'self_declared', createdAt: Date.now(), updatedAt: Date.now() };
    if (p.account_id) { s.account.id = p.account_id; s.account.accountId = p.account_id; }
    if (p.display_name) s.profile.displayName = p.display_name;
    if (p.age_status) s.profile.ageStatus = p.age_status;
    if (p.mobile) {
      const digits = String(p.mobile).replace(/\D/g, '');
      s.account.mobile = digits.length === 12 && digits.startsWith('91') ? digits.slice(2) : digits.slice(-10);
    }
    if (p.messaging_id || p.bharatmail_address || p.bharatmail_id) {
      s.ids = s.ids || {};
      if (p.messaging_id) s.ids.messagingId = p.messaging_id;
      if (p.bharatmail_address || p.bharatmail_id) s.ids.mailId = p.bharatmail_address || p.bharatmail_id;
    }
    const setTrust = (key, yes, source) => {
      s.verification[key] = yes
        ? { status: VStatus.VERIFIED, source, note: 'Server-controlled verification status.', authoritative: true, updatedAt: Date.now() }
        : blankVerification();
    };
    setTrust('mobile', !!p.mobile_verified, 'BharathLink backend');
    setTrust('aadhaar', !!p.aadhaar_verified, 'BharathLink backend');
    setTrust('kyc', !!p.kyc_verified, 'BharathLink backend');
    setTrust('upi', !!p.upi_verified, 'BharathLink backend');
    const legalName = p.verified_legal_name || p.legal_name;
    s.verifiedIdentity = (p.legal_name_verified && legalName)
      ? { legalName, verificationId: `server:${p.account_id}`, source: 'BharathLink backend' }
      : null;
    Store.persist();
    return true;
  },
  async syncMyProfile() {
    const p = await this.myProfile();
    if (p) this.applyProfileToStore(p);
    return p;
  },
  async currentAuthUser(allowRefresh = true) {
    if (!this.accessToken) throw new Error('Real Supabase sign-in is required.');
    const now=Date.now();
    if(this._authUserCache && now-this._authUserCache.at<30000)return this._authUserCache.user;
    if(this._authUserPromise)return this._authUserPromise;
    this._authUserPromise=(async()=>{
      const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/user`, {
        headers: {
          'apikey': CONFIG.SUPABASE_PUBLISHABLE_KEY,
          'Authorization': `Bearer ${this.accessToken}`
        }
      });
      if (res.status === 401 && allowRefresh && this.refreshToken) {
        await this.refreshAccessToken();
        return this.currentAuthUser(false);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.id) throw new Error(data.msg || data.message || 'Authenticated user could not be loaded.');
      this._authUserCache={user:data,at:Date.now()};
      return data;
    })().finally(()=>{this._authUserPromise=null;});
    return this._authUserPromise;
  },
  async updateMyProfile({ displayName, ageStatus }) {
    if (!this.accessToken) throw new Error('Real Supabase sign-in is required before profile sync.');
    const authUser = await this.currentAuthUser();
    const rows = await this.request(`/rest/v1/profiles?user_id=eq.${encodeURIComponent(authUser.id)}`, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ display_name: displayName, age_status: ageStatus })
    });
    return Array.isArray(rows) ? (rows[0] || null) : null;
  },
  async signInWithPassword(email, password) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    let res;
    try {
      res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': CONFIG.SUPABASE_PUBLISHABLE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
        signal: controller.signal
      });
    } catch (err) {
      if (err?.name === 'AbortError') throw new Error('Supabase connection timed out. Please retry.');
      throw new Error(`Supabase connection failed: ${err?.message || 'Network error'}`);
    } finally {
      clearTimeout(timeoutId);
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || data.message || 'Sign-in failed');
    this.setAccessToken(data.access_token);
    this.refreshToken = data.refresh_token || null;
    sessionStorage.setItem('bharathlink.phase1b.test_access_token', data.access_token);
    if (this.refreshToken) sessionStorage.setItem('bharathlink.phase1b.test_refresh_token', this.refreshToken);
    return data;
  },
  restoreTestSession() {
    const token = sessionStorage.getItem('bharathlink.phase1b.test_access_token');
    this.refreshToken = sessionStorage.getItem('bharathlink.phase1b.test_refresh_token');
    if (token) this.setAccessToken(token);
    return !!token;
  },
  clearTestSession() {
    this.setAccessToken(null); this.refreshToken = null;
    sessionStorage.removeItem('bharathlink.phase1b.test_access_token');
    sessionStorage.removeItem('bharathlink.phase1b.test_refresh_token');
  }
};

/* =====================================================================
   5C. PHASE 1B E2EE V2 DEVICE + MESSAGE TRANSPORT
   - Device private ECDH key is non-extractable and remains in IndexedDB.
   - Each message uses a fresh random AES-256-GCM content key.
   - Content key is wrapped independently for every active conversation device.
   - AAD binds version, conversation, client message id, sender and recipient device.
   - No plaintext fallback is permitted for backend E2EE messages.
   ===================================================================== */
const E2EEBackend = {
  DB:'bharathlink-e2ee-v2', STORE:'keys', _activatePromise:null,
  enc:new TextEncoder(), dec:new TextDecoder(),
  b64(v){let s='';for(const b of new Uint8Array(v))s+=String.fromCharCode(b);return btoa(s);},
  unb64(v){const s=atob(v),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;},
  canon(o){return JSON.stringify(o);},
  uuid(){return crypto.randomUUID ? crypto.randomUUID() : Util.uuid();},
  openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(this.DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(this.STORE))r.result.createObjectStore(this.STORE);};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});},
  slot(userId){return `device:${userId}`;},
  async getLocal(userId){const db=await this.openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(this.STORE,'readonly'),r=tx.objectStore(this.STORE).get(this.slot(userId));r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});},

  async rpc(name,body){try{return await Supabase.request(`/rest/v1/rpc/${name}`,{method:'POST',body:JSON.stringify(body)});}catch(ex){const neutral={'Message could not be sent':'Message could not be sent.','Action could not be completed':'Action could not be completed.','Conversation could not be started':'Conversation could not be started.'}[ex?.message];if(neutral)throw new Error(neutral);throw ex;}},
  async activate(){
    if(this._activatePromise)return this._activatePromise;
    this._activatePromise=(async()=>{
      if(!Supabase.accessToken)throw new Error('Sign in first.');
      const me=await Supabase.currentAuthUser(); let local=await this.getLocal(me.id);

        if(st===true)return local;
      }
      const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);
      const pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
      const rows=await Supabase.request('/rest/v1/messaging_devices',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:me.id,device_label:'BharathLink web E2EE v2',public_key_jwk:pub,key_algorithm:'ECDH-P256'})});
      if(!Array.isArray(rows)||!rows[0]?.id)throw new Error('Device registration failed.');
      local={userId:me.id,deviceId:rows[0].id,privateKey:kp.privateKey,publicJwk:pub};await this.putLocal(me.id,local);return local;

  async importPub(jwk){if(!jwk||jwk.kty!=='EC'||jwk.crv!=='P-256'||!jwk.x||!jwk.y)throw new Error('Invalid device public key.');return crypto.subtle.importKey('jwk',jwk,{name:'ECDH',namedCurve:'P-256'},false,[]);},
  async deriveWrapKey(myStaticPriv,ephPriv,recipientJwk,header,recipientDeviceId){
    const pub=await this.importPub(recipientJwk);
    const a=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:pub},ephPriv,256));
    const b=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:pub},myStaticPriv,256));
    const ikm=new Uint8Array(a.length+b.length);ikm.set(a);ikm.set(b,a.length);
    const material=await crypto.subtle.importKey('raw',ikm,'HKDF',false,['deriveKey']);
    const salt=new Uint8Array(await crypto.subtle.digest('SHA-256',this.enc.encode(this.canon(header))));
    return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt,info:this.enc.encode(`bharathlink-wrap-v2|${recipientDeviceId}`)},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  },
  async deriveUnwrapKey(myStaticPriv,senderStaticJwk,ephJwk,header,myDeviceId){
    const eph=await this.importPub(ephJwk), sender=await this.importPub(senderStaticJwk);
    const a=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:eph},myStaticPriv,256));
    const b=new Uint8Array(await crypto.subtle.deriveBits({name:'ECDH',public:sender},myStaticPriv,256));
    const ikm=new Uint8Array(a.length+b.length);ikm.set(a);ikm.set(b,a.length);
    const material=await crypto.subtle.importKey('raw',ikm,'HKDF',false,['deriveKey']);
    const salt=new Uint8Array(await crypto.subtle.digest('SHA-256',this.enc.encode(this.canon(header))));
    return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt,info:this.enc.encode(`bharathlink-wrap-v2|${myDeviceId}`)},material,{name:'AES-GCM',length:256},false,['decrypt']);
  },

  async sendV2(text,conversationId=null,reply=null,meta=null){
    const __t0=performance.now(), __timing={};
    const [local,me,conv]=await Promise.all([this.activate(),Supabase.currentAuthUser(),this.conversationForSend(conversationId)]);
    __timing.setup_ms=Math.round(performance.now()-__t0);
    const __td=performance.now();
    const devices=await this.rpc('get_conversation_messaging_devices',{p_conversation_id:conv.conversation_id});
    __timing.device_lookup_ms=Math.round(performance.now()-__td);
    if(!Array.isArray(devices)||!devices.length)throw new Error('No active E2EE devices in this conversation.');
    if(!devices.some(d=>d.device_id===local.deviceId))throw new Error('Current device is not active in the conversation.');
    const clientMessageId=this.uuid();
    const header={v:2,conversation_id:conv.conversation_id,client_message_id:clientMessageId,sender_user_id:me.id,sender_device_id:local.deviceId};
    const aad=this.enc.encode(this.canon(header));
    const rawKey=crypto.getRandomValues(new Uint8Array(32));
    const msgKey=await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['encrypt']);
    const msgIv=crypto.getRandomValues(new Uint8Array(12));
    const payload=(reply||meta?.forwarded||meta?.photo||meta?.video||meta?.audio||meta?.document||meta?.location||meta?.contact||meta?.album||meta?.call)?`BLMSG1:${JSON.stringify({text,...(reply?{reply:{message_id:reply.message_id,text:reply.text,sender_id:reply.sender_id,...(reply.media_type?{media_type:reply.media_type}:{})}}:{}),...(meta?.forwarded?{forwarded:true}:{}),...(meta?.photo?{photo:meta.photo}:{}),...(meta?.video?{video:meta.video}:{}),...(meta?.audio?{audio:meta.audio}:{}),...(meta?.document?{document:meta.document}:{}),...(meta?.location?{location:meta.location}:{}),...(meta?.contact?{contact:meta.contact}:{}),...(meta?.album?{album:meta.album}:{}),...(meta?.call?{call:meta.call}:{})})}`:text;
    const bodyCt=await crypto.subtle.encrypt({name:'AES-GCM',iv:msgIv,additionalData:aad},msgKey,this.enc.encode(payload));
    const __te=performance.now();
    const envelopes=await Promise.all(devices.map(async d=>{
      const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
      const ephPub=await crypto.subtle.exportKey('jwk',eph.publicKey);
      const wrapKey=await this.deriveWrapKey(local.privateKey,eph.privateKey,d.public_key_jwk,header,d.device_id);
      const wrapIv=crypto.getRandomValues(new Uint8Array(12));
      const envAad=this.enc.encode(this.canon({...header,recipient_user_id:d.user_id,recipient_device_id:d.device_id}));
      const wrapped=await crypto.subtle.encrypt({name:'AES-GCM',iv:wrapIv,additionalData:envAad},wrapKey,rawKey);
      return {recipient_user_id:d.user_id,recipient_device_id:d.device_id,ciphertext:this.b64(wrapped),iv:this.b64(wrapIv),eph_pub:ephPub,encryption_version:2};
    }));
    __timing.encrypt_wrap_ms=Math.round(performance.now()-__te);
    const __tr=performance.now();
    const id=await this.rpc('send_encrypted_message_v2',{p_conversation_id:conv.conversation_id,p_sender_device_id:local.deviceId,p_client_message_id:clientMessageId,p_ciphertext:this.b64(bodyCt),p_iv:this.b64(msgIv),p_envelopes:envelopes});
    __timing.rpc_send_ms=Math.round(performance.now()-__tr);
    __timing.total_ms=Math.round(performance.now()-__t0);
    return {messageId:id,conversationId:conv.conversation_id,envelopeCount:envelopes.length,timing:__timing};
  },
  async editV2(message,newText){
    const local=await this.activate(), me=await Supabase.currentAuthUser();
    if(!message||message.sender_id!==me.id)throw new Error('Only your own message can be edited.');
    const devices=await this.rpc('get_conversation_messaging_devices',{p_conversation_id:message.conversation_id});
    if(!Array.isArray(devices)||!devices.length)throw new Error('No active E2EE devices in this conversation.');
    const header={v:2,conversation_id:message.conversation_id,client_message_id:message.client_message_id,sender_user_id:me.id,sender_device_id:local.deviceId};
    const rawKey=crypto.getRandomValues(new Uint8Array(32));
    const msgKey=await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['encrypt']);
    const msgIv=crypto.getRandomValues(new Uint8Array(12));
    const attachments=['photo','video','audio','document','location','contact'].reduce((o,k)=>message[k]?{...o,[k]:message[k]}:o,{});
    const payload=(message.reply||message.forwarded||Object.keys(attachments).length)?`BLMSG1:${JSON.stringify({text:newText,...(message.reply?{reply:{message_id:message.reply.message_id,text:message.reply.text,sender_id:message.reply.sender_id,...(message.reply.media_type?{media_type:message.reply.media_type}:{}),...(message.reply.media_thumb?{media_thumb:message.reply.media_thumb}:{})}}:{}),...(message.forwarded?{forwarded:true}:{}),...attachments})}`:newText;
    const bodyCt=await crypto.subtle.encrypt({name:'AES-GCM',iv:msgIv,additionalData:this.enc.encode(this.canon(header))},msgKey,this.enc.encode(payload));
    const envelopes=[];
    for(const d of devices){
      const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
      const ephPub=await crypto.subtle.exportKey('jwk',eph.publicKey);
      const wrapKey=await this.deriveWrapKey(local.privateKey,eph.privateKey,d.public_key_jwk,header,d.device_id);
      const wrapIv=crypto.getRandomValues(new Uint8Array(12));
      const envAad=this.enc.encode(this.canon({...header,recipient_user_id:d.user_id,recipient_device_id:d.device_id}));
      const wrapped=await crypto.subtle.encrypt({name:'AES-GCM',iv:wrapIv,additionalData:envAad},wrapKey,rawKey);
      envelopes.push({recipient_user_id:d.user_id,recipient_device_id:d.device_id,ciphertext:this.b64(wrapped),iv:this.b64(wrapIv),eph_pub:ephPub,encryption_version:2});
    }
    await this.rpc('edit_my_encrypted_message',{p_message_id:message.message_id,p_sender_device_id:local.deviceId,p_ciphertext:this.b64(bodyCt),p_iv:this.b64(msgIv),p_envelopes:envelopes});
