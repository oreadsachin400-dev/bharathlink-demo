  async receiveV2(conversationId=null, clearCutoff=null, latestOnly=false, latestLimit=20){
    const local=await this.activate();
    const rows=[];
    if(conversationId){
      // Phase 1F.4C8: filter on the server BEFORE JSON serialization and page
      // with a stable (created_at,message_id) cursor. This avoids the old
      // multi-megabyte all-conversation RPC response on mobile.
      const pageSize=latestOnly?Math.max(1,Math.min(20,Number(latestLimit)||20)):20;
      let beforeCreatedAt=null, beforeMessageId=null;
      for(let page=0;page<500;page++){
        const batch=await this.rpc('get_my_encrypted_messages_v2_for_conversation',{
          p_device_id:local.deviceId,
          p_conversation_id:conversationId,
          p_limit:pageSize,
          p_before_created_at:beforeCreatedAt,
          p_before_message_id:beforeMessageId
        });
        let arr=Array.isArray(batch)?batch:[];
        if(clearCutoff){
          const cutoffMs=new Date(clearCutoff).getTime();
          const kept=arr.filter(r=>new Date(r.created_at).getTime()>cutoffMs);
          rows.push(...kept);
          // Newest-first page: once this page reaches the per-user clear cutoff,
          // older pages are intentionally invisible and need not be fetched/decrypted.
          if(kept.length<arr.length)break;
        }else rows.push(...arr);
        if(latestOnly||arr.length<pageSize)break;
        const cursor=arr[arr.length-1];
        beforeCreatedAt=cursor.created_at;
        beforeMessageId=cursor.message_id;
      }
      // Conversation RPC returns newest-first; renderer expects chronological.
      rows.sort((a,b)=>{
        const ta=new Date(a.created_at).getTime(), tb=new Date(b.created_at).getTime();
        if(ta!==tb)return ta-tb;
        return String(a.message_id).localeCompare(String(b.message_id));
      });
    }else{
      // Preserve the existing non-conversation path for direct-chat callers.
      const pageSize=5; let from=0;
      for(let page=0;page<500;page++){
        const batch=await Supabase.request('/rest/v1/rpc/get_my_encrypted_messages_v2',{
          method:'POST',
          headers:{Range:`${from}-${from+pageSize-1}`,'Range-Unit':'items','Prefer':'count=none'},
          body:JSON.stringify({p_device_id:local.deviceId})
        });
        const arr=Array.isArray(batch)?batch:[];
        rows.push(...arr);
        if(arr.length<pageSize)break;
        from+=pageSize;
      }
    }
    const out=[];
    for(const r of (rows||[])){
      try{
        const header={v:2,conversation_id:r.conversation_id,client_message_id:r.client_message_id,sender_user_id:r.sender_id,sender_device_id:r.sender_device_id};
        const wrapKey=await this.deriveUnwrapKey(local.privateKey,r.sender_public_key_jwk,r.eph_pub,header,local.deviceId);
        const envAad=this.enc.encode(this.canon({...header,recipient_user_id:local.userId,recipient_device_id:local.deviceId}));
        const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(r.wrap_iv),additionalData:envAad},wrapKey,this.unb64(r.wrapped_key));
        const msgKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(r.message_iv),additionalData:this.enc.encode(this.canon(header))},msgKey,this.unb64(r.message_ciphertext));
        const decoded=this.dec.decode(pt);
        let text=decoded,reply=null,forwarded=false,photo=null,video=null,audio=null,document=null,location=null,contact=null,album=null,call=null;
        if(decoded.startsWith('BLMSG1:')){
          try{const payload=JSON.parse(decoded.slice(7));text=String(payload?.text??'');reply=payload?.reply||null;forwarded=payload?.forwarded===true;photo=payload?.photo||null;video=payload?.video||null;audio=payload?.audio||null;document=payload?.document||null;location=LocationShare.sanitize(payload?.location);contact=ContactShare.sanitize(payload?.contact);album=payload?.album||null;call=payload?.call||null;}catch(_){}
        }
        out.push({...r,text,reply,forwarded,photo,video,audio,document,location,contact,album,call,decryptOk:true});
      }catch(_){out.push({...r,text:'Unable to decrypt this message',decryptOk:false});}
    }
    return out;
  }
};

/* =====================================================================
   5D. E2EE V2 DEVICE REGISTRATION TEST (TEST BUILD ONLY)
   Isolated plumbing test for the V2 backend. It does NOT touch V1
   messaging: not E2EEBackend, not messaging_devices, not the V1 IndexedDB
   database 'bharathlink-e2ee-v2'.
   Exact RPC signature used (no other parameters are ever sent):
     register_e2ee_v2_device(p_device_id uuid,
                             p_signing_public_key text,
                             p_curve25519_public_key text)
   - Uses the existing authenticated Supabase session. No password, no manual token.
   - p_curve25519_public_key is a real WebCrypto X25519 public key. If this
     browser has no X25519 support the test FAILS; it never substitutes P-256.
   - p_signing_public_key is WebCrypto Ed25519 when supported, otherwise an
     ECDSA P-256 fallback that is labelled as such.
   - These are TEMPORARY TEST keys for backend plumbing only. They are not the
     production identity/prekey keys, and there is no X3DH/PQXDH or Double
     Ratchet here. Production V2 crypto will come from a vetted library.
   - Private keys are non-extractable and never leave IndexedDB.
   - Public keys are sent as base64 of the raw public key bytes.
   ===================================================================== */
const E2EEV2DeviceTest = {
  DB: 'bharathlink-e2ee-v2-device-test', STORE: 'devices', RECORD_VERSION: 2,
  RPC: 'register_e2ee_v2_device',
  RPC_PARAMS: Object.freeze(['p_device_id', 'p_signing_public_key', 'p_curve25519_public_key']),
  result: null, running: false, autoRan: false,
  b64(buf) { let s = ''; for (const b of new Uint8Array(buf)) s += String.fromCharCode(b); return btoa(s); },
  hex(bytes) { return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(''); },
  uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const x = this.hex(b); return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}`;
  },
  slot(userId) { return `test-device:${userId}`; },
  openDb() { return new Promise((resolve, reject) => { const r = indexedDB.open(this.DB, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(this.STORE)) r.result.createObjectStore(this.STORE); };
    r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); }); },
  async idb(mode, fn) { const db = await this.openDb(); return new Promise((resolve, reject) => {
    const tx = db.transaction(this.STORE, mode), req = fn(tx.objectStore(this.STORE)); let out = null;
    if (req) req.onsuccess = () => { out = req.result; };
    tx.oncomplete = () => { db.close(); resolve(out); }; tx.onerror = () => { db.close(); reject(tx.error); }; }); },
  getLocal(userId) { return this.idb('readonly', s => s.get(this.slot(userId))); },
  putLocal(userId, v) { return this.idb('readwrite', s => s.put(v, this.slot(userId))); },
  delLocal(userId) { return this.idb('readwrite', s => s.delete(this.slot(userId))); },

  assertBrowserSafeKey() {
    const k = String(CONFIG.SUPABASE_PUBLISHABLE_KEY || '');
    if (k.startsWith('sb_secret_')) throw new Error('A secret key is configured. Refusing to run.');
    if (k.startsWith('eyJ')) { try { if (JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role === 'service_role') throw new Error('x'); }
      catch (_) { throw new Error('Configured key is not a browser-safe publishable key. Refusing to run.'); } }
  },
  async generateLocal(userId) {
    let x;
    try { x = await crypto.subtle.generateKey({ name: 'X25519' }, false, ['deriveBits']); }
    catch (_) { throw new Error('This browser does not support WebCrypto X25519, so no Curve25519 test key could be made. Update Chrome and try again.'); }
    let sign, signAlg;
    try { sign = await crypto.subtle.generateKey({ name: 'Ed25519' }, false, ['sign', 'verify']); signAlg = 'Ed25519'; }
    catch (_) { sign = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']); signAlg = 'ECDSA-P256'; }
    return { v: this.RECORD_VERSION, userId, deviceId: this.uuid(), createdAt: Date.now(), registeredAt: null, verifiedReturnedId: null,
      signing: { alg: signAlg, privateKey: sign.privateKey, publicKey: sign.publicKey, rawB64: this.b64(await crypto.subtle.exportKey('raw', sign.publicKey)) },
      curve25519: { alg: 'X25519', privateKey: x.privateKey, publicKey: x.publicKey, rawB64: this.b64(await crypto.subtle.exportKey('raw', x.publicKey)) } };
  },
  signParams(alg) { return alg === 'Ed25519' ? { name: 'Ed25519' } : { name: 'ECDSA', hash: 'SHA-256' }; },
  async checkLocal(l) {
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(l.deviceId || '')) throw new Error('Local device ID is not a valid UUID.');
    if (l.curve25519?.alg !== 'X25519' || atob(l.curve25519.rawB64).length !== 32) throw new Error('Local Curve25519 test key is not a 32-byte X25519 public key.');
    for (const k of [l.signing?.privateKey, l.curve25519?.privateKey]) {
      if (!(k instanceof CryptoKey) || k.type !== 'private') throw new Error('A local private key is missing.');
      if (k.extractable !== false) throw new Error('A local private key is extractable. Refusing to continue.');
    }
    const msg = new TextEncoder().encode(`bharathlink-v2-test|${l.deviceId}|${l.curve25519.rawB64}`);
    const sig = await crypto.subtle.sign(this.signParams(l.signing.alg), l.signing.privateKey, msg);
    if (!await crypto.subtle.verify(this.signParams(l.signing.alg), l.signing.publicKey, sig, msg)) throw new Error('Local signing key self-check failed.');
  },
  buildPayload(l) {
    const payload = { p_device_id: l.deviceId, p_signing_public_key: l.signing.rawB64, p_curve25519_public_key: l.curve25519.rawB64 };
    const keys = Object.keys(payload);
    if (keys.length !== this.RPC_PARAMS.length || !this.RPC_PARAMS.every(k => keys.includes(k))) throw new Error('Payload does not match the exact RPC signature.');
    for (const v of Object.values(payload)) if (typeof v !== 'string' || !v) throw new Error('Every RPC parameter must be a non-empty string.');
    if (/"d"\s*:/.test(JSON.stringify(payload))) throw new Error('Refusing to send: payload contains private key material.');
    return payload;
  },
  async callRpc(name, body, allowRefresh = true) {
    const go = () => fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${name}`, { method: 'POST', headers: Supabase.headers(), body: JSON.stringify(body) });
    let res = await go();
    if (res.status === 401 && allowRefresh && Supabase.refreshToken) { await Supabase.refreshAccessToken(); res = await go(); }
    const text = await res.text(); let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
    return { ok: res.ok, status: res.status, data };
  },
  extractId(d, depth = 0) {
    if (depth > 3 || d == null) return null;
    if (Array.isArray(d)) return this.extractId(d[0], depth + 1);
    if (typeof d === 'string') return d;
    if (typeof d === 'object') {
      const direct = d.device_id || d.id || d.p_device_id;
      if (typeof direct === 'string') return direct;
      for (const v of Object.values(d)) { const x = this.extractId(v, depth + 1); if (x) return x; }
    }
    return null;
  },
  describe(res) {
    const d = res.data && typeof res.data === 'object' ? res.data : {};
    return [`HTTP ${res.status}`, d.code, d.message || (typeof res.data === 'string' ? res.data : ''), d.details, d.hint ? `Hint: ${d.hint}` : '']
      .filter(Boolean).join(' | ');
  },
  async run() {
    if (this.running) return;
    this.running = true;
    const r = this.result = { auth: 'pending', keys: 'pending', rpc: 'pending', userId: null, deviceId: null, returnedId: null,
      signingAlg: null, notes: [], sentParams: [], server: null };
    this.refresh();
    try {
      try {
        this.assertBrowserSafeKey();
        if (!Supabase.accessToken) throw new Error('Not signed in. Sign in with the BharathLink login first.');
        const me = await Supabase.currentAuthUser();
        r.userId = me.id; r.auth = 'pass';
      } catch (e) { r.auth = 'fail'; r.notes.push(`Authenticated user: ${e.message}`); return; }

      let local;
      try {
        if (!window.isSecureContext || !crypto?.subtle) throw new Error('WebCrypto is unavailable because this page is not a secure context.');
        local = await this.getLocal(r.userId);
        if (!local || local.userId !== r.userId || local.v !== this.RECORD_VERSION) {
          if (local && local.v !== this.RECORD_VERSION) r.notes.push('Replaced an older local test device from the previous test build.');
          local = await this.generateLocal(r.userId); await this.putLocal(r.userId, local);
          r.notes.push('Generated a new local test device.');
        } else r.notes.push('Reused the saved local test device.');
        await this.checkLocal(local);
        r.deviceId = local.deviceId; r.signingAlg = local.signing.alg; r.keys = 'pass';
        if (local.signing.alg !== 'Ed25519') r.notes.push('This browser has no WebCrypto Ed25519, so the signing test key is ECDSA P-256.');
      } catch (e) { r.keys = 'fail'; r.notes.push(`Local key generation: ${e.message}`); return; }

      try {
        const payload = this.buildPayload(local);
        r.sentParams = Object.keys(payload);
        const res = await this.callRpc(this.RPC, payload);
        if (res.ok) r.returnedId = this.extractId(res.data);
        else {
          r.server = this.describe(res);
          const dup = res.data && res.data.code === '23505';
          if (dup && local.verifiedReturnedId && local.verifiedReturnedId.toLowerCase() === local.deviceId.toLowerCase()) {
            r.returnedId = local.verifiedReturnedId;
            r.notes.push(`Already registered: an earlier run on this device verified the returned ID (${new Date(local.registeredAt).toLocaleString()}). The server rejected re-registration as a duplicate.`);
          } else throw new Error(r.server);
        }
        if (!r.returnedId) throw new Error('The RPC succeeded but returned no device ID.');
        if (r.returnedId.toLowerCase() !== local.deviceId.toLowerCase())
          throw new Error(`Returned device ID ${r.returnedId} does not match the local device ID.`);
        local.registeredAt = local.registeredAt || Date.now(); local.verifiedReturnedId = r.returnedId;
        await this.putLocal(r.userId, local);
        r.rpc = 'pass';
      } catch (e) { r.rpc = 'fail'; r.notes.push(`V2 device registration RPC: ${e.message}`); }
    } finally {
      for (const k of ['auth', 'keys', 'rpc']) if (r[k] === 'pending') r[k] = 'skip';
      this.running = false; this.refresh();
    }
  },
  async forget() {
    const me = await Supabase.currentAuthUser();
    await this.delLocal(me.id);
    this.result = null; this.refresh();
  },
  refresh() { if (Router.current() === '/e2ee-v2-test') App.refresh(); }
};

/* =====================================================================
   5E. ENCRYPTED LOCATION SHARING (Phase 1E.17)
   - Location is requested ONLY after the user taps 📍 Location, never on load.
   - Coordinates travel only inside the existing BLMSG1 payload, which
     E2EEBackend.sendV2 encrypts with AES-GCM before anything reaches Supabase.
     There are no plaintext coordinate columns or separate requests.
   - Received locations are validated before display (untrusted sender).
   - Maps link uses Google Maps URLs over HTTPS (no API key, no SDK).
   ===================================================================== */
const LocationShare = {
  OPTIONS: Object.freeze({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }),
  round(n) { return Math.round(n * 1e6) / 1e6; },
  sanitize(v) {
    if (!v || typeof v !== 'object') return null;
    const num = x => typeof x === 'number' ? x : (typeof x === 'string' && x.trim() !== '' ? Number(x) : NaN);
    const lat = num(v.lat), lng = num(v.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    const acc = num(v.accuracy_m), t = num(v.captured_at);
    return { v: 1, lat: this.round(lat), lng: this.round(lng),
      accuracy_m: v.accuracy_m != null && Number.isFinite(acc) && acc >= 0 && acc < 1e7 ? Math.round(acc) : null,
      captured_at: v.captured_at != null && Number.isFinite(t) && t > 0 ? Math.round(t) : null };
  },
  errorMessage(err) {
    switch (err && err.code) {
      case 1: return 'Location permission was denied. Allow location for this site in your browser settings, then try again.';
      case 2: return 'Your location is unavailable right now. Turn on device location (GPS) and try again.';
      case 3: return 'Getting your location took too long. Try again, ideally with a clear view of the sky.';
      default: return 'Could not get your location. Please try again.';
    }
  },
  request() {
    return new Promise((resolve, reject) => {
      const geo = navigator.geolocation;
      if (!geo || typeof geo.getCurrentPosition !== 'function')
        return reject(new Error('This browser does not support location sharing.'));
      if (!window.isSecureContext)
        return reject(new Error('Location sharing needs a secure HTTPS page. Open BharathLink from its HTTPS address to share your location.'));
      geo.getCurrentPosition(pos => {
        const loc = this.sanitize({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy_m: pos.coords.accuracy, captured_at: pos.timestamp });
        loc ? resolve(loc) : reject(new Error('The device returned an invalid location.'));
      }, err => reject(new Error(this.errorMessage(err))), this.OPTIONS);
    });
  },
  mapsUrl(loc) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${loc.lat},${loc.lng}`)}`; },
  accuracyLabel(m) { return m == null ? 'unknown accuracy' : m >= 1000 ? `±${(m / 1000).toFixed(1)} km` : `±${m} m`; },
  open(loc) {
    const a = document.createElement('a');
    a.href = this.mapsUrl(loc); a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.click();
  }
};

/* =====================================================================
   5F. ENCRYPTED CONTACT SHARING (Phase 1E.18)
   - Starts ONLY when the user taps 👤 Contact. Uses the browser Contact
     Picker (navigator.contacts.select) where available (Android Chrome,
     secure page); otherwise the user types the contact into a small form.
     No fake or sample contacts, no address-book access beyond the one pick.
   - The contact travels only inside the existing BLMSG1 payload, which
     E2EEBackend.sendV2 encrypts before anything reaches Supabase.
   - Every contact (sent or received) is validated/normalised here; the card
     only renders text nodes, and tel:/mailto: links are built from
     normalised values only.
   ===================================================================== */
const ContactShare = {
  MAX: Object.freeze({ name: 100, phones: 3, emails: 3 }),
  clean(s, max) {
    return typeof s === 'string' ? s.replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim().slice(0, max) : '';
  },
  phone(p) {
    const s = this.clean(p, 40);
    if (!/^\+?[0-9 ()\-.]+$/.test(s)) return '';
    const digits = s.replace(/\D/g, '');
    if (digits.length < 3 || digits.length > 15) return '';
    return (s.startsWith('+') ? '+' : '') + digits;
  },
  email(e) {
    const s = this.clean(e, 254);
    return /^[^\s@<>"'()\[\]\\,;:]+@[^\s@<>"'()\[\]\\,;:]+\.[^\s@<>"'()\[\]\\,;:]{2,}$/.test(s) ? s : '';
  },
  sanitize(v) {
    if (!v || typeof v !== 'object') return null;
    const list = (a, fn, max) => [...new Set((Array.isArray(a) ? a : []).map(x => fn.call(this, x)).filter(Boolean))].slice(0, max);
    const phones = list(v.phones, this.phone, this.MAX.phones), emails = list(v.emails, this.email, this.MAX.emails);
    if (!phones.length && !emails.length) return null;
    return { v: 1, name: this.clean(v.name, this.MAX.name) || phones[0] || emails[0], phones, emails };
  },
  pickerAvailable() { return !!(navigator.contacts && typeof navigator.contacts.select === 'function'); },
  async pick() {
    let props = ['name', 'tel', 'email'];
    try { if (typeof navigator.contacts.getProperties === 'function') { const ok = await navigator.contacts.getProperties(); props = props.filter(p => ok.includes(p)); } } catch (_) {}
    if (!props.includes('tel') && !props.includes('email')) throw new Error('This browser cannot read phone numbers or emails from contacts.');
    const res = await navigator.contacts.select(props, { multiple: false });
    const c = Array.isArray(res) ? res[0] : null;
    if (!c) return { contact: null, reason: 'none' };
    const name = this.clean(Array.isArray(c.name) ? c.name[0] : '', this.MAX.name);
    const contact = this.sanitize({ name, phones: c.tel, emails: c.email });
    return contact ? { contact } : { contact: null, reason: 'unusable', name };
  },
  summary(c) { return [c.name, ...c.phones, ...c.emails].filter((x, i, a) => a.indexOf(x) === i).join('\n'); },
  open(href) { const a = document.createElement('a'); a.href = href; a.rel = 'noopener noreferrer'; a.click(); }
};

/* =====================================================================
   5G. LINK CARDS (Phase 1E.19)
   - Links are ordinary message text, so they are already end-to-end
     encrypted by the existing BLMSG1/sendV2 pipeline. Nothing new is sent.
   - Only http(s) and www. links are recognised; everything is parsed with
     URL() and shown with its real host name (punycode stays visible).
   - No preview fetching: fetching titles/thumbnails would reveal the link to
     other servers and is blocked by this app's CSP anyway.
   ===================================================================== */
const LinkShare = {
  RE: /(?:https?:\/\/|www\.)[^\s<>"'`]+/gi,
  parse(raw) {
    const s = String(raw).replace(/[.,;:!?)\]}'"]+$/, '');
    try {
      const u = new URL(/^www\./i.test(s) ? `https://${s}` : s);
      if ((u.protocol !== 'https:' && u.protocol !== 'http:') || !u.hostname.includes('.') || u.username || u.password) return null;
      return { text: s, href: u.href, url: u };
    } catch (_) { return null; }
  },
  split(text) {
    const out = [], s = String(text || ''); let last = 0; this.RE.lastIndex = 0;
    for (const m of s.matchAll(this.RE)) {
      const link = this.parse(m[0]); if (!link) continue;
      if (m.index > last) out.push({ t: s.slice(last, m.index) });
      out.push({ link }); last = m.index + link.text.length;
    }
    if (last < s.length) out.push({ t: s.slice(last) });
    return out;
  },
  first(text) { const p = this.split(text).find(x => x.link); return p ? p.link : null; },
  kind(u) {
    const host = u.hostname.toLowerCase().replace(/^(www|m)\./, ''), path = u.pathname.toLowerCase();
    if (host === 'music.youtube.com') return { icon: '🎵', title: 'YouTube Music' };
    if (host === 'youtube.com' || host === 'youtu.be' || host.endsWith('.youtube.com'))
      return path.startsWith('/shorts/') ? { icon: '▶️', title: 'YouTube Shorts' } : { icon: '▶️', title: 'YouTube video' };
    const music = { 'open.spotify.com': 'Spotify', 'spotify.com': 'Spotify', 'jiosaavn.com': 'JioSaavn', 'gaana.com': 'Gaana', 'wynk.in': 'Wynk Music', 'music.apple.com': 'Apple Music', 'soundcloud.com': 'SoundCloud' };
    if (music[host]) return { icon: '🎵', title: music[host] };
    if (host === 'instagram.com' && /^\/(reel|reels|p)\//.test(path)) return { icon: '🎬', title: 'Instagram' };
    return { icon: '🔗', title: 'Link' };
  },
  open(href) { const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.click(); }
};

/* =====================================================================
   6. AUTH / OTP PROVIDER
   OtpProvider interface (swap DevLocalOtpProvider for a server-backed one):
     sendOtp(mobile)            -> Promise<{ sessionId, expiresAt, resendAvailableAt, devCode? }>
     verifyOtp(sessionId, code) -> Promise<{ ok:true, mobile } | { ok:false, reason, attemptsLeft? }>
   A real provider runs both steps on the server, never exposes the code,
   and on success sets an httpOnly session cookie. The UI does not change.
   ===================================================================== */
const DevLocalOtpProvider = {
  id: 'dev-local-otp', isDevelopment: true, authoritative: false,
  _sessions: new Map(), // memory only
  async sendOtp(mobile) {
    const now = Date.now(), sessionId = Util.uuid(), code = Util.randomDigits(CONFIG.OTP_LENGTH);
    this._sessions.clear();
    this._sessions.set(sessionId, { mobile, code, expiresAt: now + CONFIG.OTP_TTL_MS, attempts: 0 });
    return { sessionId, expiresAt: now + CONFIG.OTP_TTL_MS, resendAvailableAt: now + CONFIG.OTP_RESEND_MS, devCode: code };
  },
  async verifyOtp(sessionId, code) {
    const s = this._sessions.get(sessionId);
    if (!s) return { ok: false, reason: 'no_session' };
    if (Date.now() > s.expiresAt) { this._sessions.delete(sessionId); return { ok: false, reason: 'expired' }; }
    s.attempts++;
    if (Util.constantTimeEqual(code, s.code)) { this._sessions.delete(sessionId); return { ok: true, mobile: s.mobile }; }
    const left = CONFIG.OTP_MAX_ATTEMPTS - s.attempts;
    if (left <= 0) { this._sessions.delete(sessionId); return { ok: false, reason: 'locked' }; }
    return { ok: false, reason: 'mismatch', attemptsLeft: left };
  }
};

const Auth = {
  provider: DevLocalOtpProvider,
  pending: null,     // in-memory OTP session; lost on refresh by design
  lastMobile: '',
  async start(mobile) {
    const r = await this.provider.sendOtp(mobile);
    this.lastMobile = mobile;
    this.pending = Object.assign({ mobile }, r);
    return this.pending;
  },
  resend() { return this.start(this.pending ? this.pending.mobile : this.lastMobile); },
  async verify(code) {
    if (!this.pending) return { ok: false, reason: 'no_session' };
    const r = await this.provider.verifyOtp(this.pending.sessionId, code);
    if (r.ok) { this.pending = null; Account.create(r.mobile, this.provider); }
    else if (r.reason !== 'mismatch') this.pending = null;
    return r;
  }
};

const Account = {
  create(mobile, provider) {
    Store.update(s => {
      s.account = { accountId: Util.uuid(), mobile, createdAt: Date.now(),
        authProvider: provider.id, authAuthoritative: !!provider.authoritative };
    });
    Verification.record('mobile', {
      status: provider.isDevelopment ? VStatus.DEMO : VStatus.VERIFIED,
      note: provider.isDevelopment ? 'Test code shown on screen. No SMS was sent.' : null
    }, provider);
  }
};

/* =====================================================================
   7. VERIFICATION PROVIDERS
   VerificationProvider interface:
     { id, kind, authoritative:boolean, check(context) -> Promise<{ status, note?, attestation? }> }
   Production: check() calls the BharathLink server, which talks to UIDAI /
   KYC / NPCI partners under proper authorisation and returns a signed
   attestation. Only then may a result become "verified".
   ===================================================================== */
const Attestation = {
  // Phase 1A has no trusted server and no signing keys, so nothing is accepted.
  verify(/* attestation */) { return false; }
};

const DemoVerificationProvider = kind => ({
  id: `demo-${kind}`, kind, authoritative: false, isDevelopment: true,
  async check() { await Util.delay(700); return { status: VStatus.DEMO, note: 'Simulated for testing. No real check was made.' }; }
});

const Verification = {
  providers: new Map(['aadhaar', 'kyc', 'upi'].map(k => [k, DemoVerificationProvider(k)])),
  running: false,
  register(kind, provider) { this.providers.set(kind, provider); },
  record(kind, result, provider) {
    let status = result.status;
    // Guard: an unattested "verified" is never stored, whatever the caller claims.
    if (status === VStatus.VERIFIED && !(provider && provider.authoritative && Attestation.verify(result.attestation))) {
      console.warn(`[Verification] Rejected unattested "verified" result for ${kind}.`);
      status = provider && provider.isDevelopment ? VStatus.DEMO : VStatus.NOT_CHECKED;
    }
    Store.update(s => {
      s.verification[kind] = { status, source: provider ? provider.id : null, note: result.note || null,
        authoritative: status === VStatus.VERIFIED, updatedAt: Date.now() };
      // Phase 1A never writes verifiedIdentity. A future server adapter must create it only after authoritative verification.
    });
  },
  async runDemoChecks(onProgress) {
    if (this.running) return;
    this.running = true;
    try {
      for (const kind of ['aadhaar', 'kyc', 'upi']) {
        const p = this.providers.get(kind);
        Store.update(s => { s.verification[kind] = Object.assign(blankVerification(), { status: VStatus.PENDING }); });
        if (onProgress) onProgress();
        this.record(kind, await p.check({ accountId: Store.state.account.accountId }), p);
        if (onProgress) onProgress();
      }
    } finally { this.running = false; if (onProgress) onProgress(); }
  },
  clearDemo() { Store.update(s => { for (const k of ['aadhaar', 'kyc', 'upi']) s.verification[k] = blankVerification(); }); },
  summary(s) {
    const statuses = ['aadhaar', 'kyc'].map(k => s.verification[k].status);
    if (statuses.every(x => x === VStatus.VERIFIED)) return { status: VStatus.VERIFIED, label: 'Identity verified' };
    if (statuses.some(x => x === VStatus.DEMO)) return { status: VStatus.DEMO, label: 'Demo checks only' };
    return { status: VStatus.NOT_CHECKED, label: 'Not verified yet' };
  }
};

/* =====================================================================
   8. IDENTITY / PROFILE
   Display name is self-declared. Verified legal identity is a separate,
   future server-only record and is never inferred from this profile.
   ===================================================================== */
const Identity = {
  create({ displayName, ageStatus }) {

/* =====================================================================
   10. ID ALLOCATION
   Permanent identifiers are name-independent. Display-name edits never
   reissue them. Production allocation moves server-side with uniqueness.
   ===================================================================== */
const LocalIdAllocator = {
  id: 'local-provisional-v2', authoritative: false,
  async allocate({ accountId, taken }) {
    for (let attempt = 0; attempt < 64; attempt++) {
      const a = Util.toCode(Util.hash53(`${accountId}|msg|${attempt}`), 8).toUpperCase();
      const messagingId = `BL-${a.slice(0,4)}-${a.slice(4,8)}`;
      if (!taken.has(messagingId)) {
        const m = Util.toCode(Util.hash53(`${accountId}|mail|${attempt}`), 10).toLowerCase();
        return { handle: messagingId, messagingId, mailId: `${m}@${CONFIG.MAIL_DOMAIN}`,
          allocatedBy: this.id, provisional: true, allocatedAt: Date.now(), attempt };
      }
    }
    throw new Error('Could not allocate a unique ID');
  }
};

const IdService = {
  allocator: LocalIdAllocator, inflight: null,
  allocateFor(state) {
    if (!this.inflight) this.inflight = this.allocator.allocate({ accountId: state.account.accountId, taken: Directory.takenHandles() }).finally(() => { this.inflight = null; });
    return this.inflight;
  }
};

/* =====================================================================
   13. PAYMENTS
   Initiation (UPI deep link, handled by the user's own UPI app) is kept
   strictly separate from verification (server confirmation via PSP/bank).
   PaymentVerifier interface: verify(request) -> Promise<{ available, status?, attestation? }>
   A client report is never treated as a verified result.
   ===================================================================== */
const PayStatus = Object.freeze({ CREATED: 'created', HANDED_OFF: 'handed_off',
  CLIENT_SUCCESS: 'client_reported_success', CLIENT_FAILURE: 'client_reported_failure', SERVER_VERIFIED: 'server_verified' });
const PayStatusMeta = Object.freeze({
  created:                 { label: 'Request created', tone: 'none' },
  handed_off:              { label: 'UPI hand-off attempted. Result unknown', tone: 'pending' },
  client_reported_success: { label: 'You reported: paid (unverified)', tone: 'pending' },
  client_reported_failure: { label: 'You reported: not paid', tone: 'failed' },
  server_verified:         { label: 'Confirmed by server', tone: 'verified' }
});
const PaymentVerifier = { id: 'none', available: false, async verify() { return { available: false }; } };

const Payments = {
  verifier: PaymentVerifier,
  list() { return Store.state.payments.requests; },
  get(id) { return Store.state.payments.requests.find(r => r.id === id) || null; },
  create({ payeeVpa, payeeName, amount, note }) {
    const now = Date.now();
    const req = { id: Util.uuid(), payeeVpa, payeeName: payeeName || null, amount, note: note || null,
      status: PayStatus.CREATED, beneficiaryTrust: VStatus.NOT_CHECKED, serverVerification: 'unavailable',
      trustSnapshot: Identity.trustSnapshot(), createdAt: now, updatedAt: now, history: [{ status: PayStatus.CREATED, at: now, by: 'client' }] };
    Store.update(s => {
      s.payments.requests.unshift(req);
      if (s.payments.requests.length > CONFIG.LIMITS.payments) s.payments.requests.length = CONFIG.LIMITS.payments;
    });
    return req.id;
  },
  setStatus(id, status, { attestation } = {}) {
    if (status === PayStatus.SERVER_VERIFIED && !Attestation.verify(attestation)) {
      console.warn('[Payments] Refused to mark a payment verified without a server attestation.');
      return false;
    }
    Store.update(s => {
      const r = s.payments.requests.find(x => x.id === id);
      if (!r) return;
      r.status = status; r.updatedAt = Date.now();
      r.history.push({ status, at: r.updatedAt, by: status === PayStatus.SERVER_VERIFIED ? 'server' : 'client' });
    });
    return true;
  },
  upiLink(req) {
    // Standard UPI intent parameters, URI-encoded. This only opens the user's UPI app.
    const p = [['pa', req.payeeVpa]];
    if (req.payeeName) p.push(['pn', req.payeeName]);
    p.push(['am', req.amount], ['cu', 'INR']);
    if (req.note) p.push(['tn', req.note]);
    return 'upi://pay?' + p.map(([k, v]) => `${k}=${encodeURIComponent(v).replace(/%40/g, '@')}`).join('&');
  }
};

const SAFE_HREF = /^(#|tel:|upi:|mailto:)/i;

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) { if (typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v); }
      else if (k === 'href') { if (SAFE_HREF.test(v)) el.setAttribute('href', v); }
      else if (k === 'value') el.value = v;
      else if (typeof v === 'boolean') el[k] = v;
      else el.setAttribute(k, String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
function svgEl(tag, attrs, children = []) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  children.forEach(c => el.appendChild(c));
  return el;
}

        h('option', { value: 'under_18' }, 'Under 18'),
        h('option', { value: '18_plus' }, '18+')
      );

        h('dl', { class: 'kv paycard section' },

          KvRow('Messaging ID', q.messaging_id || '—'),
          KvRow('BharatMail ID', q.bharatmail_address || '—'),

          KvRow('Age status', q.age_status || 'unknown'),
          KvRow('Mobile verified', q.mobile_verified ? 'Yes' : 'No'),
          KvRow('Aadhaar verified', q.aadhaar_verified ? 'Yes' : 'No'),
          KvRow('KYC verified', q.kyc_verified ? 'Yes' : 'No'),
          KvRow('UPI verified', q.upi_verified ? 'Yes' : 'No'),

        saveMsg.replaceChildren();
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        try {
          const updated = await Supabase.updateMyProfile({
            displayName: nameInput.value.trim() || null,
            ageStatus: ageSelect.value
          });
          if (!updated) throw new Error('No updated profile was returned.');
          renderProfile(updated);
          nameInput.value = updated.display_name || '';
          ageSelect.value = updated.age_status || 'unknown';
          saveMsg.replaceChildren(Notice('info', 'Profile saved to Supabase successfully.'));
        } catch (ex) {
          saveMsg.replaceChildren(Notice('warn', `Profile save failed: ${ex.message || 'Unknown error'}`));
        } finally {
          saveBtn.disabled = false; saveBtn.textContent = 'Save profile to Supabase';
        }
      }});

      const verifyBtn = Button('Run Phase 1B checks', { variant: 'secondary', onClick: async () => {
        saveMsg.replaceChildren();
        verifyBtn.disabled = true; verifyBtn.textContent = 'Checking…';
        try {
          const before = await Supabase.myProfile();
          if (!before) throw new Error('Profile could not be loaded.');
          const required = ['user_id','account_id','messaging_id','bharatmail_address'];
          const missing = required.filter(k => !before[k]);
          if (missing.length) throw new Error(`Missing server fields: ${missing.join(', ')}`);

          const ids = {
            account_id: before.account_id,
            messaging_id: before.messaging_id,
            bharatmail_address: before.bharatmail_address
          };

          // Read twice from the server and verify permanent IDs do not drift.
          const again = await Supabase.myProfile();
          const stable = again &&
            again.account_id === ids.account_id &&
            again.messaging_id === ids.messaging_id &&
            again.bharatmail_address === ids.bharatmail_address;
          if (!stable) throw new Error('Permanent server IDs changed unexpectedly.');

          saveMsg.replaceChildren(Notice('info', [
            h('strong', null, 'Phase 1B checks PASS.'), h('br'),
            'Authenticated profile read works; Account ID, Messaging ID and BharatMail ID are present and stable. ',
            'Profile UPDATE is scoped to the signed-in user. Trust fields are not included in client updates.'
          ]));
        } catch (ex) {
          saveMsg.replaceChildren(Notice('warn', `Phase 1B check failed: ${ex.message || 'Unknown error'}`));
        } finally {
          verifyBtn.disabled = false; verifyBtn.textContent = 'Run Phase 1B checks';
        }
      }});

      const e2eeMsg = h('div', { 'aria-live': 'polite' });
      const activateE2EE = Button('Activate E2EE on this browser', { variant: 'secondary', onClick: async () => {
        activateE2EE.disabled=true; e2eeMsg.replaceChildren();

        catch(ex){ e2eeMsg.replaceChildren(Notice('warn', `E2EE activation failed: ${ex.message||'Unknown error'}`)); }
        finally { activateE2EE.disabled=false; }
      }});
      const e2eeText = h('input', { class:'input', type:'text', maxlength:'5000', placeholder:'Encrypted test message' });
      const sendE2EE = Button('Send encrypted backend test', { onClick: async () => {
        const text=e2eeText.value.trim(); if(!text){ e2eeMsg.replaceChildren(Notice('warn','Enter a test message.')); return; }
        sendE2EE.disabled=true; e2eeMsg.replaceChildren();
        try { const r=await E2EEBackend.sendV2(text); e2eeText.value=''; e2eeMsg.replaceChildren(Notice('info', `Encrypted message stored with ${r.envelopeCount} device envelope(s). No plaintext was sent.`)); }
        catch(ex){ e2eeMsg.replaceChildren(Notice('warn', `Encrypted send failed: ${ex.message||'Unknown error'}`)); }
        finally { sendE2EE.disabled=false; }
      }});

      status.replaceChildren(
        Notice('info', [h('strong', null, 'Supabase profile connected successfully.'), h('br'),
          'Phone OTP remains disabled for now.']),
        profileBox,
        h('div', { class: 'section' },
          h('h2', null, 'Profile update test'),
          h('div', { class: 'field' }, h('label', null, 'Display name'), nameInput),
          h('div', { class: 'field' }, h('label', null, 'Age status'), ageSelect),
          saveBtn, verifyBtn, saveMsg),
        h('div', { class: 'section' },
          h('h2', null, 'Phase 1B E2EE backend test'),
          h('p', { class: 'hint' }, 'Private key stays non-extractable in this browser. Activate E2EE on both test accounts before sending.'),
          activateE2EE, e2eeText, sendE2EE, e2eeMsg),
        Button('Sign out test session', { variant: 'secondary', onClick: () => {
          Supabase.clearTestSession();
          status.replaceChildren(Notice('info', 'Test session cleared. Sign in again to confirm the saved profile persists.'));
        }})
      );
    };

    const form = h('form', { novalidate: 'novalidate', onSubmit: async e => {
      e.preventDefault(); emailErr.textContent = ''; passErr.textContent = ''; status.replaceChildren();
      const ev = email.value.trim();
      if (!ev || !ev.includes('@')) { emailErr.textContent = 'Enter a valid test email.'; return; }
      if (!password.value) { passErr.textContent = 'Enter the test account password.'; return; }
      btn.disabled = true; btn.textContent = 'Connecting…';
      try {
        await Supabase.signInWithPassword(ev, password.value);
        password.value = '';

        if (!profile) throw new Error('Signed in, but no profile row was returned.');
        showProfile(profile);
      } catch (ex) {
        Supabase.clearTestSession();
        status.replaceChildren(Notice('warn', `Test login failed: ${ex.message || 'Unknown error'}`));
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in & test Supabase';
      }
    }},
      h('div', { class: 'field' }, h('label', { for: 'test-email' }, 'Test account email'), email, emailErr),
      h('div', { class: 'field' }, h('label', { for: 'test-password' }, 'Password'), password, passErr), btn);

    setTimeout(async () => {
      if (!Supabase.restoreTestSession()) return;
      try { const p = await Supabase.syncMyProfile(); if (p) { showProfile(p); if (Router.current() !== '/test-login') App.refresh(); } }
      catch (_) { Supabase.clearTestSession(); }

    return Screen({ title: 'Phase 1B test login', back: backRoute, children: [
      Notice('dev', [h('strong', null, 'Temporary testing only. '),
        'Use an existing Supabase email test account. Do not share its password in chat.']),

  otp() {

    const resendBtn = Button('Resend code', { variant: 'ghost' });
    const tick = () => {
      const wait = Math.ceil((P.resendAvailableAt - Date.now()) / 1000);
      resendBtn.disabled = wait > 0;
      resendBtn.textContent = wait > 0 ? `Resend code in ${wait}s` : 'Resend code';
    };
    tick();
    const iv = setInterval(tick, 1000); Lifecycle.add(() => clearInterval(iv));
    resendBtn.addEventListener('click', async () => { await Auth.resend(); Toast.show('New test code created'); App.render(); });

    const form = h('form', { novalidate: 'novalidate', onSubmit: async e => {

      btn.disabled = true;

      if (r.ok) return Router.go('/setup', { replace: true });
      btn.disabled = false;
      const msg = {
        mismatch: `That code doesn\u2019t match. ${r.attemptsLeft} ${r.attemptsLeft === 1 ? 'attempt' : 'attempts'} left.`,
        expired: 'This code has expired. Request a new one.',
        locked: 'Too many wrong attempts. Request a new code.',
        no_session: 'This code is no longer valid. Request a new one.'
      }[r.reason] || 'The code could not be checked.';
      if (r.reason !== 'mismatch') { clearInterval(iv); btn.disabled = true; resendBtn.disabled = false; resendBtn.textContent = 'Request a new code'; }
      setError(err, input, msg);
    } }, Field({ id: 'otp', label: 'One-time code', input, error: err }), btn);

    return Screen({ title: 'Enter the code', back: '/mobile', children: [
      h('p', { class: 'lede' }, `Code for ${Util.formatMobile(P.mobile)}.`),

  /* ----- Verified Messaging ----- */
  chats() {
    const convs = Messaging.list();
    const backend = h('div', { class:'stack' });
    const groupsBox = h('div', { class:'stack' });
    let backendLoading=false;
    let showArchived=false;
    // Phase 1G list hardening: never load/decrypt all encrypted messages just to build Messages.
    // Each direct conversation fetches only its newest visible message via the bounded
    // conversation-specific RPC. This keeps old inline-media history off the list path.
    const archiveId=row=>row?.conversation_id||row?.id||row?.conversation?.conversation_id||null;
    const loadBackend = async () => {
      if(backendLoading)return;
      backendLoading=true;
      backend.replaceChildren();
      if (!Supabase.accessToken) {
        backend.appendChild(Notice('info', 'Sign in from Identity → Phase 1B test session to use encrypted BharathLink messaging.'));
        backend.appendChild(Button('Sign in for encrypted messaging', { icon:'lock', onClick:()=>Router.go('/test-login') }));
        backendLoading=false;
        return;
      }
      backend.appendChild(h('p',{class:'hint'},'Loading encrypted conversations…'));
      try {
        const [rows,archivedRows,pinnedRows,manualUnreadRows,deletedRows] = await Promise.all([
          E2EEBackend.directConversations(),
          E2EEBackend.getMyArchivedConversations(),
          E2EEBackend.getMyPinnedConversations(),
          E2EEBackend.getMyUnreadConversations(),
          E2EEBackend.getMyDeletedConversations()
        ]);
        const archivedIds=new Set(archivedRows.map(archiveId).filter(Boolean));
        const pinnedIds=new Set(pinnedRows.map(archiveId).filter(Boolean));
        const manualUnreadIds=new Set(manualUnreadRows.map(archiveId).filter(Boolean));
        const deletedAt=new Map(deletedRows.map(r=>[archiveId(r),r?.deleted_at||'']).filter(([id])=>id));
        const pinnedAt=new Map(pinnedRows.map(r=>[archiveId(r),r?.pinned_at||'']).filter(([id])=>id));
        const enrich=async cv=>{
          let cutoff=null;
          try{cutoff=await E2EEBackend.getConversationClearCutoff(cv.conversation_id);}catch(_){}
          const deleteCutoff=deletedAt.get(cv.conversation_id)||null;
          // Use the later of Clear Chat / Delete Chat as the visibility floor, then fetch newest 1 only.
          const floor=[cutoff,deleteCutoff].filter(Boolean).sort((a,b)=>new Date(b)-new Date(a))[0]||null;
          let msgs=[];
          try{msgs=await E2EEBackend.receiveV2(cv.conversation_id,floor,true,1);}catch(_){}
          const last=msgs[msgs.length-1]||null;
          let unread=0;
          try{unread=await E2EEBackend.unreadCount(cv.conversation_id);}catch(_){}
          if(!last)unread=0;
          const hiddenByDelete=!!deleteCutoff&&!last;
          return {...cv,last,unread,clearCutoff:cutoff,hiddenByDelete};
        };
        const allById=new Map(rows.map(cv=>[cv.conversation_id,cv]));
        archivedRows.forEach(a=>{
          const id=archiveId(a);
          if(id&&!allById.has(id))allById.set(id,a.conversation||a);
        });
        const enriched=await Promise.all([...allById.values()].filter(cv=>cv?.conversation_id).map(enrich));
        enriched.sort((a,b)=>new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0));
        const visibleConvs=enriched.filter(cv=>!cv.hiddenByDelete);
        const active=visibleConvs.filter(cv=>!archivedIds.has(cv.conversation_id));
        active.sort((a,b)=>{
          const ap=pinnedIds.has(a.conversation_id),bp=pinnedIds.has(b.conversation_id);
          if(ap!==bp)return ap?-1:1;
          if(ap&&bp)return new Date(pinnedAt.get(b.conversation_id)||0)-new Date(pinnedAt.get(a.conversation_id)||0);
          return new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0);
        });
        const archived=visibleConvs.filter(cv=>archivedIds.has(cv.conversation_id));

        const rowNode=cv=>{
          const name=cv.peer_display_name||'BharathLink user';
          const sub=cv.last?(cv.last.decryptOk?cv.last.text:'Encrypted message'):(cv.peer_messaging_id||'Encrypted direct conversation');
          const time=cv.last?new Date(cv.last.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
          const isManualUnread=manualUnreadIds.has(cv.conversation_id);
          const trail=h('div',{style:'display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:48px'},
            time?h('span',{class:'hint',style:'margin:0;white-space:nowrap'},time):null,
            cv.unread>0?h('span',{style:'min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--text);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700'},String(cv.unread)):
            (isManualUnread?h('span',{'aria-label':'Marked unread',title:'Marked unread',style:'width:10px;height:10px;border-radius:999px;background:var(--text);display:inline-block'},''):null));
          return ListRow({href:`/e2ee-chat/${cv.conversation_id}`,avatar:Avatar(name),
            title:[name,StatusBadge(VStatus.NOT_CHECKED,'E2EE'),(!showArchived&&pinnedIds.has(cv.conversation_id)?h('span',{'aria-label':'Pinned chat',title:'Pinned chat',style:'font-size:13px'},'📌'):null)],sub,trail});
        };

        backend.replaceChildren(Notice('info','BharathLink conversations below use the E2EE v2 backend. Sample contacts remain local demo chats.'));
        if(archived.length){
          const archivedToggle=h('button',{type:'button',class:'btn btn--ghost',style:'width:100%;max-width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;box-sizing:border-box;touch-action:manipulation'},
            h('span',{style:'min-width:0;white-space:nowrap'},'Archived'),
            h('span',{class:'hint',style:'margin:0;white-space:nowrap'},String(archived.length)));
          archivedToggle.addEventListener('click',()=>{showArchived=!showArchived;loadBackend();});
          backend.appendChild(archivedToggle);
        }
        const visible=showArchived?archived:active;
        if(showArchived){
          backend.appendChild(h('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:8px'},
            h('strong',null,'Archived chats'),
            h('button',{type:'button',class:'btn btn--ghost',style:'width:auto;min-width:0;padding:7px 10px',onClick:()=>{showArchived=false;loadBackend();}},'Back')));
        }
        if(!visible.length){
          backend.appendChild(h('div',{class:'empty'},h('p',null,showArchived?'No archived conversations.':'No backend direct conversations yet.')));
        }else{
          backend.appendChild(h('ul',{class:'list'},...visible.map(rowNode)));
        }
      } catch(ex) {
        backend.replaceChildren(Notice('warn', ex.message || 'Could not load encrypted conversations.'));
      } finally { backendLoading=false; }
    };
    const loadGroups=async()=>{
      groupsBox.replaceChildren();
      if(!Supabase.accessToken){groupsBox.appendChild(h('p',{class:'hint'},'Sign in to create and view groups.'));return;}
      try{
        const [groups,deletedRows]=await Promise.all([E2EEBackend.getMyGroups(),E2EEBackend.getMyDeletedConversations()]);
        groupsBox.appendChild(Button('Create group',{icon:'plus',variant:'secondary',onClick:()=>Router.go('/groups/new')}));
        const deletedAt=new Map(deletedRows.map(r=>[archiveId(r),r?.deleted_at||'']).filter(([id])=>id));
        const visibleGroups=[];
        for(const g of groups){
          const cutoff=deletedAt.get(g.conversation_id)||null;
          if(!cutoff){visibleGroups.push(g);continue;}
          // A deleted group stays hidden only until a genuinely newer encrypted
          // message exists. The bounded conversation RPC stops at the cutoff,
          // so we do not reload/decrypt the old group history just to build the list.
          try{
            const newer=await E2EEBackend.receiveV2(g.conversation_id,cutoff);
            if(newer.length)visibleGroups.push(g);
          }catch(_){/* keep a user-deleted group hidden if the freshness check fails */}
        }
        if(!visibleGroups.length){groupsBox.appendChild(h('div',{class:'empty'},h('p',null,'No groups yet.')));return;}
        groupsBox.appendChild(h('ul',{class:'list'},...visibleGroups.map(g=>ListRow({href:`/group-chat/${g.conversation_id}`,avatar:Avatar(g.group_name||'Group'),title:[g.group_name||'Group',StatusBadge(VStatus.NOT_CHECKED,g.my_role==='admin'?'Admin':'Member')],sub:'End-to-end encrypted group chat'}))));
      }catch(ex){groupsBox.replaceChildren(Notice('warn',ex.message||'Could not load groups.'));}
    };
    const node = Screen({ title: 'Messages', back: '/home', nav: 'chats',
      actions: [IconButton('plus', 'New message', () => Router.go('/chats/new'))], children: [
      Section('Encrypted conversations', backend),
      Section('Groups', groupsBox),
      Section('Sample chats',
        convs.length
          ? h('ul', { class: 'list' }, convs.map(cv => {
              const c = Directory.byId(cv.contactId) || { displayName: 'Unknown' };
              const last = cv.messages[cv.messages.length - 1];
              return ListRow({ href: `/chat/${cv.id}`, avatar: Avatar(c.displayName),
                title: [c.displayName, StatusBadge(VStatus.DEMO, 'Sample')],
                sub: last ? last.text : 'No messages yet', trail: last ? Util.time(last.at) : null });
            }))
          : h('div', { class: 'empty' }, h('p', null, 'No sample conversations yet.'),
              Button('New sample message', { icon: 'plus', onClick: () => Router.go('/chats/new') }))
      )] });
    setTimeout(loadBackend,0);
    setTimeout(loadGroups,0);
    // Phase 1E.4: keep an already-open Messages screen fresh without reload.
    // Polling is used by this standalone no-SDK build; it stops automatically
    // as soon as the Messages screen leaves the DOM.
    const liveTimer=setInterval(()=>{
      if(!document.body.contains(node)){clearInterval(liveTimer);return;}
      loadBackend();
    },15000);
    Lifecycle.add(()=>clearInterval(liveTimer));
    return node;
  },

    const c = cv && Directory.byId(cv.contactId);
    if (!cv || !c) return Views.notFound('/chats');
    const bubble = m => h('div', { class: 'bubble' }, m.text,
      h('span', { class: 'bubble__meta' }, m.encrypted ? `${Util.time(m.at)}, encrypted backend` : `${Util.time(m.at)}, saved on device`));
    const empty = h('p', { class: 'hint', hidden: cv.messages.length > 0 }, 'No messages yet.');
    const list = h('div', { class: 'messages', 'aria-label': 'Messages', role: 'log' }, cv.messages.map(bubble));
    const err = ErrorText('chat-err');
    const box = h('textarea', { class: 'input', id: 'composer', rows: '1', maxlength: String(CONFIG.LIMITS.chatText),
      placeholder: 'Write a message', 'aria-label': 'Message', 'aria-describedby': 'chat-err' });
    box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = `${Math.min(box.scrollHeight, 140)}px`; });
    const composer = h('form', { class: 'composer', novalidate: 'novalidate', onSubmit: async e => {
      e.preventDefault(); err.textContent = '';
      const v = Validate.text(box.value, CONFIG.LIMITS.chatText, 'message');
      if (!v.ok) { err.textContent = v.error; return; }
      const sendBtn = e.currentTarget.querySelector('.sendbtn');
      if (sendBtn) sendBtn.disabled = true;
      try {
        const m = await Messaging.send(id, v.value);
        empty.hidden = true;
        list.appendChild(bubble(m)); box.value = ''; box.style.height = 'auto'; box.focus();
        list.lastChild.scrollIntoView({ block: 'end' });
      } catch (ex) {
        err.textContent = ex.message || 'Encrypted send failed.';
      } finally {
        if (sendBtn) sendBtn.disabled = false;
      }
    } }, box, h('button', { class: 'sendbtn', type: 'submit', 'aria-label': 'Send message' }, Icon('send', 22)));
    const node = Screen({ title: c.displayName, back: '/chats',
      actions: [IconButton('phone', `Call ${c.displayName}`, () => Router.go(`/call/${c.id}`))],
      footer: composer, children: [
        h('div', { class: 'chat-meta' }, StatusBadge(VStatus.DEMO, 'Sample contact'), h('span', null, `${c.messagingId}, ${c.city}`)),
        Notice('warn', 'Sample contact chat: saved only on this device. Use Encrypted test chat from Messages for the backend E2EE test.'),
        err, empty, list] });
    setTimeout(() => { if (list.lastChild) list.lastChild.scrollIntoView({ block: 'end' }); }, 0);
    return node;
  },

  e2eeSignalChannel(conversationId, onWake, onStatus=null) {
    let ws=null,joined=false,ref=0,heartbeat=null,wakeTimer=null,reconnectTimer=null,closed=false,reconnectAttempt=0,joinRef=null;
    let pendingOutboundWake=false,heartbeatRef=null,heartbeatWatch=null,everJoined=false;
    const wakeAckRefs=new Map();
    const topic=`realtime:bl-signal-${conversationId}`;

    const sendTopic=(sock,event,payload={},forcedRef=null)=>{const r=forcedRef||nextRef();return sendFrame(sock,{topic,event,payload,ref:r})?r:false;};
    const clearHeartbeatWatch=()=>{clearTimeout(heartbeatWatch);heartbeatWatch=null;heartbeatRef=null;};
    const clearWakeAcks=()=>{for(const v of wakeAckRefs.values())clearTimeout(v.timer);wakeAckRefs.clear();};
    const scheduleReconnect=()=>{
      if(closed||reconnectTimer)return;
      joined=false;clearInterval(heartbeat);heartbeat=null;clearHeartbeatWatch();
      const delay=Math.min(8000,400*Math.pow(2,Math.min(reconnectAttempt++,4)));
      reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect();},delay);
    };
    const retireSocket=(sock)=>{
      if(!sock)return;
      try{sock.onopen=sock.onmessage=sock.onerror=sock.onclose=null;sock.close();}catch(_){}
    };
    const forceReconnect=(reason='reconnect')=>{
      if(closed)return;
      status('reconnecting',reason);joined=false;clearInterval(heartbeat);heartbeat=null;clearHeartbeatWatch();clearWakeAcks();
      const old=ws; if(old===ws)ws=null; retireSocket(old); scheduleReconnect();
    };
    const sendWakeAttempt=()=>{
      const sock=ws;
      if(!joined||!sock||sock.readyState!==1){status('wake-not-ready');return false;}
      const r=sendTopic(sock,'broadcast',{type:'broadcast',event:'new_message',payload:{v:4}});
      if(!r){status('wake-not-ready');return false;}
      const started=performance.now();
      const timer=setTimeout(()=>{
        const rec=wakeAckRefs.get(r);if(!rec||closed)return;

      },2500);

        heartbeatWatch=setTimeout(()=>{if(sock===ws&&heartbeatRef===r)forceReconnect('heartbeat timeout');},10000);
      },25000);
    };
    const connect=()=>{
      if(closed)return;
      joined=false;
      try{
        const u=new URL(CONFIG.SUPABASE_URL);
        const wsUrl=`wss://${u.host}/realtime/v1/websocket?apikey=${encodeURIComponent(CONFIG.SUPABASE_PUBLISHABLE_KEY)}&vsn=1.0.0`;

          }

      wake(){

        setTimeout(()=>{if(!closed&&joined)sendWakeAttempt();},350);

      },

        closed=true;joined=false;pendingOutboundWake=false;clearInterval(heartbeat);clearTimeout(wakeTimer);clearTimeout(reconnectTimer);clearHeartbeatWatch();clearWakeAcks();
        const old=ws;ws=null;try{if(old&&old.readyState===1)sendTopic(old,'phx_leave',{});}catch(_){}retireSocket(old);
      }
    };
  },

  e2eeTypingChannel(conversationId, onTyping) {
    let ws=null, joined=false, ref=0, stopTimer=null, heartbeat=null, closed=false;
    const topic=`realtime:bl-typing-${conversationId}`;
    const send=(event,payload={})=>{
      if(!ws||ws.readyState!==1)return;
      ws.send(JSON.stringify({topic,event,payload,ref:String(++ref)}));
    };
    try{
      const u=new URL(CONFIG.SUPABASE_URL);
      const wsUrl=`wss://${u.host}/realtime/v1/websocket?apikey=${encodeURIComponent(CONFIG.SUPABASE_PUBLISHABLE_KEY)}&vsn=1.0.0`;
      ws=new WebSocket(wsUrl);
      ws.onopen=()=>{
        send('phx_join',{config:{broadcast:{ack:false,self:false},presence:{enabled:false},postgres_changes:[]},access_token:Supabase.accessToken||''});
        heartbeat=setInterval(()=>send('heartbeat',{},'phoenix'),25000);
      };
      ws.onmessage=e=>{
        let m;try{m=JSON.parse(e.data);}catch(_){return;}
        if(m.event==='phx_reply'&&m.topic===topic){joined=true;return;}
        if(m.topic===topic&&m.event==='broadcast'&&m.payload?.event==='typing'){
          onTyping(!!m.payload?.payload?.typing);
          clearTimeout(stopTimer);
          if(m.payload?.payload?.typing)stopTimer=setTimeout(()=>onTyping(false),2200);
        }
      };
    }catch(_){ }
    return {
      typing(value){if(joined)send('broadcast',{type:'broadcast',event:'typing',payload:{typing:!!value}});},
      close(){closed=true;clearInterval(heartbeat);clearTimeout(stopTimer);try{if(ws&&ws.readyState===1)send('phx_leave',{});ws?.close();}catch(_){}}
    };
  },

    const to = mk('to', { type: 'email', autocomplete: 'email', autocapitalize: 'none', spellcheck: 'false', maxlength: '254' });
    const subject = mk('subject', { maxlength: String(CONFIG.LIMITS.mailSubject) });
    const body = h('textarea', { class: 'input', id: 'body', rows: '8', maxlength: String(CONFIG.LIMITS.mailBody), 'aria-describedby': 'body-err' });
    const eTo = ErrorText('to-err'), eSub = ErrorText('subject-err'), eBody = ErrorText('body-err');
    const form = h('form', { novalidate: 'novalidate', onSubmit: async e => {
      e.preventDefault();
      [[eTo, to], [eSub, subject], [eBody, body]].forEach(([er, i]) => setError(er, i, ''));
      const vTo = Validate.email(to.value), vSub = Validate.text(subject.value, CONFIG.LIMITS.mailSubject, 'subject'),
        vBody = Validate.text(body.value, CONFIG.LIMITS.mailBody, 'message');
      if (!vBody.ok) setError(eBody, body, vBody.error);
      if (!vSub.ok) setError(eSub, subject, vSub.error);
      if (!vTo.ok) setError(eTo, to, vTo.error);
      if (!vTo.ok || !vSub.ok || !vBody.ok) return;
      await Mail.send({ to: vTo.value, subject: vSub.value, body: vBody.value });
      Mail.folder = 'sent';
      Toast.show('Saved to Sent. Not delivered: mail delivery isn\u2019t connected yet.');
      Router.go('/mail', { replace: true });
    } },
      Field({ id: 'from', label: 'From', input: h('input', { class: 'input', id: 'from', type: 'text', readonly: 'readonly', value: s.ids.mailId }) }),
      Field({ id: 'to', label: 'To', input: to, error: eTo }),
      Field({ id: 'subject', label: 'Subject', input: subject, error: eSub }),
      Field({ id: 'body', label: 'Message', input: body, error: eBody }),
      Notice('warn', 'Delivery isn\u2019t connected. Your message will be saved in Sent on this device and won\u2019t reach the recipient.'),
      Button('Save to Sent', { type: 'submit' }));
    return Screen({ title: 'New mail', back: '/mail', children: [form] });
  },

  mailMessage(id) {
    const m = Mail.get(id);
    if (!m) return Views.notFound('/mail');
    return Screen({ title: m.folder === 'sent' ? 'Sent mail' : 'Inbox', back: '/mail', children: [
      h('h2', { class: 'mailview__subject' }, m.subject),
      h('dl', { class: 'kv paycard' },
        KvRow('From', m.from), KvRow('To', m.to), KvRow('Time', Util.dateTime(m.at)),
        m.folder === 'sent' ? KvRow('Delivery', ToneBadge('none', 'Not delivered')) : null),
      h('div', { class: 'mailview__body' }, m.body)] });
  },

  /* ----- UPI / Verified Payment ----- */
  pay() {
    const reqs = Payments.list(), sum = Verification.summary(Store.state);
    const step = (title, badge, text) => h('li', null, h('div', { class: 'steps__body' },
      h('span', { class: 'steps__title' }, title), badge, h('span', { class: 'hint' }, text)));
    return Screen({ title: 'UPI / Verified Payment', back: '/home', nav: 'pay', children: [
      h('p', { class: 'lede' }, 'You pay in your own UPI app. BharathLink prepares the request and shows what it knows about who you\u2019re paying.'),
      Section('How a payment works',
        h('ol', { class: 'steps' },
          step('Your identity', StatusBadge(sum.status, sum.label), 'Your trust card is attached to the request.'),
          step('Payment request', ToneBadge('verified', 'Available'), 'Enter a UPI ID and amount.'),
          step('Beneficiary trust', StatusBadge(VStatus.NOT_CHECKED, 'Not connected'), 'Checking who owns a UPI ID needs an authorised provider.'),
          step('UPI authorisation', ToneBadge('none', 'In your UPI app'), 'You approve with your UPI PIN in your own app. BharathLink never sees it.'),
          step('Verified result', StatusBadge(VStatus.NOT_CHECKED, 'Not connected'), 'Confirmation needs a server link to your bank or payment provider.'))),
      h('div', { class: 'section' }, LinkButton('New payment request', '#/pay/new', { icon: 'plus' })),
      reqs.length ? Section('Your requests', h('ul', { class: 'list' }, reqs.map(r => ListRow({
        href: `/pay/${r.id}`, title: Util.rupees(r.amount), sub: `To ${r.payeeVpa}`,
        trail: ToneBadge(PayStatusMeta[r.status].tone, PayStatusMeta[r.status].label) })))) : null] });
  },

  payNew() {
    const mk = (id, label, extra, hint) => {
      const input = h('input', Object.assign({ class: 'input', id, type: 'text', 'aria-describedby': `${id}-err` }, extra));
      const err = ErrorText(`${id}-err`);
      return { input, err, field: Field({ id, label, input, error: err, hint }) };
    };
    const vpa = mk('vpa', 'Payee UPI ID', { autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', maxlength: '256', placeholder: 'name@bank' });
    const name = mk('payee', 'Payee name (optional)', { autocomplete: 'off', maxlength: '60' }, 'As you know them. This is not checked.');
    const amt = mk('amount', 'Amount in rupees', { inputmode: 'decimal', autocomplete: 'off', maxlength: '9', placeholder: '0.00' });
    const note = mk('note', 'Note (optional)', { autocomplete: 'off', maxlength: String(CONFIG.LIMITS.payNote) });
    const form = h('form', { novalidate: 'novalidate', onSubmit: e => {
      e.preventDefault(); [vpa, name, amt, note].forEach(f => setError(f.err, f.input, ''));
      const vV = Validate.vpa(vpa.input.value), vA = Validate.amount(amt.input.value);
      const vN = name.input.value.trim() ? Validate.displayName(name.input.value) : { ok: true, value: '' };
      const vT = Validate.text(note.input.value.replace(/\n/g, ' '), CONFIG.LIMITS.payNote, 'note', { required: false });
      if (!vT.ok) setError(note.err, note.input, vT.error);
      if (!vA.ok) setError(amt.err, amt.input, vA.error);
      if (!vN.ok) setError(name.err, name.input, vN.error);
      if (!vV.ok) setError(vpa.err, vpa.input, vV.error);
      if (!vV.ok || !vA.ok || !vN.ok || !vT.ok) return;
      const id = Payments.create({ payeeVpa: vV.value, payeeName: vN.value, amount: vA.value, note: vT.value });
      Router.go(`/pay/${id}`, { replace: true });
    } }, vpa.field, name.field, amt.field, note.field, Button('Review request', { type: 'submit' }));
    return Screen({ title: 'New payment request', back: '/pay', children: [form] });
  },

  payRequest(id) {
    const r = Payments.get(id);
    if (!r) return Views.notFound('/pay');
    const meta = PayStatusMeta[r.status];
    const reported = r.status === PayStatus.CLIENT_SUCCESS || r.status === PayStatus.CLIENT_FAILURE;
    const report = status => () => { Payments.setStatus(r.id, status); App.refresh(); };
    return Screen({ title: 'Payment request', back: '/pay', children: [
      h('div', { class: 'paycard' },
        h('p', { class: 'hint' }, 'Amount'), h('p', { class: 'amount' }, Util.rupees(r.amount)),
        h('dl', { class: 'kv' },
          KvRow('To UPI ID', r.payeeVpa),
          r.payeeName ? KvRow('Name you entered', r.payeeName) : null,
          r.note ? KvRow('Note', r.note) : null)),
      Section('Beneficiary trust', StatusBadge(VStatus.NOT_CHECKED),
        h('p', { class: 'hint section' }, 'BharathLink can\u2019t yet confirm who owns this UPI ID. Your UPI app will show the registered name. Check it before you approve.')),
      Section('Pay in your UPI app',
        LinkButton('Open UPI app', Payments.upiLink(r), { icon: 'rupee', onClick: () => {
          if (r.status === PayStatus.CREATED) setTimeout(() => { Payments.setStatus(r.id, PayStatus.HANDED_OFF); App.refresh(); }, 300);
        } }),
        h('p', { class: 'hint section' }, 'Works on a phone with a UPI app installed. Opening the app does not mean money was sent.'),
        r.status === PayStatus.CREATED ? Button('I tried opening my UPI app', { variant: 'ghost', onClick: report(PayStatus.HANDED_OFF) }) : null),
      Section('Result',
        h('dl', { class: 'kv paycard' },
          KvRow('Status', ToneBadge(meta.tone, meta.label)),
          KvRow('Server verification', StatusBadge(VStatus.NOT_CHECKED, 'Not available in this build'))),
        r.status !== PayStatus.CREATED ? h('div', { class: 'stack section' },
          h('p', { class: 'hint' }, reported
            ? 'Reported by you. Not confirmed by your bank, NPCI or BharathLink. Check your UPI app or bank statement for the real result.'
            : 'If a UPI app opened, what result did it show? Your answer is only a local, unverified report.'),
          h('div', { class: 'btn-row' },
            Button('It showed paid', { variant: 'secondary', disabled: r.status === PayStatus.CLIENT_SUCCESS, onClick: report(PayStatus.CLIENT_SUCCESS) }),
            Button('It failed', { variant: 'secondary', disabled: r.status === PayStatus.CLIENT_FAILURE, onClick: report(PayStatus.CLIENT_FAILURE) }))) : null)] });
  },

  /* ----- E2EE V2 device registration test (test build only) ----- */
  e2eeV2Test() {
    const T = E2EEV2DeviceTest, r = T.result;
    if (!r && !T.running && !T.autoRan) { T.autoRan = true; setTimeout(() => T.run(), 0); }
    const badge = st => st === 'pass' ? ToneBadge('verified', 'PASS') : st === 'fail' ? ToneBadge('failed', 'FAIL')
      : st === 'pending' ? ToneBadge('pending', 'Running\u2026') : st === 'skip' ? ToneBadge('none', 'Skipped') : ToneBadge('none', 'Not run');
    const overall = !r ? null : T.running ? 'pending' : (r.auth === 'pass' && r.keys === 'pass' && r.rpc === 'pass' ? 'pass' : 'fail');
    const details = r ? [
      r.userId ? KvRow('User ID', r.userId) : null,
      r.returnedId ? KvRow('Returned device ID', r.returnedId) : null,
      KvRow('Curve25519 test key', 'X25519 (WebCrypto, test only)'),
      r.signingAlg ? KvRow('Signing test key', r.signingAlg === 'Ed25519' ? 'Ed25519 (WebCrypto, test only)' : 'ECDSA P-256 (WebCrypto fallback, test only)') : null,
      r.sentParams.length ? KvRow('Parameters sent', r.sentParams.join(', ')) : null,
      r.server ? KvRow('Server response', r.server) : null
    ] : [];
    return Screen({ title: 'E2EE V2 device test', back: '/identity', nav: 'identity', children: [
      Notice('dev', [h('strong', null, 'Test build only. '),
        'Checks your current sign-in, local key generation and the V2 device registration RPC. These are temporary WebCrypto test keys for backend plumbing only, not production V2 keys, and there is no Double Ratchet here. Private keys never leave this device. V1 messaging is not changed.']),
      h('dl', { class: 'kv paycard section', 'aria-live': 'polite' },
        KvRow('Authenticated user', badge(r?.auth)),
        KvRow('Local key generation', badge(r?.keys)),
        KvRow('V2 device registration RPC', badge(r?.rpc)),
        KvRow('Device ID', r?.deviceId || '\u2014'),
        KvRow('Overall', badge(overall))),
      r && (details.some(Boolean) || r.notes.length) ? Section('Details',
        h('dl', { class: 'kv paycard' }, details),
        r.notes.length ? h('div', { class: 'stack section' }, r.notes.map(n => h('p', { class: 'hint' }, n))) : null) : null,
      h('div', { class: 'btn-row section' },
        Button(T.running ? 'Running\u2026' : 'Run test again', { disabled: T.running, onClick: () => T.run() }),
        Button('Forget local test device', { variant: 'ghost', disabled: T.running || !r?.deviceId, onClick: async () => {
          if (!window.confirm('Delete the local test device and its test keys from this browser? Its server registration stays until revoked.')) return;
          try { await T.forget(); Toast.show('Local test device deleted.'); } catch (e) { Toast.show(e.message || 'Could not delete the local test device.'); }
        } }))
    ] });
  },

  notFound(back) {
    return Screen({ title: 'Not found', back, children: [h('div', { class: 'empty' }, h('p', null, 'This item doesn\u2019t exist on this device.'),
      Button('Go back', { onClick: () => Router.go(back, { replace: true }) }))] });
  }
};

/* =====================================================================
   16. ROUTER (hash-based, so browser and Android back work)
   Each route declares the onboarding stage it belongs to; the guard in
   App.render redirects to the right screen for the account's stage.
   ===================================================================== */
const ROUTES = [
  { re: /^\/welcome$/,           stage: 'auth',    view: () => Views.welcome() },
  { re: /^\/mobile$/,            stage: 'auth',    view: () => Views.mobile() },
  { re: /^\/otp$/,               stage: 'auth',    view: () => Views.otp() },
  { re: /^\/setup$/,             stage: 'setup',   view: () => Views.setup() },
  { re: /^\/onboard\/identity$/, stage: 'onboard', view: () => Views.onboardIdentity() },
  { re: /^\/onboard\/ids$/,      stage: 'onboard', view: () => Views.onboardIds() },
  { re: /^\/home$/,              stage: 'app',     view: () => Views.home() },
  { re: /^\/identity$/,          stage: 'app',     view: () => Views.identity() },
  { re: /^\/test-login$/,        stage: 'app',     view: () => Views.mobile('/identity') },
  { re: /^\/e2ee-v2-test$/,       stage: 'app',     view: () => Views.e2eeV2Test() },
  { re: /^\/calls$/,             stage: 'app',     view: () => Views.calls() },
  { re: /^\/call\/([\w-]+)$/,    stage: 'app',     view: id => Views.callDetail(id) },
  { re: /^\/e2ee-chat\/([0-9a-f-]{36})$/, stage: 'app', view: id => Views.e2eeChat(id) },
  { re: /^\/e2ee-chat$/,         stage: 'app',     view: () => Views.e2eeChat(null) },
  { re: /^\/chats$/,             stage: 'app',     view: () => Views.chats() },
  { re: /^\/chats\/new$/,        stage: 'app',     view: () => Views.chatsNew() },
  { re: /^\/groups\/new$/,       stage: 'app',     view: () => Views.groupCreate() },
  { re: /^\/group-chat\/([0-9a-f-]{36})$/, stage: 'app', view: id => Views.groupE2eeChat(id) },
  { re: /^\/group\/([0-9a-f-]{36})$/, stage: 'app', view: id => Views.groupDetail(id) },
  { re: /^\/chat\/([\w-]+)$/,    stage: 'app',     view: id => Views.chat(id) },
  { re: /^\/mail$/,              stage: 'app',     view: () => Views.mail() },
  { re: /^\/mail\/compose$/,     stage: 'app',     view: () => Views.mailCompose() },
  { re: /^\/mail\/([\w-]+)$/,    stage: 'app',     view: id => Views.mailMessage(id) },
  { re: /^\/pay$/,               stage: 'app',     view: () => Views.pay() },
  { re: /^\/pay\/new$/,          stage: 'app',     view: () => Views.payNew() },
  { re: /^\/pay\/([\w-]+)$/,     stage: 'app',     view: id => Views.payRequest(id) }
];

const Router = {
  stack: [], replacing: false,
  current() { return location.hash.replace(/^#/, ''); },
  go(path, { replace = false } = {}) {
    if (this.current() === path) { App.render(); return; }
    this.replacing = replace;
    if (replace) location.replace(`#${path}`); else location.hash = path;
  },
  back(fallback) {
    if (this.stack.length > 1) history.back();
    else this.go(fallback, { replace: true });
  },
  onChange() {
    const p = this.current();
    if (this.replacing) { this.stack[Math.max(0, this.stack.length - 1)] = p; this.replacing = false; }
    else if (this.stack.length > 1 && this.stack[this.stack.length - 2] === p) this.stack.pop();
    else if (this.stack[this.stack.length - 1] !== p) this.stack.push(p);
    App.render();
  }
};

/* =====================================================================
   17. APP (boot + render loop)
   ===================================================================== */
const App = {
  root: null,
  stage() {
    const s = Store.state;
    if (!s.account) return 'auth';
    if (!s.profile) return 'setup';
    if (!s.onboarding.complete) return 'onboard';
    return 'app';
  },
  defaultRoute() {
    return { auth: '/welcome', setup: '/setup', onboard: Store.state.ids ? '/onboard/ids' : '/onboard/identity', app: '/home' }[this.stage()];
  },
  render({ soft = false } = {}) {
    Lifecycle.run();
    const path = Router.current(), stage = this.stage();
    const route = ROUTES.find(r => r.re.test(path));
    if (!route || route.stage !== stage) return Router.go(this.defaultRoute(), { replace: true });
    if (path === '/otp' && !Auth.pending) return Router.go('/mobile', { replace: true });
    const scrollY = window.scrollY;
    this.root.replaceChildren(route.view(...path.match(route.re).slice(1)));
    if (soft) { window.scrollTo(0, scrollY); return; }
    window.scrollTo(0, 0);
    const title = document.getElementById('screen-title');
    if (title) title.focus({ preventScroll: true });
    document.title = title ? `${title.textContent} | BharathLink` : 'BharathLink';
  },
  refresh() { this.render({ soft: true }); },
  init() {
    this.root = document.getElementById('app');
    Toast.el = document.getElementById('toast');
    Store.init();
    Supabase.restoreTestSession();
    if (Supabase.accessToken) {
      Supabase.syncMyProfile().then(() => App.refresh()).catch(() => Supabase.clearTestSession());
    }
    Supabase.health().then(ok => { window.__bharathlinkSupabaseReachable = !!ok; }).catch(() => { window.__bharathlinkSupabaseReachable = false; });
    window.addEventListener('hashchange', () => Router.onChange());
    // Optional hooks for local testing only (open index.html?devtools=1). They expose no secrets
    // and go through the same guards as the UI, so they cannot create a "verified" state.
    if (new URLSearchParams(location.search).has('devtools')) {
      window.BharathLinkDev = Object.freeze({
        Validate,
        allocate: (accountId, taken = []) => LocalIdAllocator.allocate({ accountId, taken: new Set(taken.map(x => String(x).toUpperCase())) }),
        tryForceVerified: kind => Verification.record(kind, { status: VStatus.VERIFIED }, { id: 'rogue', authoritative: true }),
        tryForcePaymentVerified: id => Payments.setStatus(id, PayStatus.SERVER_VERIFIED, { attestation: { fake: true } }),
        snapshot: () => JSON.parse(JSON.stringify(Store.state))
      });
    }
    if (!Router.current()) Router.go(this.defaultRoute(), { replace: true });
    else { Router.stack = [Router.current()]; this.render(); }
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
