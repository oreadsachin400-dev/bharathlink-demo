<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Content Security Policy (Phase 1B):
  - No network access at all (connect-src 'none'), no external scripts, fonts or images.
  - JavaScript and CSS are external local files; inline execution is blocked.
  - frame-ancestors cannot be set from a meta tag; send it as an HTTP header when deploying.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14205A">
<meta name="description" content="BharathLink: one verified identity for calling, messaging, mail and payments. Phase 1B prototype.">
<link rel="icon" href="data:,">
<title>BharathLink</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<noscript><p>BharathLink needs JavaScript to run.</p></noscript>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
