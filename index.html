  payNew(mode = 'person') {
    const scanMode = mode === 'scan';
    const mk = (id, label, extra, hint) => {
      const input = h('input', Object.assign({ class: 'input', id, type: 'text', 'aria-describedby': `${id}-err` }, extra));
      const err = ErrorText(`${id}-err`);
      return { input, err, field: Field({ id, label, input, error: err, hint }) };
    };

    const mobile = mk(
      'pay-mobile',
      'Payee mobile number',
      { inputmode: 'numeric', autocomplete: 'tel', maxlength: '14', placeholder: '10-digit mobile number' },
      'Primary BharatLink identifier for person-to-person payment.'
    );
    const vpa = mk(
      'vpa',
      scanMode ? 'UPI ID from QR' : 'UPI ID (optional)',
      { autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', maxlength: '256', placeholder: 'name@bank' },
      scanMode
        ? 'Filled from the QR. BharatLink does not treat the QR itself as identity verification.'
        : 'Optional. BharatLink never invents a UPI ID from a phone number.'
    );
    const name = mk(
      'payee',
      scanMode ? 'Merchant / payee name' : 'Payee name (optional)',
      { autocomplete: 'off', maxlength: '60' },
      scanMode ? 'May come from the QR. Confirm the registered name in your UPI app.' : 'As you know them. This is not independently verified.'
    );
    const amt = mk('amount', 'Amount in rupees', { inputmode: 'decimal', autocomplete: 'off', maxlength: '9', placeholder: '0.00' });
    const note = mk('note', 'Note (optional)', { autocomplete: 'off', maxlength: String(CONFIG.LIMITS.payNote) });

    // Person payment contact picker: uses the existing privacy-preserving
    // ContactShare picker. It only runs after an explicit tap, reads one chosen
    // contact, never marks the phonebook name/number as verified, and keeps the
    // normal manual mobile-number field as the fallback.
    const contactStatus = h('p', { class: 'hint', 'aria-live': 'polite', style: 'margin:8px 4px 0' },
      'Choose a contact or enter the mobile number manually. Phonebook names are not treated as verified identity.');
    let contactPickBusy = false;
    const choosePayContact = async () => {
      if (contactPickBusy) return;
      setError(mobile.err, mobile.input, '');
      if (!ContactShare.pickerAvailable()) {
        const msg = 'This browser cannot open the phone contact picker here. Enter the mobile number manually.';
        contactStatus.textContent = msg;
        Toast.show('Contact picker is not available here.');
        mobile.input.focus();
        return;
      }
      contactPickBusy = true;
      try {
        // Payment only needs a phone number. Do not request email, because some
        // Android contact-picker implementations/local content:// contexts can
        // return an empty picker when unnecessary properties are requested.
        let supported = ['name', 'tel'];
        try {
          if (typeof navigator.contacts.getProperties === 'function') {
            const props = await navigator.contacts.getProperties();
            supported = supported.filter(p => props.includes(p));
          }
        } catch (_) {}
        if (!supported.includes('tel')) throw new Error('This browser cannot read phone numbers from contacts.');

        const pickWith = async props => {
          const res = await navigator.contacts.select(props, { multiple: false });
          const c = Array.isArray(res) ? res[0] : null;
          if (!c) return null;
          const pickedName = ContactShare.clean(Array.isArray(c.name) ? c.name[0] : '', ContactShare.MAX.name);
          const phones = (Array.isArray(c.tel) ? c.tel : []).map(x => ContactShare.phone(x)).filter(Boolean);
          return { name: pickedName, phones };
        };

        // First ask for the useful name + telephone pair. If Android returns an
        // empty selection in this local environment, retry once with telephone
        // only, which is the minimum property required for Pay a Person.
        let contact = await pickWith(supported.includes('name') ? ['name', 'tel'] : ['tel']);
        if (!contact && supported.includes('name')) contact = await pickWith(['tel']);
        if (!contact) {
          contactStatus.textContent = 'No contact was selected. You can try again or enter the mobile number manually.';
          return;
        }

        const validPhones = (contact.phones || []).map(raw => ({ raw, check: Validate.mobile(raw) })).filter(x => x.check.ok);
        if (!validPhones.length) throw new Error('The selected contact does not have a supported 10-digit Indian mobile number.');

        let selected = validPhones[0];
        if (validPhones.length > 1) {
          const choices = validPhones.map((x, i) => `${i + 1}. ${Util.formatMobile(x.check.value)}`).join('\n');
          const answer = window.prompt(`${contact.name || 'This contact'} has more than one mobile number. Choose one:\n\n${choices}`, '1');
          if (answer === null) return;
          const index = Number(answer) - 1;
          if (!Number.isInteger(index) || index < 0 || index >= validPhones.length) throw new Error('Choose a valid mobile number from the contact.');
          selected = validPhones[index];
        }

        mobile.input.value = selected.check.value;
        const checkedName = contact.name ? Validate.displayName(contact.name) : { ok: false };
        if (checkedName.ok) name.input.value = checkedName.value;
        contactStatus.textContent = `${contact.name || 'Contact'} selected. Confirm the mobile number before paying. Phonebook identity is not verified.`;
        Toast.show('Contact selected. Confirm the number before paying.');
        amt.input.focus();
      } catch (ex) {
        contactStatus.textContent = ex.message || 'Could not choose this contact. Enter the mobile number manually.';
        Toast.show(ex.message || 'Could not choose this contact.');
        mobile.input.focus();
      } finally {
        contactPickBusy = false;
      }
    };
    const contactPickerBox = h('div', { class: 'section', style: 'margin-top:0' },
      Button('Choose from contacts', { icon: 'phone', variant: 'secondary', onClick: choosePayContact }),
      contactStatus);

    const qrStatus = h('p', { class: 'hint', 'aria-live': 'polite' },
      'Scan a standard UPI payment QR. You will review every detail before opening a UPI app.');
    let qrBusy = false;

    const applyQr = raw => {
      const q = Payments.parseUpiQr(raw);
      vpa.input.value = q.payeeVpa;
      if (q.payeeName) name.input.value = q.payeeName;
      if (q.amount) amt.input.value = q.amount;
      if (q.note) note.input.value = q.note;
      qrStatus.textContent = `QR read: ${q.payeeVpa}. Review the recipient and amount before paying.`;
      return q;
    };

    const getQrDetector = async () => {
      if (!('BarcodeDetector' in window))
        throw new Error('QR scanning is not supported by this browser. Use Choose QR image or enter the UPI ID manually.');
      if (typeof BarcodeDetector.getSupportedFormats === 'function') {
        const formats = await BarcodeDetector.getSupportedFormats();
        if (!formats.includes('qr_code')) throw new Error('QR scanning is not supported by this browser.');
      }
      return new BarcodeDetector({ formats: ['qr_code'] });
    };

    const scanCamera = async () => {
      if (qrBusy) return;
      qrBusy = true;
      let stream = null, raf = 0, stopped = false, lastDetect = 0, overlay = null;
      const cleanup = () => {
        stopped = true;
        if (raf) cancelAnimationFrame(raf);
        if (stream) stream.getTracks().forEach(t => t.stop());
        overlay?.remove();
        qrBusy = false;
      };
      try {
        const detector = await getQrDetector();
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera scanning requires the HTTPS BharatLink site.');
        const video = h('video', { autoplay: true, muted: true, playsinline: true,
          style: 'width:100%;max-height:60vh;background:#000;border-radius:16px;object-fit:cover' });
        const msg = h('p', { class: 'hint', style: 'color:#fff;text-align:center;margin:10px 0' },
          'Point the camera at a UPI QR code.');
        const close = Button('Cancel', { variant: 'secondary', onClick: cleanup });
        const card = h('div', { style: 'width:min(100%,480px);background:#14205A;border-radius:20px;padding:14px' },
          video, msg, close);
        overlay = h('div', { style: 'position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:14px' }, card);
        document.body.appendChild(overlay);
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' } } });
        video.srcObject = stream;
        await video.play();

        const loop = async ts => {
          if (stopped) return;
          if (ts - lastDetect > 220 && video.readyState >= 2) {
            lastDetect = ts;
            try {
              const found = await detector.detect(video);
              const raw = found?.[0]?.rawValue;
              if (raw) {
                applyQr(raw);
                cleanup();
                Toast.show('UPI QR scanned. Review details before paying.');
                return;
              }
            } catch (_) {}
          }
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
      } catch (e) {
        cleanup();
        qrStatus.textContent = e.message || 'Could not scan QR code.';
        Toast.show(e.message || 'Could not scan QR code.');
      }
    };

    const qrFile = h('input', {
      type: 'file', accept: 'image/*', hidden: true,
      onChange: async e => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file || qrBusy) return;
        qrBusy = true;
        try {
          const detector = await getQrDetector();
          const bitmap = await createImageBitmap(file);
          try {
            const found = await detector.detect(bitmap);
            const raw = found?.[0]?.rawValue;
            if (!raw) throw new Error('No QR code found in this image.');
            applyQr(raw);
            Toast.show('UPI QR read from image. Review details before paying.');
          } finally { bitmap.close?.(); }
        } catch (e2) {
          qrStatus.textContent = e2.message || 'Could not read QR image.';
          Toast.show(e2.message || 'Could not read QR image.');
        } finally { qrBusy = false; }
      }
    });

    const qrBox = Section('Scan UPI QR',
      h('div', { class: 'btn-row' },
        Button('Scan QR with camera', { variant: 'secondary', onClick: scanCamera }),
        Button('Choose QR image', { variant: 'ghost', onClick: () => qrFile.click() })),
      qrFile, qrStatus);

    const formChildren = [];
    if (scanMode) formChildren.push(qrBox, vpa.field, name.field, amt.field, note.field);
    else formChildren.push(contactPickerBox, mobile.field, vpa.field, name.field, amt.field, note.field);

    const form = h('form', {
      novalidate: 'novalidate',
      onSubmit: e => {
        e.preventDefault();
        [mobile, vpa, name, amt, note].forEach(f => setError(f.err, f.input, ''));

        const rawMobile = scanMode ? '' : mobile.input.value.trim();
        const rawVpa = vpa.input.value.trim();

        const vM = rawMobile ? Validate.mobile(rawMobile) : { ok: true, value: '' };
        const vV = rawVpa ? Validate.vpa(rawVpa) : { ok: true, value: '' };
        const vA = Validate.amount(amt.input.value);
        const vN = name.input.value.trim() ? Validate.displayName(name.input.value) : { ok: true, value: '' };
        const vT = Validate.text(note.input.value.replace(/\n/g, ' '), CONFIG.LIMITS.payNote, 'note', { required: false });

        if (scanMode && !rawVpa) setError(vpa.err, vpa.input, 'Scan a UPI QR or enter the UPI ID.');
        if (!scanMode && !rawMobile) setError(mobile.err, mobile.input, 'Enter the payee mobile number.');
        if (!vT.ok) setError(note.err, note.input, vT.error);
        if (!vA.ok) setError(amt.err, amt.input, vA.error);
        if (!vN.ok) setError(name.err, name.input, vN.error);
        if (!vV.ok) setError(vpa.err, vpa.input, vV.error);
        if (!vM.ok) setError(mobile.err, mobile.input, vM.error);

        if ((scanMode && !rawVpa) || (!scanMode && !rawMobile) || !vM.ok || !vV.ok || !vA.ok || !vN.ok || !vT.ok) return;

        const id = Payments.create({
          kind: scanMode ? 'scan' : 'person',
          payeeMobile: vM.value,
          payeeVpa: vV.value,
          payeeName: vN.value,
          amount: vA.value,
          note: vT.value
        });
        Router.go(`/pay/${id}`, { replace: true });
      }
    }, ...formChildren, Button('Review payment', { type: 'submit' }));

    const node=Screen({
      title: scanMode ? 'Scan & Pay' : 'Pay a Person',
      back: '/pay',
      nav: 'pay',
      children: [
        scanMode
          ? h('p', { class: 'lede' }, 'Scan the shop or merchant UPI QR. Always confirm the recipient name before entering your UPI PIN.')
          : h('p', { class: 'lede' }, 'Enter the person’s mobile number. BharatLink will never guess a UPI ID that has not been resolved by an authorised provider.'),
        form
      ]
    });
    node.classList.add('bl-pay-sticky-v38');
    return node;
  },

  payRequest(id) {
    const r = Payments.get(id);
    if (!r) return Views.notFound('/pay');

    const meta = PayStatusMeta[r.status] || { label: r.status, tone: 'none' };
    const reported = r.status === PayStatus.CLIENT_SUCCESS || r.status === PayStatus.CLIENT_FAILURE;
    const report = status => () => { Payments.setStatus(r.id, status); App.refresh(); };
    const mobileOnly = !!r.payeeMobile && !r.payeeVpa;
    const scanPayment = r.kind === 'scan';

    const copyMobile = async () => {
      if (!r.payeeMobile) return;
      try {
        await navigator.clipboard.writeText(r.payeeMobile);
        Toast.show('Mobile number copied.');
      } catch (_) {
        Toast.show(`Payee mobile: ${r.payeeMobile}`);
      }
    };

    const recipientTrustHost=h('div',{class:'bl-entity-grid'});
    const renderUnverifiedRecipient=()=>recipientTrustHost.replaceChildren(
      StatusBadge(VStatus.NOT_CHECKED, mobileOnly ? 'Mobile not yet resolved' : 'Not independently verified'),
      h('p', { class: 'hint section' }, mobileOnly
        ? 'An authorised mobile-to-UPI resolver is not connected yet. BharatLink will not fabricate a UPI ID. Confirm the registered recipient name in your UPI app.'
        : 'The QR/UPI ID can be handed to your UPI app, but BharatLink does not call the recipient verified until an authorised provider confirms it.')
    );
    renderUnverifiedRecipient();
    if(r.payeeVpa&&Supabase.accessToken)setTimeout(async()=>{try{const ent=await EntityDirectory.byEndpoint('upi',r.payeeVpa);if(ent&&recipientTrustHost.isConnected)recipientTrustHost.replaceChildren(StatusBadge(VStatus.VERIFIED,'Verified entity endpoint'),EntityDirectory.verifiedInline(ent,`UPI ${r.payeeVpa}`));}catch(_){}} ,0);

    const node=Screen({ title: 'Review payment', back: '/pay', nav: 'pay', children: [
      h('div', { class: 'paycard' },
        h('p', { class: 'hint' }, 'Amount'),
        h('p', { class: 'amount' }, Util.rupees(r.amount)),
        h('dl', { class: 'kv' },
          KvRow('Payment type', scanPayment ? 'Scan & Pay' : 'Pay a Person'),
          r.payeeMobile ? KvRow('Mobile', `+91 ${r.payeeMobile}`) : null,
          r.payeeVpa ? KvRow('UPI ID', r.payeeVpa) : null,
          r.payeeName ? KvRow('Name shown', r.payeeName) : null,
          r.note ? KvRow('Note', r.note) : null)),

      Section('Recipient trust',recipientTrustHost),

      Section('Authorise in your UPI app',
        mobileOnly
          ? Button('Copy mobile number', { variant: 'secondary', icon: 'copy', onClick: copyMobile })
          : LinkButton('Continue to UPI app', Payments.upiLink(r), {
              icon: 'rupee',
              onClick: () => {
                if (r.status === PayStatus.CREATED) {
                  setTimeout(() => { Payments.setStatus(r.id, PayStatus.HANDED_OFF); App.refresh(); }, 300);
                }
              }
            }),
        h('p', { class: 'hint section' }, mobileOnly
          ? 'Open your preferred UPI app manually, choose Pay by mobile number, paste the number, verify the registered name, enter the amount shown above, and approve there.'
          : 'BharatLink passes the UPI ID and amount to your UPI app. Your UPI PIN is entered only there. Opening the app does not prove that payment succeeded.'),
        r.status === PayStatus.CREATED
          ? Button(mobileOnly ? 'I opened my UPI app' : 'I continued to my UPI app', {
              variant: 'ghost',
              onClick: report(PayStatus.HANDED_OFF)
            })
          : null),

      Section('Result',
        h('dl', { class: 'kv paycard' },
          KvRow('Status', ToneBadge(meta.tone, meta.label)),
          KvRow('Bank / PSP confirmation', StatusBadge(VStatus.NOT_CHECKED, 'Not connected'))),
        r.status !== PayStatus.CREATED ? h('div', { class: 'stack section' },
          h('p', { class: 'hint' }, reported
            ? 'This is your local report only. It is not confirmed by the bank, NPCI, PSP or BharatLink.'
            : 'What did your UPI app show? Until a server confirmation is connected, this remains an unverified local report.'),
          h('div', { class: 'btn-row' },
            Button('It showed paid', {
              variant: 'secondary',
              disabled: r.status === PayStatus.CLIENT_SUCCESS,
              onClick: report(PayStatus.CLIENT_SUCCESS)
            }),
            Button('It failed', {
              variant: 'secondary',
              disabled: r.status === PayStatus.CLIENT_FAILURE,
              onClick: report(PayStatus.CLIENT_FAILURE)
            }))) : null)
    ] });
    node.classList.add('bl-pay-sticky-v38');
    return node;
  },

  /* ----- E2EE V2 device registration test (test build only) ----- */
  e2eeV2Test() {
    const T = E2EEV2DeviceTest, r = T.result;
    if (!r && !T.running && !T.autoRan) { T.autoRan = true; setTimeout(() => T.run(), 0); }
    const badge = st => st === 'pass' ? ToneBadge('verified', 'PASS') : st === 'fail' ? ToneBadge('failed', 'FAIL')
      : st === 'pending' ? ToneBadge('pending', 'Running\u2026') : st === 'skip' ? ToneBadge('none', 'Skipped') : ToneBadge('none', 'Not run');
    const overall = !r ? null : T.running ? 'pending' : (r.auth === 'pass' && r.keys === 'pass' && r.rpc === 'pass' ? 'pass' : 'fail');
    const details = r ? [
      r.userId ? KvRow('User ID', r.userId) : null,
      r.returnedId ? KvRow('Returned device ID', r.returnedId) : null,
      KvRow('Curve25519 test key', 'X25519 (WebCrypto, test only)'),
      r.signingAlg ? KvRow('Signing test key', r.signingAlg === 'Ed25519' ? 'Ed25519 (WebCrypto, test only)' : 'ECDSA P-256 (WebCrypto fallback, test only)') : null,
      r.sentParams.length ? KvRow('Parameters sent', r.sentParams.join(', ')) : null,
      r.server ? KvRow('Server response', r.server) : null
    ] : [];
    return Screen({ title: 'E2EE V2 device test', back: '/identity', nav: 'identity', children: [
      Notice('dev', [h('strong', null, 'Test build only. '),
        'Checks your current sign-in, local key generation and the V2 device registration RPC. These are temporary WebCrypto test keys for backend plumbing only, not production V2 keys, and there is no Double Ratchet here. Private keys never leave this device. V1 messaging is not changed.']),
      h('dl', { class: 'kv paycard section', 'aria-live': 'polite' },
        KvRow('Authenticated user', badge(r?.auth)),
        KvRow('Local key generation', badge(r?.keys)),
        KvRow('V2 device registration RPC', badge(r?.rpc)),
        KvRow('Device ID', r?.deviceId || '\u2014'),
        KvRow('Overall', badge(overall))),

          if (!window.confirm('Delete the local test device and its test keys from this browser? Its server registration stays until revoked.')) return;
          try { await T.forget(); Toast.show('Local test device deleted.'); } catch (e) { Toast.show(e.message || 'Could not delete the local test device.'); }
        } }))

  notFound(back) {

/* =====================================================================
   16. ROUTER (hash-based, so browser and Android back work)
   Each route declares the onboarding stage it belongs to; the guard in
   App.render redirects to the right screen for the account's stage.
   ===================================================================== */
const ROUTES = [
  { re: /^\/welcome$/,           stage: 'auth',    view: () => Views.welcome() },
  { re: /^\/mobile$/,            stage: 'auth',    view: () => Views.mobile('signup') },
  { re: /^\/otp$/,               stage: 'auth',    view: () => Views.otp('signup') },
  { re: /^\/setup$/,             stage: 'setup',   view: () => Views.setup() },
  { re: /^\/onboard\/identity$/, stage: 'onboard', view: () => Views.onboardIdentity() },
  { re: /^\/onboard\/ids$/,      stage: 'onboard', view: () => Views.onboardIds() },
  { re: /^\/home$/,              stage: 'app',     view: () => Views.home() },
  { re: /^\/trust-ai$/,          stage: 'app',     view: () => Views.trustAi() },
  { re: /^\/identity$/,          stage: 'app',     view: () => Views.identity() },
  { re: /^\/entities\/([0-9a-f-]{36})\/contacts$/, stage: 'app', view: id => Views.entityContacts(id) },
  { re: /^\/entities$/,          stage: 'app',     view: () => Views.entities() },
  { re: /^\/mobile-link$/,       stage: 'app',     view: () => Views.mobile('link') },
  { re: /^\/otp-link$/,          stage: 'app',     view: () => Views.otp('link') },
  { re: /^\/test-login$/,        stage: 'app',     view: () => Views.testLogin('/identity') },
  { re: /^\/e2ee-v2-test$/,       stage: 'app',     view: () => Views.e2eeV2Test() },
  { re: /^\/calls$/,             stage: 'app',     view: () => Views.calls() },
  { re: /^\/call\/([\w-]+)$/,    stage: 'app',     view: id => Views.callDetail(id) },
  { re: /^\/e2ee-chat\/([0-9a-f-]{36})$/, stage: 'app', view: id => Views.e2eeChat(id) },
  { re: /^\/e2ee-chat$/,         stage: 'app',     view: () => Views.e2eeChat(null) },
  { re: /^\/chats$/,             stage: 'app',     view: () => Views.chats() },
  { re: /^\/chats\/new$/,        stage: 'app',     view: () => Views.chatsNew() },
  { re: /^\/groups\/new$/,       stage: 'app',     view: () => Views.groupCreate() },
  { re: /^\/group-chat\/([0-9a-f-]{36})$/, stage: 'app', view: id => Views.groupE2eeChat(id) },
  { re: /^\/group\/([0-9a-f-]{36})$/, stage: 'app', view: id => Views.groupDetail(id) },
  { re: /^\/chat\/([\w-]+)$/,    stage: 'app',     view: id => Views.chat(id) },
  { re: /^\/mail$/,              stage: 'app',     view: () => Views.mail() },
  { re: /^\/mail\/compose(?:\?draft=([\w-]+))?$/, stage: 'app', view: id => { if(id){const d=Mail.get(id);if(d)Mail.composeSeed=Object.assign({draftId:id,title:'Draft'},d);} return Views.mailCompose(); } },
  { re: /^\/mail\/([\w-]+)$/,    stage: 'app',     view: id => Views.mailMessage(id) },
  { re: /^\/pay$/,               stage: 'app',     view: () => Views.pay() },
  { re: /^\/pay\/scan$/,          stage: 'app',     view: () => Views.payNew('scan') },
  { re: /^\/pay\/person$/,        stage: 'app',     view: () => Views.payNew('person') },
  { re: /^\/pay\/new$/,           stage: 'app',     view: () => Views.payNew('person') },
  { re: /^\/pay\/([\w-]+)$/,     stage: 'app',     view: id => Views.payRequest(id) }
];

const Router = {
  stack: [], replacing: false,
  current() { return location.hash.replace(/^#/, ''); },
  go(path, { replace = false } = {}) {
    if (this.current() === path) { App.render(); return; }
    this.replacing = replace;
    if (replace) location.replace(`#${path}`); else location.hash = path;
  },
  back(fallback) {
    if (this.stack.length > 1) history.back();
    else this.go(fallback, { replace: true });
  },
  onChange() {
    const p = this.current();
    if (this.replacing) { this.stack[Math.max(0, this.stack.length - 1)] = p; this.replacing = false; }
    else if (this.stack.length > 1 && this.stack[this.stack.length - 2] === p) this.stack.pop();
    else if (this.stack[this.stack.length - 1] !== p) this.stack.push(p);
    App.render();
  }
};

/* =====================================================================
   17. APP (boot + render loop)
   ===================================================================== */
const App = {
  root: null,
  stage() {
    const s = Store.state;
    if (!s.account) return 'auth';
    if (!s.profile) return 'setup';
    if (!s.onboarding.complete) return 'onboard';
    return 'app';
  },
  defaultRoute() {
    return { auth: '/welcome', setup: '/setup', onboard: Store.state.ids ? '/onboard/ids' : '/onboard/identity', app: '/home' }[this.stage()];
  },
  render({ soft = false } = {}) {
    Lifecycle.run();
    const path = Router.current(), stage = this.stage();
    const route = ROUTES.find(r => r.re.test(path));
    if (!route || route.stage !== stage) return Router.go(this.defaultRoute(), { replace: true });
    if(stage==='app'&&LockSecurity.appLockEnabled()&&!LockSecurity._appUnlocked){
      this.root.replaceChildren(LockSecurity.appGate());
      document.title='Locked | BharathLink';
      return;
    }
    if (path === '/otp' && !Auth.pending) return Router.go('/mobile', { replace: true });
    if (path === '/otp-link' && !Auth.pending) return Router.go('/mobile-link', { replace: true });
    const scrollY = window.scrollY;
    this.root.replaceChildren(route.view(...path.match(route.re).slice(1)));
    if (soft) { window.scrollTo(0, scrollY); return; }
    window.scrollTo(0, 0);
    const title = document.getElementById('screen-title');
    if (title) title.focus({ preventScroll: true });
    document.title = title ? `${title.textContent} | BharathLink` : 'BharathLink';
  },
  refresh() { this.render({ soft: true }); },
  init() {
    this.root = document.getElementById('app');
    Toast.el = document.getElementById('toast');
    Store.init();
    LockSecurity.installLifecycle();
    Supabase.restoreTestSession();
    if (Supabase.accessToken) {
      Supabase.syncMyProfile().then(() => {
        App.refresh();
        if('Notification' in window&&Notification.permission==='granted'&&'PushManager' in window){
          Mail.ensurePushSubscription().catch(ex=>console.warn('[BharathMail push] subscription refresh failed:',ex));
        }
      }).catch(() => Supabase.clearTestSession());
    }
    Supabase.health().then(ok => { window.__bharathlinkSupabaseReachable = !!ok; }).catch(() => { window.__bharathlinkSupabaseReachable = false; });
    window.addEventListener('hashchange', () => Router.onChange());
    // Optional hooks for local testing only (open index.html?devtools=1). They expose no secrets
    // and go through the same guards as the UI, so they cannot create a "verified" state.
    if (new URLSearchParams(location.search).has('devtools')) {
      window.BharathLinkDev = Object.freeze({
        Validate,
        allocate: (accountId, taken = []) => LocalIdAllocator.allocate({ accountId, taken: new Set(taken.map(x => String(x).toUpperCase())) }),
        tryForceVerified: kind => Verification.record(kind, { status: VStatus.VERIFIED }, { id: 'rogue', authoritative: true }),
        tryForcePaymentVerified: id => Payments.setStatus(id, PayStatus.SERVER_VERIFIED, { attestation: { fake: true } }),
        snapshot: () => JSON.parse(JSON.stringify(Store.state))
      });
    }
    if (!Router.current()) Router.go(this.defaultRoute(), { replace: true });
    else { Router.stack = [Router.current()]; this.render(); }
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
// BharatLink mobile-first OTP onboarding restored 2026-09-26.
})();
</script>
